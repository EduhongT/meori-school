<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7EF">
<title>머리에 그리는 AI 스쿨</title>
<style>
  :root{--paper:#FBF7EF;--card:#FFF;--ink:#2A2622;--muted:#8A8073;--line:#E9E1D2;
        --cinnabar:#C8453B;--celadon:#5E8C7B;--night:#10162b;--tap:60px;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.55;
    font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;}
  .app{max-width:460px;margin:0 auto;min-height:100vh;padding-bottom:env(safe-area-inset-bottom);}
  header{position:sticky;top:0;z-index:5;background:rgba(251,247,239,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px;}
  .logo{width:34px;height:34px;flex:0 0 34px;}
  .brand b{font-size:17px;font-weight:800;letter-spacing:-.02em;display:block;}
  .brand span{font-size:11.5px;color:var(--muted);}
  .back{border:0;background:none;font-size:17px;color:var(--ink);padding:6px 6px 6px 0;cursor:pointer;font-weight:700;}
  main{padding:18px;}
  h2.greet{font-size:22px;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em;}
  p.lead{color:var(--muted);font-size:14px;margin:0 0 18px;}
  .area{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;cursor:pointer;min-height:var(--tap);}
  .area:active{transform:scale(.99);}
  .chip{width:48px;height:48px;flex:0 0 48px;border-radius:14px;display:flex;align-items:center;
    justify-content:center;color:#fff;font-weight:800;font-size:20px;}
  .area .t b{font-size:19px;font-weight:800;display:block;}.area .t span{font-size:13px;color:var(--muted);}
  .area .cnt{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);}.area .cnt b{display:block;font-size:18px;color:var(--ink);}
  .chev{margin-left:8px;color:var(--muted);font-size:20px;}
  .progress{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px;}
  .bar i{display:block;height:100%;background:var(--celadon);border-radius:99px;}
  .lesson{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;min-height:var(--tap);}
  .lesson:disabled{opacity:.5;}
  .num{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:#F3ECDD;display:flex;
    align-items:center;justify-content:center;font-weight:800;font-size:16px;}
  .lesson.done .num{background:var(--celadon);color:#fff;}
  .lesson .lt b{font-size:17px;font-weight:700;display:block;}.lesson .lt span{font-size:12.5px;color:var(--muted);}
  .state{margin-left:auto;font-size:20px;}
  .crumbs{font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  h1.title{font-size:23px;font-weight:800;margin:0 0 6px;letter-spacing:-.02em;}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .tag{font-size:12px;background:#F3ECDD;color:#6b6052;border-radius:99px;padding:5px 10px;}
  .obj{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:16px;margin-bottom:14px;}
  .stages{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch;}
  .stage{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:9px 15px;
    font-size:14px;font-weight:700;cursor:pointer;color:var(--muted);}
  .stage.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:200px;}
  .panel h3{margin:0 0 10px;font-size:15px;color:var(--cinnabar);letter-spacing:.02em;}
  ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;}
  ol.steps li{counter-increment:s;position:relative;padding:9px 0 9px 34px;border-bottom:1px solid var(--line);font-size:15.5px;}
  ol.steps li:last-child{border-bottom:0;}
  ol.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:24px;height:24px;background:#F3ECDD;
    border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#6b6052;}
  .blk{padding:10px 0;border-bottom:1px solid var(--line);}.blk:last-child{border-bottom:0;}
  .blk b{display:block;font-size:15.5px;margin-bottom:3px;}.blk span{font-size:14px;color:#6b6052;}
  .ph-note{margin-top:12px;font-size:12.5px;color:var(--muted);}
  .ph-note code{background:#F3ECDD;border-radius:5px;padding:1px 5px;}
  .spair{padding:12px 0;border-bottom:1px solid var(--line);}
  .spair:last-child{border-bottom:0;}
  .stxt{display:flex;gap:11px;align-items:flex-start;font-size:15.5px;}
  .snum{flex:0 0 24px;width:24px;height:24px;margin-top:1px;background:#F3ECDD;border-radius:8px;display:flex;
    align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#6b6052;}
  .simg{margin:10px 0 0 35px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#FCFAF4;}
  .simg img{width:100%;display:block;}
  .dimg{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#FCFAF4;margin-bottom:12px;}
  .dimg img{width:100%;display:block;}
  .aicard{border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:9px;overflow:hidden;cursor:pointer;}
  .aihead{display:flex;align-items:center;gap:12px;padding:13px 14px;}
  .aiemo{font-size:24px;flex:0 0 auto;}
  .aimain{flex:1;}
  .aititle{font-size:16.5px;font-weight:800;color:var(--ink);}
  .aidesc{font-size:13px;color:#7a715c;margin-top:2px;line-height:1.4;}
  .aichev{flex:0 0 auto;color:var(--muted);font-size:15px;}
  .aiex{display:none;padding:0 14px 13px 50px;}
  .aiex.on{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .aiq{font-size:15.5px;font-weight:700;color:var(--cinnabar);line-height:1.5;flex:1;min-width:60%;}
  .lesson.soon{opacity:.92;background:#F6F2FA;border-color:#E2D7EE;}
  .lesson.soon .num{background:#EFE7F7;}
  .soonbadge{background:#8A6FB0;color:#fff;border-radius:9px;padding:2px 9px;font-size:12px;font-weight:800;}
  .soonbox{background:#F3EEF8;border:1px solid #E0D5EC;border-radius:12px;padding:12px 14px;font-size:13.5px;color:#5a4a73;line-height:1.55;margin-bottom:12px;}
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
  .photo{position:relative;aspect-ratio:1;border:1px dashed var(--line);border-radius:10px;overflow:hidden;
    background:#FCFAF4;display:flex;align-items:center;justify-content:center;}
  .photo img{width:100%;height:100%;object-fit:cover;position:relative;z-index:2;}
  .photo b{position:absolute;z-index:1;font-size:10.5px;color:var(--muted);padding:6px;text-align:center;line-height:1.3;}
  .cv-wrap{position:relative;height:280px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;}
  .cv-guide{position:absolute;inset:0;opacity:.5;pointer-events:none;}
  .cv-guide svg{width:100%;height:100%;}
  canvas.cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  .cv-bar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .pen{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;}
  .pen.on{box-shadow:0 0 0 2px var(--ink);}
  .tbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer;}
  .tbtn.on{background:var(--ink);color:#fff;}
  .svgv{background:linear-gradient(180deg,#10162b,#1b2440);border-radius:14px;overflow:hidden;}
  .svgv.light{background:#FCFAF4;border:1px solid var(--line);}
  .svgv svg{display:block;width:100%;height:auto;}
  .svgv .step{opacity:0;transition:opacity .4s;}
  .svgv .step.on{opacity:1;}
  .svrow{display:flex;gap:8px;margin-top:10px;}
  .svrow button{flex:1;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:12px;
    font-size:15px;font-weight:700;cursor:pointer;min-height:48px;}
  .svrow button.pri{background:var(--cinnabar);color:#fff;border-color:var(--cinnabar);}
  .svlabel{margin-top:10px;font-size:14px;}.svlabel b{color:var(--cinnabar);}
  .kw{display:flex;gap:10px;flex-wrap:wrap;}.kw .w{background:#F3ECDD;border-radius:12px;padding:10px 14px;}
  .kw .w b{font-size:19px;display:block;}.kw .w span{font-size:12px;color:#7a715c;}
  .vsec{margin-bottom:14px;}
  .vt{font-size:11px;font-weight:800;color:#7a715c;letter-spacing:.05em;margin:4px 0 8px;}
  .vrow{display:flex;align-items:center;gap:10px;background:#F8F2E6;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:7px;}
  .vkr{font-size:18px;font-weight:800;min-width:64px;}
  .vbody{flex:1;}.vrom{font-size:12px;color:var(--cinnabar);font-weight:700;}.ven{font-size:12.5px;color:#6b6052;}
  .vplay{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:none;background:var(--celadon);color:#fff;font-size:13px;cursor:pointer;}
  .vplay.sm{width:26px;height:26px;font-size:11px;vertical-align:middle;}
  .scard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px;}
  .slbl{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--cinnabar);border-radius:8px;padding:2px 9px;margin-bottom:8px;}
  .skr{font-size:18px;font-weight:700;line-height:1.5;}.srom{font-size:12.5px;color:var(--celadon);font-weight:700;margin-top:4px;}.sen{font-size:13px;color:#6b6052;margin-top:2px;}
  .ccard{background:#EEF2F6;border-radius:14px;padding:13px 15px;margin-bottom:10px;}
  .clbl{font-size:12px;font-weight:800;color:#3a5a7a;margin-bottom:6px;}.ctxt{font-size:13.5px;line-height:1.6;color:#42463f;}
  .donebtn{display:flex;justify-content:center;align-items:center;margin-top:14px;background:var(--celadon);color:#fff;
    border:0;font-weight:800;font-size:17px;border-radius:16px;padding:16px;width:100%;cursor:pointer;}
  footer{padding:24px 18px 34px;text-align:center;color:var(--muted);font-size:12px;}
</style></head>
<body><div class="app">
  <header>
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#2A2622" stroke-width="2"/>
      <path d="M11 25 C 15 12, 25 12, 29 25" fill="none" stroke="#C8453B" stroke-width="2.6" stroke-linecap="round"/>

  </header>
  <main id="main"></main>
  <footer>Meori Art</footer>
</div>

가 왜 다 다른가요?", "큰 네모와 작은 네모를 섞어 균형을 맞췄어요. 한쪽이 무거우면 다른 쪽을 가볍게 해서 전체가 안정돼 보이게 한 거예요."], ["따라 그리기 쉬운가요?", "네, 아주 좋아요. 자를 대고 곧은 선을 긋고 칸을 빨강·파랑·노랑으로 칠하면 돼요. 처음 그리시는 분께 딱 맞습니다."], ["이런 그림이 어디에 쓰였나요?", "옷·가방·건물 디자인에 많이 쓰였어요. 지금도 거리에서 몬드리안 무늬를 자주 볼 수 있답니다."], ["몬드리안은 무엇을 좋아했나요?", "춤과 음악을 좋아했어요. 경쾌한 리듬을 색과 네모의 배치로 표현하려 했지요."], ["이 그림이 왜 중요한가요?", "복잡한 걸 단순하게 줄이는 현대 디자인의 출발점이 된 그림이에요. 단순함 속의 아름다움을 보여줍니다."]]}, {"n": 2, "id": "myeonghwa:matisse-icarus", "title": "마티스 · 이카루스", "diff": "🌱", "obj": "마티스의 «이카루스»을 단계로 따라 그려보자.", "type": "svg", "meta": "마티스 · 프랑스", "note": "단계 SVG 완성 (신규 15작 · 3버튼 표준)", "viewImg": "myeonghwa/matisse-icarus/original.jpg", "svgViewer": "<svg viewBox=\"0 0 520 785\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <path d=\"M318,96\n      C342,102 356,124 352,150\n      C349,168 340,181 328,190\n      C344,206 356,254 358,318\n      C360,374 356,414 352,444\n      C316,458 272,458 236,446\n      C230,412 227,366 229,312\n      C232,252 243,206 258,184\n      C248,176 242,161 243,145\n      C245,116 294,90 318,96 Z\"/>\n  </g><g class=\"step\" data-step=\"2\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <!-- 왼팔: 어깨에서 위로 뻗어 끝이 뾰족하게 -->\n    <path d=\"M252,124\n      C204,98 152,70 106,52\n      C90,46 78,46 76,54\n      C74,62 86,74 102,86\n      C148,124 198,180 240,236\"/>\n    <!-- 오른팔: 어깨에서 밖으로 나가 아래로 흘러내림 -->\n    <path d=\"M360,206\n      C400,208 430,230 440,266\n      C450,298 448,328 434,350\n      C428,360 418,362 414,350\n      C406,324 394,286 380,254\n      C374,240 366,230 356,226\"/>\n  </g><g class=\"step\" data-step=\"3\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <!-- 오른다리 -->\n    <path d=\"M354,446\n      C370,486 376,544 366,596\n      C354,656 330,712 300,752\n      C292,76   </g><g>\n    <ellipse cx=\"290\" cy=\"262\" rx=\"17\" ry=\"20\" fill=\"#9aa0b8\"/>\n  </g><g fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2.5\" stroke-linejoin=\"round\">\n    <use class=\"starline\" href=\"#burstA\" transform=\"translate(56,150) scale(0.85) rotate(-14)\"/>\n    <use class=\"starline\" href=\"#burstB\" transform=\"translate(66,290) scale(0.92) rotate(22)\"/>\n    <use class=\"starline\" href=\"#burstB\" transform=\"translate(344,62) scale(1.05) rotate(8)\"/>\n    <use class=\"starline\" href=\"#burstA\" transform=\"translate(506,196) scale(1.3) rotate(96)\"/>\n    <use class=\"starline\" href=\"#burstA\" transform=\"translate(56,668) scale(1.0) rotate(40)\"/>\n    <use class=\"starline\" href=\"#burstB\" transform=\"translate(448,688) scale(1.0) rotate(-30)\"/>\n  </g></g></svg>", "svgSteps": [{"title": "머리와 몸통", "tip": "한 덩어리로 크게."}, {"title": "팔 두 개", "tip": "위로 훨훨, 아래로 길게."}, {"title": "다리 두 개", "tip": "시원하게 벌려서."}, {"title": "검정으로 속을 꽉 채우기", "tip": "검정으로 속을 꽉 채우기."}, {"title": "가슴에 빨간 점", "tip": "콩콩 뛰는 심장."}, {"title": "둘레에 노란 별", "tip": "마음껏."}, {"title": "파란 하늘 채색", "tip": "별은 노랗게 반짝."}], "qna": [["이 그림은 무엇을 그린 건가요?", "그리스 신화에서 하늘을 난 이카루스예요. 파란 하늘에 검은 사람, 가슴엔 빨간 점 하나, 둘레엔 노란 별이 터지지요."], ["가슴의 빨간 점은 무엇인가요?", "콩콩 뛰는 심장이라고들 해요. 하늘을 나는 설렘, 살아 있다는 두근거림을 점 하나로 담은 거지요."], ["마티스는 어떤 화가였나요?", "프랑스의 화가로, 밝고 시원한 색을 사랑했어요. '색채의 마술사'라고 불릴 만큼 색을 잘 썼지요."], ["왜 가위로 그림을 만들었나요?", "노년에 큰 수술을 하고 붓을 오래 들 수 없게 되자, 침대에서 색종이를 가위로 오려 그림을 만들었어요. '가위로 그린다'고 스스로 말했답니다."], ["이 그림은 언제 만들었나요?", "1946년 무렵, 「재즈」라는 책의 그림으로 만들었어요. 마티스가 일흔이 넘었을 때지요."], ["사람이 떨어지는 걸까요, 춤추는 걸까요?", "보는 사람마다 달라요. 떨어지는 이카루스 같기도, 별 사이에서 춤추는 사람 같기도 — 그 자유로움이 이 그림의 매력이지요."], ["왜 눈·코·입이 없나요?", "실루엣이라 얼굴이 없어요. 그래서 틀릴 곳도 없지요. 몸이 삐뚤어질수록 오히려 더 춤추는 것처럼 보인답니다."], ["별 모양이 뾰족뾰족해요.", "가위로 오려서 그래요. 반듯한 별이 아니라 터지듯 뾰족한 별이라 더 생기 있어 보이지요."], ["나도 그릴 수 있을까요?", "그럼요. 머리·몸을 한 덩어리로 크게 그려 검게 채우고, 빨간 점 하나와 노란 별 몇 개면 완성이에요."], ["이 그림이 왜 좋은가요?", "몸이 불편해진 뒤에도 새 방법을 찾아 계속 만든 화가의 마음 때문이에요. 늦은 나이의 새 시작을 응원해 주는 그림이지요."]], "korean2": {"terms": [["컷아웃", "keot-a-ut", "cut-out"], ["실루엣", "sil-lu-et", "silhouette"]], "words": [["별", "byeol", "star"], ["심장", "sim-jang", "heart"], ["하늘", "ha-neul", "sky"], ["가위", "ga-wi", "scissors"]], "sentences": [["사람이 하늘을 납니다.", "Sa-ram-i ha-neul-eul nam-ni-da.", "A person flies in the sky."]], "culture": [["🎨 가위로 그린 마티스", "마티스는 노년에 붓 대신 가위로 색종이를 오려 그림을 만들었습니다. '가위로 그린다'는 그의 말처럼, 늦은 나이에도 새 길을 연 화가입니다."]]}}, {"n": 3, "id": "myeonghwa:monet-impression", "title": "모네 · 인상, 해돋이", "diff": "🌱", "obj": "모네의 «인상, 해돋이»을 단계로 따라 그려보자.", "type": "svg", "meta": "모네 · 프랑스", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/monet-impression/original.jpg", "svgViewer": "<svg viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><line x1=\"0\" y1=\"150\" x2=\"400\" y2=\"150\" stroke=\"#f3ead4\" stroke-width=\"2.2\" stroke-linecap=\"round\"/></g><g class=\"step\" data-step=\"2\"><circle cx=\"120\" cy=\"110\" r=\"26\" fill=\"#e08a3c\" stroke=\"#e08a3c\" stroke-width=\"2.6\"/></g><g class=\"step\" data-step=\"3\"><line x1=\"102\" y1=\"170\" x2=\"138\" y2=\"170\" stroke=\"#f3ead4\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"108\" y1=\"186\" x2=\"132\" y2=\"186\" stroke=\"#f3ead4\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"102\" y1=\"202\" x2=\"138\" y2=\"202\" stroke=\"#f3ead4\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"108\" y1=\"218\" x2=\"132\" y2=\"218\" stroke=\"#f3ead4\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"102\" y1=\"234\" x2=\"138\" y2=\"234\" stroke=\"#f3ead4\" stroke-width=\"3\" stroke-linecap=\"round\"/></g><g class=\"step\" data-step=\"4\"><path d=\"M0 205 C 60 196,110 214,170 205 C 230 196,300 214,400 205\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M0 235 C 70 226,120 244,190 235 C 260 226,330 244,400 235\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.2\" stroke-linecap=\"round\" strok oke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M0 235 C 70 226,120 244,190 235 C 260 226,330 244,400 235\" fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g ><path d=\"M150 250 L250 250 L235 268 L165 268 Z\" fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"200\" y1=\"250\" x2=\"200\" y2=\"212\" stroke=\"#9aa0b8\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"200\" y1=\"212\" x2=\"232\" y2=\"238\" stroke=\"#9aa0b8\" stroke-width=\"2.2\" stroke-linecap=\"round\"/></g><g ><line x1=\"300\" y1=\"150\" x2=\"300\" y2=\"120\" stroke=\"#9aa0b8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"322\" y1=\"150\" x2=\"322\" y2=\"120\" stroke=\"#9aa0b8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"344\" y1=\"150\" x2=\"344\" y2=\"120\" stroke=\"#9aa0b8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"366\" y1=\"150\" x2=\"366\" y2=\"120\" stroke=\"#9aa0b8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/></g></svg>", "svgSteps": [{"title": "수평선 긋기", "tip": "바다와 하늘이 만나는 가로선을 길게 긋는다."}, {"title": "해 그리기", "tip": "하늘에 작고 둥근 해를 그린다."}, {"title": "물 위 햇빛", "tip": "해 아래로 짧은 가로선을 점점이 내려 긋는다."}, {"title": "물결 선", "tip": "바다에 부드러운 물결선을 몇 줄 긋는다."}, {"title": "작은 배", "tip": "앞쪽에 배 한 척을 몇 개의 선으로 그린다."}, {"title": "먼 배경", "tip": "멀리 흐릿한 돛대·굴뚝을 세로선으로 살짝 더해 완성."}], "korean2": {"terms": [["인상", "in-sang", "impression"], ["빛", "bit", "light"]], "words": [["해", "hae", "sun"], ["바다", "ba-da", "sea"], ["아침", "a-chim", "morning"], ["배", "bae", "boat"], ["안개", "an-gae", "fog"]], "sentences": [["아침 해가 떠오릅니다.", "A-chim hae-ga tteo-o-reum-ni-da.", "The morning sun rises."]], "culture": [["🎨 모네와 인상주의", "'인상, 해돋이'에서 인상주의라는 이름이 나왔습니다. 모네는 빛과 순간의 느낌을 그렸습니다."]]}, "qna": [["이 그림은 무엇을 그린 건가요?", "이른 아침 항구에서 해가 떠오르는 모습이에요. 안개 낀 바다 위로 붉은 해와 작은 배들이 보이지요."], ["왜 흐릿하게 그렸나요?", "모네는 또렷한 형태보다 '그 순간의 빛과 느낌'을 담으려 했어요. 그래서 안개처럼 부드럽고 흐릿하게 그렸답니다."], ["'인상주의'가 이 그림에서 나왔나요?", "맞아요. 제목이 '인상, 해돋이'라서 여기서 '인상주의'라는 이름이 생겼어요. 미술 역사에서 아주 중요한 그림이지요."], ["붉은 해가 눈에 확 띄어요.", "주변은 푸르스름한데 해만 주황빛이라 더 도드라져 보여요. 모네가 색의 대비를 잘 쓴 거예요."], ["이 그림은 언제 그렸나요?", "1872년, 프랑스 르아브르라는 항구 도시에서 그렸어요."], ["모네는 무엇을 좋아했나요?", "물·빛·하늘을 좋아해 같은 풍경도 시간과 날씨를 바꿔가며 여러 번 그렸어요."], ["배들은 무엇인가요?", "항구의 작은 고깃배와 멀리 보이는 공장 굴뚝이에요. 평범한 일상의 아침 풍경이지요."], ["이 그림은 지금 어디에 있나요?", "프랑스 파리의 마르모탕 모네 미술관에 있어요."], ["나도 그릴 수 있을까요?", "네. 흐린 파랑으로 바다와 하늘을 칠하고 주황 동그라미로 해를 그리면 분위기가 살아나요."], ["이 그림이 왜 중요한가요?", "보이는 대로가 아니라 느낀 대로 그리는 새 길을 열었어요. 모네가 미술의 흐름을 바꾼 그림입니다."]]}, {"n": 4, "id": "myeonghwa:vangogh-starry-night", "title": "고흐 · 별이 빛나는 밤", "diff": "🌱", "obj": "고흐의 «별이 빛나는 밤»을 단계로 따라 그려보자.", "type": "svg", "meta": "고흐 · 네덜란드", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/vangogh-starry-night/original.jpg", "svgViewer": "<svg viewBox=\"0 0 360 600\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><path d=\"M 0 488 C 70 470, 130 500, 200 482 C 270 466, 320 492, 360 478\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\"/></g><g class=\"step\" data-step=\"2\"><g fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linejoin=\"round\"><rect x=\"150\" y=\"452\" width=\"26\" height=\"26\"/><path d=\"M147 452 L163 440 L179 452\"/><rect x=\"184\" y=\"458\" width=\"22\" height=\"22\"/><path d=\"M181 458 L195 448 L209 458\"/><rect x=\"214\" y=\"454\" width=\"24\" height=\"24\"/><path d=\"M211 454 L226 443 L241 454\"/><rect x=\"126\" y=\"460\" width=\"20\" height=\"20\"/><path d=\"M123 460 L136 450 L149 460\"/></g></g><g class=\"step\" data-step=\"3\"><g fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.2\" stroke-linejoin=\"round\"><rect x=\"196\" y=\"404\" width=\"16\" height=\"54\"/><path d=\"M196 404 L204 372 L212 404\"/><path d=\"M204 372 L204 360\"/></g></g><g class=\"step\" data-step=\"4\"><path d=\"M70 560 C 52 500, 92 470, 66 420 C 44 380, 96 350, 70 300 C 50 260, 98 230, 74 180 C 58 150, 86 130, 74 110 C 르는 바람 결", "tip": "소용돌이 옆으로 물결치는 바람 선을 길게 이어 그린다."}, {"title": "오른쪽 위 달", "tip": "오른쪽 위 구석에 둥근 달을 그리고, 둘레에 빛 테를 두른다."}, {"title": "별을 흩뿌리고 마무리", "tip": "하늘 곳곳에 동그란 별을 흩뿌리듯 그려 넣어 완성한다."}], "korean2": {"terms": [["소용돌이", "so-yong-do-ri", "swirl — 반 고흐의 특징적 표현"], ["붓터치", "but-teo-chi", "brushstroke — 붓으로 그은 자국"], ["명암", "myeong-am", "light and shadow"], ["원근법", "won-geun-beop", "perspective"], ["유화", "yu-hwa", "oil painting"]], "words": [["별", "byeol", "star"], ["밤", "bam", "night"], ["하늘", "ha-neul", "sky"], ["달", "dal", "moon"], ["마을", "ma-eul", "village"], ["나무", "na-mu", "tree"]], "sentences": [["별이 빛나는 밤입니다.", "Byeol-i bit-na-neun bam-im-ni-da.", "It is a starry night."], ["반 고흐는 별을 소용돌이로 그렸습니다.", "Ban Go-heu-neun byeol-eul so-yong-do-ri-ro geu-ryeot-seum-ni-da.", "Van Gogh painted the stars as swirls."]], "culture": [["🎨 반 고흐와 별이 빛나는 밤", "반 고흐는 1889년 프랑스 생레미 병원에 입원 중 이 그림을 그렸습니다. 창문으로 본 밤하늘을 상상과 감정으로 표현했고, 지금은 뉴욕 현대미술관에 있습니다."], ["🇰🇷 한국어로 반 고흐 읽기", "영어로는 Van Gogh이지만 한국어로는 '반 고흐'라고 읽습니다. '별빛(byeol-bit)'은 starlight라는 뜻입니다."]]}, "qna": [["고흐는 어떤 사람이었나요?", "고흐는 백여 년 전 네덜란드에서 태어난 화가예요. 마음이 여리고 그림을 무척 사랑했지요. 살아서는 그림을 거의 못 팔았지만, 지금은 온 세상이 사랑하는 화가가 되었어요."], ["왜 별을 소용돌이로 그렸나요?", "고흐는 눈에 보이는 대로가 아니라 마음에 느껴지는 대로 그렸어요. 밤하늘이 살아 움직이는 것처럼 느껴져서 별빛을 빙글빙글 소용돌이로 그렸답니다."], ["이 그림은 언제, 어디서 그렸나요?", "1889년, 고흐가 프랑스의 한 요양원에 있을 때 그렸어요. 방 창문으로 보이는 밤하늘을 기억과 상상으로 그린 그림이에요."], ["그림 속 큰 나무는 무엇인가요?", "앞쪽에 검고 길게 솟은 나무는 '사이프러스'라는 나무예요. 고흐는 이 나무를 하늘과 땅을 잇는 것처럼 그렸어요."], ["왜 파란색과 노란색을 많이 썼나요?", "고흐는 노란색을 특히 좋아했어요. 깊고 푸른 밤에 노란 별빛과 달빛이 더 따뜻하고 환하게 보이도록 두 색을 나란히 썼답니다."], ["이 그림은 지금 어디에 있나요?", "미국 뉴욕의 '현대미술관(MoMA)'에 있어요. 세계에서 가장 유명한 그림 중 하나라, 보러 오는 사람이 아주 많아요."], ["마을은 진짜 있는 곳인가요?", "아래 작은 마을과 교회는 실제 마을을 그대로 그린 건 아니에요. 고흐가 고향을 떠올리며 마음속 풍경을 더해 그린 거예요."], ["고흐는 그림을 몇 점이나 그렸나요?", "고흐는 10년 동안 800점이 넘는 그림을 그렸어요. 짧은 시간에 정말 부지런히 그렸지요."], ["나도 이렇게 그릴 수 있을까요?", "그럼요. 소용돌이는 동그라미를 빙글빙글 이어 그리면 돼요. 잘 그리는 게 중요한 게 아니라, 느낌대로 그리는 게 고흐의 방식이에요."], ["별이 빛나는 밤은 왜 유명한가요?", "밤하늘을 이렇게 마음으로 그린 그림은 그전에 없었어요. 보는 사람마다 마음이 움직여서, 노래와 영화에도 나올 만큼 사랑받는답니다."]]}, {"n": 5, "id": "myeonghwa:cezanne-apples", "title": "세잔 · 사과가 있는 정물", "diff": "🌱", "obj": "세잔의 «사과가 있는 정물»을 단계로 따라 그려보자.", "type": "svg", "meta": "세잔 · 프랑스", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/cezanne-apples/original.jpg", "svgViewer": "<svg viewBox=\"0 0 400 320\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><line x1=\"0\" y1=\"210\" x2=\"400\" y2=\"210\" stroke=\"#f3ead4\" stroke-width=\"2.6\" stroke-linecap=\"round\"/></g><g class=\"step\" data-step=\"2\"><circle cx=\"150\" cy=\"180\" r=\"42\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.6\"/></g><g class=\"step\" data-step=\"3\"><circle cx=\"225\" cy=\"190\" r=\"38\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.6\"/><circle cx=\"285\" cy=\"172\" r=\"34\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.6\"/></g><g class=\"step\" data-step=\"4\"><ellipse cx=\"215\" cy=\"212\" rx=\"130\" ry=\"20\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.6\"/></g><g class=\"step\" data-step=\"5\"><path d=\"M20 250 C 80 238,140 262,210 250 C 280 238,340 262,390 250\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M30 280 C 90 270,150 292,220 280\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"6\"><circle cx=\"150\" cy=\"180\" r=\"40\" fill=\"#c0473b\" stroke=\"none\" stroke-width=\"0\"/><circle cx=\"225\" cy=\"190\" r=\"36\" fill=\"#c0563b\" stroke=\"none\" stroke-width=\"0\"/><circle cx=\"285\" cy=\"172\" r=\"32\" fill=\"#cc6a4a\" stroke=\"none\" stroke-width=\"0\"/></g></svg>", "svgGuide": "<svg viewBox=\"0 0 400 320\" xmlns=\"http://www.w3.org/2000/svg\"><g ><line x1=\"0\" y1=\"210\" x2=\"400\" y2=\"210\" stroke=\"#9aa0b8\" stroke-width=\"2.6\" stroke-linecap=\"round\"/></g><g ><circle cx=\"150\" cy=\"180\" r=\"42\" fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2.6\"/></g><g ><ci 가였나요?", "프랑스의 화가로, 형태를 단순한 덩어리로 보고 그렸어요. 그래서 '현대 미술의 아버지'라 불려요."], ["왜 색을 면으로 칠했나요?", "붓을 넓게 써서 색을 면처럼 쌓았어요. 그러면 사과가 둥근 덩어리로 단단하게 느껴진답니다."], ["탁자보의 주름도 정성스러워요.", "네, 세잔은 천의 주름도 사과만큼 중요하게 그렸어요. 모든 것이 짜임새 있게 어울리도록요."], ["이 그림은 언제 그렸나요?", "백여 년 전, 1890년대 무렵에 그렸어요."], ["나도 그릴 수 있을까요?", "그럼요. 둥근 사과 몇 개를 그리고 빨강·노랑·초록을 면으로 칠하면 세잔 느낌이 나요."], ["왜 유명한가요?", "사물을 단순한 형태로 보는 그의 방식이 이후 피카소 같은 화가들에게 큰 영향을 줬어요."], ["무엇을 느끼면 되나요?", "화려하지 않아도 차분하고 단단한 아름다움이 있어요. 천천히 들여다보는 맛이 있는 그림입니다."]]}, {"n": 6, "id": "myeonghwa:klee-senecio", "title": "클레 · 세네시오", "diff": "🌱", "obj": "클레의 «세네시오»을 단계로 따라 그려보자.", "type": "svg", "meta": "클레 · 스위스", "note": "단계 SVG 완성 (신규 15작 · 3버튼 표준)", "viewImg": "myeonghwa/klee-senecio/original.jpg", "svgViewer": "<svg viewBox=\"0 0 560 590\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"3.5\" stroke-linecap=\"round\">\n    <circle cx=\"268\" cy=\"240\" r=\"215\"/>\n  </g><g class=\"step\" data-step=\"2\" stroke=\"#f3ead4\" stroke-width=\"2.6\" stroke-linecap=\"round\" clip-path=\"url(#head)\" fill=\"none\">\n    <line x1=\"190\" y1=\"25\" x2=\"190\" y2=\"455\"/>\n    <line x1=\"268\" y1=\"25\" x2=\"268\" y2=\"130\"/>\n    <line x1=\"268\" y1=\"232\" x2=\"268\" y2=\"455\"/>\n    <line x1=\"348\" y1=\"25\" x2=\"348\" y2=\"455\"/>\n    <line x1=\"53\" y1=\"130\" x2=\"483\" y2=\"130\"/>\n    <line x1=\"53\" y1=\"232\" x2=\"483\" y2=\"232\"/>\n    <line x1=\"53\" y1=\"320\" x2=\"483\" y2=\"320\"/>\n    <path d=\"M268,25 L190,130 M268,25 L348,130\" stroke-width=\"2.2\"/>\n  </g><g class=\"step\" data-step=\"3\" stroke=\"#f3ead4\" stroke-width=\"3\" stroke-linejoin=\"round\">\n    <path d=\"M156,190 Q191,166 226,190 Q191,210 156,190 Z\" fill=\"none\"/>\n    <path d=\"M310,178 Q346,154 382,178 Q346,198 310,178 Z\" fill=\"none\"/>\n    <circle cx=\"191\" cy=\"188\" r=\"15\" fill=\"#7d1c12\" stroke=\"none\"/>\n    <circle cx=\"346\" cy=\"176\" r=\"15\" fill=\"#7d1c12\" stroke=\"none\"/>\n  </g><g clas 8\" stroke-linecap=\"round\">\n    <path d=\"M312,140 Q350,122 388,138\"/>\n  </g><g fill=\"#9aa0b8\">\n    <rect x=\"262\" y=\"292\" width=\"11\" height=\"13\"/>\n    <rect x=\"255\" y=\"332\" width=\"27\" height=\"14\"/>\n  </g><g fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"3.2\" stroke-linecap=\"round\">\n    <line x1=\"236\" y1=\"455\" x2=\"236\" y2=\"512\"/>\n    <line x1=\"300\" y1=\"455\" x2=\"300\" y2=\"512\"/>\n    <path d=\"M60,590 Q120,505 236,512\"/>\n    <path d=\"M300,512 Q440,502 500,590\"/>\n  </g></g></svg>", "svgSteps": [{"title": "종이 가득 큰 동그라미 하나", "tip": "종이 가득 큰 동그라미 하나."}, {"title": "가로줄·세로줄로 칸 나누기", "tip": "가로줄·세로줄로 칸 나누기."}, {"title": "아몬드 눈 두 개", "tip": "빨간 눈동자."}, {"title": "한쪽 눈 위에만 눈썹 살짝", "tip": "한쪽 눈 위에만 눈썹 살짝."}, {"title": "코는 점, 입은 작은 네모", "tip": "코는 점, 입은 작은 네모."}, {"title": "목과 어깨", "tip": "기둥과 둥근 산."}, {"title": "칸마다 채색", "tip": "이웃과 다르게."}], "qna": [["이 그림은 무엇을 그린 건가요?", "동그라미 하나와 네모 몇 개로 만든 얼굴이에요. 주황 바탕 위에서 빨간 눈동자가 우리를 물끄러미 바라보지요."], ["세네시오가 무슨 뜻인가요?", "꽃 이름이자, 늙어 가는 배우의 얼굴이라고도 해요. 도형으로 만든 얼굴인데도 표정이 살아 있지요."], ["클레는 어떤 화가였나요?", "스위스의 화가로, '선을 데리고 산책한다'고 말했어요. 음악가 집안에서 자라 그림에도 리듬이 있지요."], ["이 그림은 언제 그렸나요?", "1922년에 그렸어요. 지금은 스위스 바젤 미술관에 있지요."], ["왜 눈썹이 한쪽뿐인가요?", "원작도 한쪽뿐이에요. 그 작은 어긋남이 얼굴에 익살과 표정을 만들어 주지요."], ["칸마다 색이 달라요.", "이웃한 칸과 색만 다르면 돼요. 정답이 없으니 마음 가는 대로 칠해도 클레가 된답니다."], ["눈동자 위치가 재미있어요.", "눈동자를 조금만 옮겨도 표정이 확 달라져요. 위를 보면 궁금한 얼굴, 옆을 보면 딴청 부리는 얼굴이 되지요."], ["도형만으로 그림이 되나요?", "네, 원·직선·네모 세 가지면 얼굴이 완성돼요. 단순할수록 오히려 또렷하게 남는답니다."], ["나도 그릴 수 있을까요?", "그럼요. 컵이나 접시를 대고 큰 동그라미를 그린 뒤 칸을 나누고 눈·코·입 자리를 정하면 돼요."], ["오늘 무엇을 느끼면 될까요?", "잘 그린 얼굴이 아니라 재미있는 얼굴이면 충분하다는 것 — 그게 클레의 마음이에요."]], "korean2": {"terms": [["도형", "do-hyeong", "shape"], ["추상", "chu-sang", "abstract"]], "words": [["얼굴", "eol-gul", "face"], ["동그라미", "dong-geu-ra-mi", "circle"], ["네모", "ne-mo", "square"], ["주황", "ju-hwang", "orange"]], "sentences": [["동그라미가 얼굴이 됩니다.", "Dong-geu-ra-mi-ga eol-gul-i doem-ni-da.", "A circle becomes a face."]], "culture": [["🎨 클레의 산책하는 선", "클레는 '선을 데리고 산책한다'고 말했습니다. 도형 몇 개로 표정을 만든 그의 그림은 단순함 속의 재미를 보여 줍니다."]]}}, {"n": 7, "id": "myeonghwa:davinci-monalisa", "title": "다빈치 · 모나리자", "diff": "🌱", "obj": "다빈치의 «모나리자»을 단계로 따라 그려보자.", "type": "svg", "meta": "다빈치 · 이탈리아", "note": "단계 SVG 완성 (신규 15작 · 3버튼 표준)", "viewImg": "myeonghwa/davinci-monalisa/original.jpg", "svgViewer": "<svg viewBox=\"0 0 520 776\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"3.5\">\n    <ellipse cx=\"258\" cy=\"196\" rx=\"56\" ry=\"72\"/>\n  </g><g class=\"step\" data-step=\"2\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"3.5\" stroke-linejoin=\"round\">\n    <path d=\"M258,260 C198,344 144,516 124,718 L392,718 C372,516 318,344 258,260 Z\"/>\n  </g><g class=\"step\" data-step=\"3\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"3\" stroke-linecap=\"round\">\n    <path d=\"M258,124 C236,128 220,136 212,146 C186,176 178,232 180,300 C182,354 190,408 202,450\"/>\n    <path d=\"M258,124 C280,128 296,136 304,146 C330,176 338,232 336,300 C334,354 326,408 314,450\"/>\n  </g><g class=\"step\" data-step=\"4\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"3\" stroke-linecap=\"round\">\n    <path d=\"M226,182 q13,-9 26,0\"/>\n    <path d=\"M266,180 q13,-9 26,0\"/>\n    <circle cx=\"239\" cy=\"184\" r=\"3.2\" fill=\"#f3ead4\" stroke=\"none\"/>\n    <circle cx=\"279\" cy=\"182\" r=\"3.2\" fill=\"#f3ead4\" stroke=\"none\"/>\n    <path d=\"M259,194 C258,204 257,212 254,220 q6,5 12,2\"/>\n  </g><g class=\"step\" data-step=\"5\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"4\" stroke-linecap=\"round\">\n    <path d=\"M232,242 Q258,258 286,238\"/>\n  </g><g class=\"step\" data-step=\"6\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"3.2\">\n    <ellipse cx=\"236\" cy=\"620\" rx=\"62\" ry=\"26\" transform=\"rotate(-14 236 620)\"/>\n    <ellipse cx=\"292\" cy=\"648\" rx=\"58\" ry=\"24\" transform=\"rotate(8 292 648)\"/>\n  </g><g class=\"step\" data-step=\"7\"><g fill=\"none\"  느껴지지요."], ["손 모양이 참 편안해 보여요.", "두 손을 가만히 포갠 모습이 차분하고 기품 있어요. 초상화의 모범이 된 자세랍니다."], ["나도 그릴 수 있을까요?", "그럼요. 달걀형 얼굴에 삼각형 몸, 포갠 손을 그리고 살짝 올라간 입꼬리만 더하면 돼요. 닮지 않아도 미소면 충분해요."], ["오늘 무엇을 느끼면 될까요?", "다빈치처럼 궁금한 것을 물어보는 마음이에요. '왜 웃고 있어요?' — 질문 하나가 그림을 더 재미있게 만들지요."]], "korean2": {"terms": [["초상화", "cho-sang-hwa", "portrait"], ["명작", "myeong-jak", "masterpiece"]], "words": [["미소", "mi-so", "smile"], ["여인", "yeo-in", "lady"], ["손", "son", "hand"], ["질문", "jil-mun", "question"]], "sentences": [["모나리자가 웃고 있습니다.", "Mo-na-ri-ja-ga ut-go it-seum-ni-da.", "Mona Lisa is smiling."]], "culture": [["🎨 다빈치와 질문", "다빈치는 그림뿐 아니라 과학·발명까지 평생 질문하며 살았습니다. 모나리자의 미소는 그 호기심이 낳은 걸작입니다."]]}}, {"n": 8, "id": "myeonghwa:munch-the-scream", "title": "뭉크 · 절규", "diff": "🌱", "obj": "뭉크의 «절규»을 단계로 따라 그려보자.", "type": "svg", "meta": "뭉크 · 노르웨이", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/munch-the-scream/original.jpg", "korean2": {"terms": [["감정", "gam-jeong", "emotion"], ["곡선", "gok-seon", "curved line"]], "words": [["하늘", "ha-neul", "sky"], ["다리", "da-ri", "bridge"], ["빨강", "ppal-gang", "red"], ["얼굴", "eol-gul", "face"]], "sentences": [["하늘이 붉습니다.", "Ha-neul-i bul-geum-ni-da.", "The sky is red."]], "culture": [["🎨 뭉크의 절규", "뭉크는 마음속 불안을 붉은 하늘과 굽이치는 선으로 표현했습니다. 감정을 그림으로 보여준 화가입니다."]]}, "qna": [["이 그림은 무엇을 그린 건가요?", "다리 위에서 한 사람이 두 손으로 얼굴을 감싸며 놀란 모습이에요. 마음속 불안을 그림으로 보여준 거예요."], ["왜 하늘이 붉은가요?", "뭉크가 본 핏빛처럼 붉은 노을을 그렸어요. 불안한 마음을 강렬한 붉은 하늘로 표현한 거예요."], ["선이 왜 구불구불한가요?", "하늘과 물이 굽이치는 곡선으로 흔들려요. 마음이 어지럽고 불안한 느낌을 선으로 나타낸 거예요."], ["뭉크는 어떤 화가였나요?", "노르웨이의 화가로, 사람의 슬픔·불안 같은 속마음을 솔직하게 그렸어요."], ["무섭기도 하고 슬프기도 해요.", "맞아요. 누구나 한 번쯤 느끼는 불안을 그려서, 보면 '나도 저럴 때가 있지' 하고 공감하게 돼요."], ["이 그림은 언제 그렸나요?", "1893년에 그렸어요. 백여 년 전 그림이지만 지금도 마음에 와닿지요."], ["뒤의 두 사람은 누구인가요?", "다리 위를 지나가는 사람들이에요. 주인공의 불안과 달리 무심히 걸어가고 있어요."], ["무엇을 느끼면 되나요?", "불안한 마음도 솔직하게 드러내도 괜찮다는 거예요. 감정을 그림으로 푼 용감한 작품이지요."], ["나도 그릴 수 있을까요?", "네. 놀란 얼굴을 단순하게 그리고 하늘을 붉게, 선을 물결처럼 그으면 분위기가 살아나요."], ["왜 이렇게 유명한가요?", "사람의 속마음을 이토록 강하게 그린 그림은 드물어요. 그래서 세계에서 가장 잘 알려진 그림  stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g></svg>"}, {"n": 9, "id": "myeonghwa:gauguin-tahiti", "title": "고갱 · 타히티의 여인들", "diff": "🌱", "obj": "고갱의 «타히티의 여인들»을 단계로 따라 그려보자.", "type": "svg", "meta": "고갱 · 프랑스", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/gauguin-tahiti/original.jpg", "korean2": {"terms": [["색채", "saek-chae", "color"], ["원시", "won-si", "primitive"]], "words": [["여인", "yeo-in", "woman"], ["섬", "seom", "island"], ["바다", "ba-da", "sea"], ["꽃", "kkot", "flower"]], "sentences": [["여인들이 바닷가에 있습니다.", "Yeo-in-deul-i ba-dat-ga-e it-seum-ni-da.", "The women are by the sea."]], "culture": [["🎨 고갱과 타히티", "고갱은 남태평양 타히티 섬에서 밝고 강한 색으로 사람들을 그렸습니다."]]}, "qna": [["이 그림은 무엇을 그린 건가요?", "남태평양 타히티 섬의 여인들 모습이에요. 따뜻한 바닷가에서 살아가는 사람들을 그렸지요."], ["고갱은 왜 타히티로 갔나요?", "복잡한 도시를 떠나 자연 그대로의 삶을 그리고 싶어 했어요. 그래서 멀리 타히티 섬까지 갔답니다."], ["색이 참 강렬해요.", "고갱은 보이는 색보다 더 진하고 선명한 색을 썼어요. 주황·분홍·초록이 강해서 그림이 또렷하고 힘있게 보여요."], ["고갱은 어떤 화가였나요?", "프랑스의 화가로, 고흐와 친구였어요. 단순한 형태와 강한 색으로 자기만의 그림을 그렸지요."], ["이 그림은 언제 그렸나요?", "1891년 무렵, 고갱이 타히티에 막 도착했을 때 그렸어요."], ["사람들이 차분해 보여요.", "네, 화려한 색과 달리 사람들의 표정은 고요해요. 자연 속의 평온한 삶을 담으려 한 거예요."], ["배경이 단순해요.", "고갱은 자잘한 묘사를 줄이고 색면을 넓게 칠했어요. 그래서 그림이 단순하면서도 시원합니다."], ["무엇을 느끼면 되나요?", "먼 남쪽 섬의 따뜻하고 느긋한 분위기예요. 보면 잠시 쉬어가는 기분이 들어요."], ["나도 그릴 수 있을까요?", "네. 사람을 단순하게 그리고 주황·초록 같은 진한 색을 넓게 칠해 보세요."], ["왜 중요한가요?", "강한 색과 단순한 형태로 그리는 새 길을 열어, 뒤의 많은 화가에게 영향을 줬어요."]], "svgViewer": "<svg viewBox=\"0 0 420 340\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><line x1=\"10\" y1=\"244\" x2=\"410\" y2=\"244\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"2\"><path d=\"M96 244 C 92 196 116 172 150 172 C 184 172 206 196 204 244 Z\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M230 244 C 228 200 250 178 282 178 C 314 178 334 200 332 244 Z\" fill=\"none\" stroke=\"#f3ead riginal.jpg", "korean2": {"terms": [["점묘법", "jeom-myo-beop", "pointillism — 점으로 그리기"], ["공원", "gong-won", "park"]], "words": [["점", "jeom", "dot"], ["나무", "na-mu", "tree"], ["사람", "sa-ram", "people"], ["양산", "yang-san", "parasol"]], "sentences": [["사람들이 공원에서 쉽니다.", "Sa-ram-deul-i gong-won-e-seo swim-ni-da.", "People rest in the park."]], "culture": [["🎨 쇠라의 점묘법", "쇠라는 작은 점을 수없이 찍어 그림을 완성했습니다. 멀리서 보면 색이 섞여 보입니다."]]}, "qna": [["이 그림은 무엇을 그린 건가요?", "강가 공원에서 사람들이 햇살을 즐기며 쉬는 일요일 오후예요. 산책하고 양산 쓰고 한가로이 노니는 모습이지요."], ["가까이 보면 점이 가득해요.", "맞아요. 쇠라는 붓으로 작은 점을 수없이 찍어 그렸어요. 이걸 '점묘법'이라고 해요."], ["왜 점으로 그렸나요?", "작은 색점을 나란히 찍으면 멀리서 볼 때 눈 안에서 색이 섞여 더 반짝여 보여요. 빛을 표현하는 방법이었지요."], ["쇠라는 어떤 화가였나요?", "프랑스의 화가로, 과학처럼 꼼꼼하게 색과 점을 연구해 그렸어요. 아주 차분하고 계획적인 화가였지요."], ["이 큰 그림을 얼마나 걸려 그렸나요?", "2년 넘게 걸려 그렸어요. 점을 하나하나 찍어야 했으니 정말 끈기가 필요했지요."], ["이 그림은 언제 그렸나요?", "1884년부터 1886년 사이에 그렸어요."], ["사람들이 멈춰 있는 것 같아요.", "네, 모두 조용히 멈춘 듯 차분해요. 평화로운 일요일의 고요함이 느껴지지요."], ["이 그림은 지금 어디에 있나요?", "미국 시카고 미술관에 있어요. 아주 큰 그림이라 직접 보면 웅장하답니다."], ["나도 그릴 수 있을까요?", "네. 색연필이나 사인펜으로 점을 콕콕 찍어 채워 보세요. 시간은 걸려도 누구나 할 수 있어요."], ["왜 유명한가요?", "점만으로 이렇게 큰 그림을 완성한 끈기와 새로운 방법 때문이에요. 미술 역사에 남은 작품이지요."]], "svgViewer": "<svg viewBox=\"0 0 420 340\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><line x1=\"10\" y1=\"180\" x2=\"410\" y2=\"180\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"2\"><line x1=\"330\" y1=\"40\" x2=\"330\" y2=\"200\" stroke=\"#f3ead4\" stroke-width=\"6\" stroke-linecap=\"round\"/><path d=\"M330 60 q-40 -20 -70 -6 M330 90 q44 -16 72 0\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"3\"><path d=\"M150 320 C 146 250 158 214 178 214 C 198 214 210 250 206 320 Z\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M150 196 q28 -22 56 0 Z\" fill=\"none\" 묘하다고 해서예요. 보는 사람마다 다른 마음을 느낀답니다."], ["배경이 왜 까만가요?", "어두운 배경 덕분에 소녀의 얼굴과 진주가 더 환하게 도드라져 보여요. 베르메르가 빛을 잘 쓴 거예요."], ["베르메르는 어떤 화가였나요?", "네덜란드의 화가로, 조용한 실내와 부드러운 빛을 즐겨 그렸어요. 작품 수는 적지만 하나하나 아주 정교해요."], ["진주가 진짜처럼 빛나요.", "사실은 흰 점 몇 번으로 빛을 콕 찍어 표현했어요. 가까이 보면 단순한데 멀리서 보면 진주처럼 반짝이지요."], ["머리에 두른 건 무엇인가요?", "파랑·노랑 천으로 만든 두건이에요. 그 시절 이국적인 멋을 낸 차림이지요."], ["이 그림은 언제 그렸나요?", "약 1665년, 360년쯤 전에 그렸어요."], ["이 그림은 지금 어디에 있나요?", "네덜란드 헤이그의 마우리츠하위스 미술관에 있어요."], ["나도 그릴 수 있을까요?", "네. 옆을 보다 돌아본 얼굴을 그리고 배경을 어둡게 한 뒤 귀에 흰 점으로 진주를 찍어 보세요."], ["왜 사랑받나요?", "말을 걸 듯한 눈빛과 고요한 아름다움 때문이에요. 영화로도 만들어질 만큼 사랑받는 그림이지요."]], "svgViewer": "<svg viewBox=\"0 0 360 420\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><ellipse cx=\"180\" cy=\"170\" rx=\"74\" ry=\"92\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"2\"><path d=\"M112 132 C 120 90 240 90 250 140 C 256 176 248 196 236 214\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M236 214 C 252 230 256 252 246 270\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"3\"><path d=\"M150 162 q12 -8 24 0\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M196 168 q10 -6 20 0\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M182 176 q-2 22 -8 30\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M168 214 q14 8 28 0\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"4\"><path d=\"M96 286 C 130 250 150 252 176 262 C 210 250 250 266 288 300 L288 420 L96 420 Z\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" 사다리꼴 탑을 그리고 나선 길을 감아올린 뒤 층마다 창문 점을 찍으면 돼요."], ["오늘 무엇을 느끼면 될까요?", "높이 쌓는 것보다 바르게 쌓는 게 중요하다는 것 — 그리고 다 됐다 싶을 때 한 번 더 살펴보는 마음이에요."]], "korean2": {"terms": [["탑", "tap", "tower"], ["욕심", "yok-sim", "greed"]], "words": [["하늘", "ha-neul", "sky"], ["구름", "gu-reum", "cloud"], ["벽돌", "byeok-dol", "brick"], ["사람들", "sa-ram-deul", "people"]], "sentences": [["탑이 하늘까지 올라갑니다.", "Tap-i ha-neul-kka-ji ol-la-gam-ni-da.", "The tower rises to the sky."]], "culture": [["🎨 바벨탑 이야기", "하늘에 닿으려던 인간의 탑은 끝내 완성되지 못했습니다. 브뤼헐은 이 옛이야기로 지나친 욕심을 경계하라는 마음을 담았습니다."]]}}, {"n": 13, "id": "myeonghwa:rousseau-gypsy", "title": "루소 · 잠자는 집시", "diff": "🌿", "obj": "루소의 «잠자는 집시»을 단계로 따라 그려보자.", "type": "svg", "meta": "루소 · 프랑스", "note": "단계 SVG 완성 (신규 15작 · 3버튼 표준)", "viewImg": "myeonghwa/rousseau-gypsy/original.jpg", "svgViewer": "<svg viewBox=\"0 0 700 448\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"3\" stroke-linecap=\"round\">\n    <path d=\"M0,172 C100,162 200,178 320,168 C440,158 560,172 700,162\"/>\n    <path d=\"M0,232 C120,220 260,238 400,226 C520,218 620,230 700,224\"/>\n  </g><g class=\"step\" data-step=\"2\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.6\" stroke-linecap=\"round\">\n    <circle cx=\"588\" cy=\"52\" r=\"26\"/>\n    <circle cx=\"492\" cy=\"34\" r=\"2.6\" fill=\"#f3ead4\" stroke=\"none\"/>\n    <circle cx=\"652\" cy=\"96\" r=\"2.6\" fill=\"#f3ead4\" stroke=\"none\"/>\n    <circle cx=\"430\" cy=\"66\" r=\"2.2\" fill=\"#f3ead4\" stroke=\"none\"/>\n    <circle cx=\"540\" cy=\"110\" r=\"2.2\" fill=\"#f3ead4\" stroke=\"none\"/>\n  </g><g class=\"step\" data-step=\"3\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <ellipse cx=\"474\" cy=\"296\" rx=\"20\" ry=\"22\"/>\n    <path d=\"M452,308 C400,298 330,316 268,336 C252,342 248,356 262,362 C330,374 402,362 452,342\"/>\n  </g><g class=\"step\" data-step=\"4\" fill=\"none\" stroke-width=\"5\" strok 라 얼굴이 없어요. 그래서 누구라도 자기 모습을 겹쳐 볼 수 있는 그림이 되었지요."], ["하늘빛이 참 곱네요.", "해 질 녘 노을이 회녹색에서 금빛으로 물들어요. 하루의 끝을 따뜻하게 감싸 주는 빛이지요."], ["멀리 작은 탑은 무엇인가요?", "종소리가 들려오는 교회 종탑이에요. 소리를 그림으로 보여 주는 셈이지요."], ["나도 그릴 수 있을까요?", "그럼요. 지평선을 긋고 고개 숙인 콩 모양 사람 둘을 세우면 돼요. 얼굴을 안 그려도 완성이랍니다."], ["오늘 무엇을 느끼면 될까요?", "하루를 마치며 감사하는 마음이에요. 회원님의 한 주도 이렇게 조용히 마무리해 보세요."]], "korean2": {"terms": [["기도", "gi-do", "prayer"], ["노을", "no-eul", "sunset"]], "words": [["저녁", "jeo-nyeok", "evening"], ["감자", "gam-ja", "potato"], ["종소리", "jong-so-ri", "bell sound"], ["감사", "gam-sa", "thanks"]], "sentences": [["저녁 종소리가 들립니다.", "Jeo-nyeok jong-so-ri-ga deul-lim-ni-da.", "The evening bell rings."]], "culture": [["🎨 밀레와 만종", "만종은 '저녁 종'이라는 뜻입니다. 하루 일을 마친 부부가 멀리 종소리에 맞춰 고개 숙여 감사하는, 일하는 사람의 존엄을 담은 그림입니다."]]}}, {"n": 15, "id": "myeonghwa:degas-etoile", "title": "드가 · 에투알", "diff": "🌿", "obj": "드가의 «에투알»을 단계로 따라 그려보자.", "type": "svg", "meta": "드가 · 프랑스", "note": "단계 SVG 완성 (신규 15작 · 3버튼 표준)", "viewImg": "myeonghwa/degas-etoile/original.jpg", "svgViewer": "<svg viewBox=\"0 0 520 757\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"3.2\" stroke-linecap=\"round\">\n    <path d=\"M0,424 C180,380 360,330 520,288\"/>\n  </g><g class=\"step\" data-step=\"2\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <circle cx=\"350\" cy=\"320\" r=\"20\"/>\n    <path d=\"M340,300 C336,292 340,282 350,280 C362,278 370,286 368,296\"/>\n    <path d=\"M336,338 C330,352 330,368 336,382 C348,390 362,388 370,378 C374,364 372,348 364,338\"/>\n  </g><g class=\"step\" data-step=\"3\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"3\" stroke-linecap=\"round\">\n    <path d=\"M366,344 C392,320 412,296 424,268 C428,258 434,252 438,256\"/>\n    <path d=\"M334,352 C304,362 274,376 248,392 C240,397 236,404 240,408\"/>\n  </g><g class=\"step\" data-step=\"4\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.8\" stroke-linecap ><g fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2.4\" stroke-linecap=\"round\">\n    <path d=\"M56,16 C46,80 62,150 50,220 C46,254 52,290 44,320\"/>\n    <path d=\"M108,10 C98,70 114,150 102,230 C98,262 104,296 96,326\"/>\n    <path d=\"M148,50 q30,-24 62,-6 q26,14 54,-4\"/>\n    <path d=\"M170,110 q36,-22 72,-4 q28,12 58,-6\"/>\n    <path d=\"M200,170 q32,-18 66,-2\"/>\n  </g></g></svg>", "svgSteps": [{"title": "무대 바닥 선", "tip": "비스듬히 하나."}, {"title": "머리와 몸통", "tip": "작게."}, {"title": "두 팔", "tip": "하늘로, 옆으로 활짝."}, {"title": "치마", "tip": "구름처럼 몽글몽글."}, {"title": "다리", "tip": "서고, 뒤로 살짝."}, {"title": "커튼과 배경 숲", "tip": "슥슥."}, {"title": "채색", "tip": "치마는 희게, 바닥은 회녹색."}], "qna": [["이 그림은 무엇을 그린 건가요?", "무대 위에서 홀로 빛나는 발레 무용수예요. 에투알은 프랑스어로 '별' — 최고의 무용수를 부르는 말이지요."], ["무용수는 지금 어떤 순간인가요?", "공연의 가장 빛나는 한 장면이에요. 한 팔을 하늘로 뻗고 조명을 받으며 활짝 피어난 순간이지요."], ["드가는 어떤 화가였나요?", "프랑스의 화가로, 평생 발레 무용수를 그렸어요. 무대 뒤 연습 모습까지 지켜보며 움직임을 담았지요."], ["이 그림은 언제 그렸나요?", "1878년 무렵에 그렸어요. 지금은 프랑스 파리 오르세 미술관에 있지요."], ["파스텔로 그렸다던데요?", "네, 가루가 부드러운 파스텔로 그려서 치마가 구름처럼 폭신해 보여요. 드가는 파스텔의 명수였지요."], ["배경이 흐릿하게 슥슥 그려져 있어요.", "무대 커튼과 배경 숲을 일부러 대충 그렸어요. 그래야 무용수가 더 또렷이 빛나 보이지요."], ["위에서 내려다보는 것 같아요.", "맞아요, 드가는 극장 위쪽 자리에서 본 각도로 그렸어요. 비스듬한 무대 바닥이 그래서 생겼지요."], ["치마는 왜 희게 남기나요?", "흰 치마에 조명이 비쳐 가장 밝게 빛나기 때문이에요. 둘레만 살짝 칠하면 빛이 살아나지요."], ["나도 그릴 수 있을까요?", "그럼요. 작은 머리와 몸통, 활짝 편 두 팔, 부채꼴 치마, 곧은 다리 하나면 무용수가 돼요."], ["오늘 무엇을 느끼면 될까요?", "회원님이 무대에 섰던 순간, 가장 빛났던 한 장면을 떠올려 보세요. 그 추억이 오늘의 그림이 됩니다."]], "korean2": {"terms": [["무용수", "mu-yong-su", "dancer"], ["무대", "mu-dae", "stage"]], "words": [["춤", "chum", "dance"], ["치마", "chi-ma", "skirt"], ["빛", "bit", "light"], ["박수", "bak-su", "applause"]], "sentences": [["무용수가 무대에서 빛납니다.", "Mu-yong-su-ga mu-dae-e-seo bit-nam-ni-da.", "The dancer shines on stage."]], "culture": [["🎨 드가와 무용수", "드가는 평생 발레 무용수를 그렸습니다. 화려한 무대 뒤의 연습과 노력까지 지켜본 그의 그림에는 빛나는 한 순간의 무게가 담겨 있습니다."]]}}, {"n": 16, "id": "myeonghwa:hokusai-wave", "title": "호쿠사이 · 가나가와 큰 파도", "diff": "🌿", "obj": "호쿠사이의 «가나가와 큰 파도»을 단계로 내지요."], ["호쿠사이는 어떤 화가였나요?", "일본의 판화가로, 후지산 그림 연작 「후지 36경」으로 유명해요. 평생 삼만 점 넘게 그린 부지런한 화가였지요."], ["이 그림은 언제 만들었나요?", "1831년 무렵, 호쿠사이가 일흔이 넘었을 때예요. 늦은 나이에 대표작을 만든 셈이지요."], ["그림이 아니라 판화라고요?", "네, 나무판에 새겨 찍어낸 목판화예요. 그래서 같은 그림이 세계 여러 미술관에 있답니다."], ["파도 속 배는 무엇인가요?", "생선을 나르던 빠른 배들이에요. 뱃사람들이 몸을 낮추고 파도를 견디고 있지요."], ["후지산이 왜 이렇게 작나요?", "큰 파도 너머로 보이니 작아 보여요. 파도의 거대함을 산과 견주어 보여 주는 솜씨지요."], ["파란색이 참 깊어요.", "당시 새로 들어온 진한 파랑 물감을 썼어요. 이 깊은 파랑 덕분에 바다가 살아 움직이지요."], ["나도 그릴 수 있을까요?", "그럼요. 솟았다 감기는 큰 곡선을 긋고 갈고리 거품을 반복해 붙이면 돼요. 반복이 파도를 만듭니다."], ["오늘 무엇을 느끼면 될까요?", "일흔 넘어 대표작을 만든 화가의 이야기예요. 늦었다고 생각한 때가 가장 좋은 때임을 파도가 말해 주지요."]], "korean2": {"terms": [["목판화", "mok-pan-hwa", "woodblock print"], ["파도", "pa-do", "wave"]], "words": [["바다", "ba-da", "sea"], ["배", "bae", "boat"], ["산", "san", "mountain"], ["거품", "geo-pum", "foam"]], "sentences": [["큰 파도가 밀려옵니다.", "Keun pa-do-ga mil-lyeo-om-ni-da.", "A great wave rolls in."]], "culture": [["🎨 일흔의 호쿠사이", "호쿠사이는 일흔이 넘어 이 대표작을 만들었습니다. '아흔이 되면 그림의 참뜻을 알 것'이라던 그는, 늦은 나이가 결코 늦지 않음을 보여 줍니다."]]}}, {"n": 17, "id": "myeonghwa:vermeer-letter", "title": "페르메이르 · 편지를 읽는 여인", "diff": "🌳", "obj": "페르메이르의 «편지를 읽는 여인»을 단계로 따라 그려보자.", "type": "svg", "meta": "페르메이르 · 네덜란드", "note": "단계 SVG 완성 (신규 15작 · 3버튼 표준)", "viewImg": "myeonghwa/vermeer-letter/original.jpg", "svgViewer": "<svg viewBox=\"0 0 520 623\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <rect x=\"150\" y=\"46\" width=\"340\" height=\"196\"/>\n    <line x1=\"138\" y1=\"46\" x2=\"502\" y2=\"46\"/>\n    <circle cx=\"138\" cy=\"46\" r=\"5\"/>\n  </g><g class=\"step\" data-step=\"2\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <ellipse cx=\"268\" cy=\"192\" rx=\"22\" ry=\"26\"/>\n    <circle cx=\"293\" cy=\"181\" r=\"12\"/>\n    <path d=\"M246,214 C236,224 230,244 228,268 C226,296 226,320 228,344 C224,410 224, 은 네덜란드 암스테르담 국립미술관에 있지요."], ["뒤 벽의 큰 네모는 무엇인가요?", "벽에 걸린 지도예요. 바다 건너 먼 곳 — 편지를 보낸 이가 있을 곳을 넌지시 알려 주는 듯하지요."], ["저고리 파랑이 참 고와요.", "페르메이르가 사랑한 파랑이에요. 보석을 갈아 만든 귀한 물감을 넉넉히 써서 지금도 눈부시지요."], ["왜 옆모습으로 그렸나요?", "편지에 온 마음이 가 있는 모습을 보여 주려고요. 얼굴 표정 대신 고요한 자세가 마음을 말해 주지요."], ["앞의 탁자와 의자는 왜 있나요?", "우리가 방 안을 살짝 들여다보는 느낌을 만들어 줘요. 그래서 더 조심스럽고 고요하게 느껴지지요."], ["나도 그릴 수 있을까요?", "그럼요. 큰 네모 지도를 걸고 옆을 향해 선 사람을 그린 뒤 저고리를 넉넉하게 두르면 돼요. 얼굴은 없어도 됩니다."], ["오늘 무엇을 느끼면 될까요?", "글과 기록의 소중함이에요. 회원님이 써 온 글들도 이 여인의 편지처럼 누군가에게 귀한 기록이 됩니다."]], "korean2": {"terms": [["편지", "pyeon-ji", "letter"], ["기록", "gi-rok", "record"]], "words": [["아침", "a-chim", "morning"], ["창문", "chang-mun", "window"], ["지도", "ji-do", "map"], ["파랑", "pa-rang", "blue"]], "sentences": [["여인이 편지를 읽습니다.", "Yeo-in-i pyeon-ji-reul ik-seum-ni-da.", "The woman reads a letter."]], "culture": [["🎨 페르메이르의 파랑", "페르메이르는 보석을 갈아 만든 귀한 파란 물감을 아낌없이 썼습니다. 고요한 아침 빛 속의 파랑이 그의 트레이드마크입니다."]]}}, {"n": 18, "id": "myeonghwa:klimt-the-kiss", "title": "클림트 · 키스", "diff": "🌱", "obj": "클림트의 «키스»을 단계로 따라 그려보자.", "type": "svg", "meta": "클림트 · 오스트리아", "note": "기존 자산 재사용 (2-2 → 5-2 이동)", "viewImg": "myeonghwa/klimt-the-kiss/original.jpg", "korean2": {"terms": [["황금빛", "hwang-geum-bit", "golden"], ["장식", "jang-sik", "ornament"]], "words": [["사랑", "sa-rang", "love"], ["황금", "hwang-geum", "gold"], ["입맞춤", "ip-mat-chum", "kiss"], ["꽃", "kkot", "flower"]], "sentences": [["두 사람이 사랑합니다.", "Du sa-ram-i sa-rang-ham-ni-da.", "The two people love each other."]], "culture": [["🎨 클림트의 키스", "금박을 붙여 반짝이게 그린 그림입니다. 사랑과 황홀함을 황금빛으로 표현했습니다."]]}, "qna": [["이 그림은 무엇을 그린 건가요?", "두 사람이 사랑을 담아 입을 맞추는 순간이에요. 온통 황금빛이라 더없이 따뜻하고 황홀해 보이지요."], ["왜 금색으로 빛나나요?", "클림트는 진짜 금박을 붙여 그렸어요. 그래서 그림이 보석처럼 반짝이고 귀하게 느껴진답니다."], ["꽃밭에 앉아 있나요?", "네, 두 사람이 꽃이 가득한 풀밭 끝에 앉아 있어요. 사랑이 활짝 피어난 모습 같지요."], ["남자와 여자 무늬가 달라요.", "남자 옷엔 곧은 네모 무늬, 여자 옷엔 둥근 꽃무늬가 있어요. 서로 다른 둘이 하나로 안긴 모습을 표현했어요."], ["클림트는 어떤 화가였나요?", "오스트리아 빈의 화가로, 화려한 장식과 금빛을 즐겨 썼어요. 사랑과 아름다움을 황금빛으로 그렸지요."], ["이 그림은 언제 그렸나요?", "1907년 무렵에 그렸어요. '클림트의 황금시대' 대표작이에요."], ["이 그림은 지금 어디에 있나요?", "오스트리아 빈의 벨베데레 미술관에 있어요. 보러 오는 사람이 아주 많답니다."], ["무슨 느낌을 담았나요?", "사랑하는 사람을 꼭 안았을 때의 포근함과 황홀함이에요. 보면 마음이 따뜻해져요."], ["나도 그릴 수 있을까요?", "네. 두 사람을 안은 모습으로 그리고 금색·노랑으로 칠한 뒤 동그란 꽃무늬를 더하면 화사해져요."], ["왜 유명한가요?", "사랑을 이렇게 아름답고 화려하게 그린 그림은 드물어요. 그래서 세계인이 가장 사랑하는 그림 중 하나예요."]], "svgViewer": "<svg viewBox=\"0 0 360 460\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><ellipse cx=\"180\" cy=\"220\" rx=\"118\" ry=\"180\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"2\"><circle cx=\"158\" cy=\"118\" r=\"30\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"206\" cy=\"150\" r=\"26\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"3\"><path d=\"M96 270 C 110 330 130 372 156 400 L210 400 C 238 372 252 330 262 280\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"4\"><path d=\"M70 402 q110 26 220 0\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M84 420 q96 18 192 0\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"5\"><rect x=\"132\" y=\"200\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"158\" y=\"234\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"130\" y=\"268\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"150\" y=\"300\" width=\"14\" height=\"14\" ], ["Ⅰ·Ⅱ·Ⅲ 글자는 무엇인가요?", "힐마가 그려 넣은 기호예요. 뜻을 다 알 수 없지만, 그 신비함이 이 그림의 매력이지요."], ["연보라 바탕이 참 곱네요.", "부드러운 연보라 위에 노랑이 놓여 서로를 환하게 밝혀 줘요. 색의 어울림이 마음을 편안하게 하지요."], ["무늬 채우기가 재미있어요.", "네모와 동그라미를 번갈아 천천히 채우는 것이 오늘의 명상이에요. 손이 바쁘면 마음이 고요해지지요."], ["나도 그릴 수 있을까요?", "그럼요. 위 두 잎이 큰 하트를 그리고 아래 물방울 씨앗을 붙인 뒤, 노랑을 주인공으로 칠하면 돼요."], ["오늘 무엇을 느끼면 될까요?", "인생의 장(章)들이에요. 회원님이 지나온 계절들을 떠올리며, 지금 이 계절의 빛깔을 골라 보세요."]], "korean2": {"terms": [["연작", "yeon-jak", "series"], ["상징", "sang-jing", "symbol"]], "words": [["인생", "in-saeng", "life"], ["씨앗", "ssi-at", "seed"], ["노랑", "no-rang", "yellow"], ["계절", "gye-jeol", "season"]], "sentences": [["인생에도 계절이 있습니다.", "In-saeng-e-do gye-jeol-i it-seum-ni-da.", "Life also has its seasons."]], "culture": [["🎨 앞서간 힐마", "힐마 아프 클린트는 추상화를 누구보다 먼저 그렸지만 오랫동안 알려지지 않았습니다. 백 년이 지나서야 세계가 그녀를 발견했지요."]]}}, {"n": 20, "id": "myeonghwa:kandinsky-comp8", "title": "칸딘스키 · 구성 8", "diff": "🌳", "obj": "칸딘스키의 «구성 8»을 단계로 따라 그려보자.", "type": "svg", "meta": "칸딘스키 · 러시아", "note": "단계 SVG 완성 (신규 15작 · 3버튼 표준)", "viewImg": "myeonghwa/kandinsky-comp8/original.jpg", "svgViewer": "<svg viewBox=\"0 0 700 490\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"3\" stroke-linecap=\"round\">\n    <circle cx=\"95\" cy=\"85\" r=\"56\"/>\n    <circle cx=\"95\" cy=\"85\" r=\"24\"/>\n  </g><g class=\"step\" data-step=\"2\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.8\" stroke-linecap=\"round\">\n    <line x1=\"60\" y1=\"440\" x2=\"650\" y2=\"120\"/>\n    <line x1=\"150\" y1=\"472\" x2=\"688\" y2=\"262\"/>\n    <line x1=\"296\" y1=\"30\" x2=\"540\" y2=\"470\"/>\n  </g><g class=\"step\" data-step=\"3\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <path d=\"M300,236 L560,206 L360,58 Z\"/>\n    <path d=\"M120,306 L192,266 L178,338 Z\"/>\n  </g><g class=\"step\" data-step=\"4\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.6\" stroke-linecap=\"round\">\n    < 04\"/>\n    <path d=\"M474,388 L622,338\"/>\n    <path d=\"M440,320 L474,388\"/>\n    <path d=\"M514,295 L556,364\"/>\n    <path d=\"M588,270 L622,338\"/>\n  </g><g fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2.6\" stroke-linecap=\"round\">\n    <path d=\"M188,470 A50,50 0 0 1 288,470\"/>\n    <path d=\"M202,470 A36,36 0 0 1 274,470\"/>\n    <path d=\"M216,470 A22,22 0 0 1 260,470\"/>\n  </g></g></svg>", "svgSteps": [{"title": "왼쪽 위 큰 원", "tip": "안에 작은 원."}, {"title": "긴 직선 두세 개", "tip": "시원하게."}, {"title": "뾰족한 삼각형", "tip": "산처럼, 종처럼."}, {"title": "작은 원들", "tip": "튀는 음표처럼."}, {"title": "체크무늬 부채꼴", "tip": "칸 나누기."}, {"title": "반원 몇 개", "tip": "무지개처럼."}, {"title": "채색", "tip": "도형마다 다른 색."}], "qna": [["이 그림은 무엇을 그린 건가요?", "사람도 풍경도 아닌, 원·직선·삼각형이 어울린 그림이에요. 칸딘스키는 이런 그림에 음악처럼 '구성'이라는 제목을 붙였지요."], ["무슨 소리가 들리는 것 같아요.", "맞아요, 칸딘스키는 색과 도형에서 소리를 들었다고 해요. 큰 원은 깊은 울림, 작은 원들은 튀는 음표 같지요."], ["칸딘스키는 어떤 화가였나요?", "러시아 태생의 화가로, 추상화의 문을 연 사람 중 하나예요. 음악을 사랑해 그림을 '눈으로 듣는 음악'으로 만들었지요."], ["이 그림은 언제 그렸나요?", "1923년에 그렸어요. 지금은 미국 뉴욕 구겐하임 미술관에 있지요."], ["왼쪽 위 큰 원이 눈에 띄어요.", "보라와 빨강이 겹친 큰 원이 그림의 중심 울림이에요. 칸딘스키는 원을 가장 깊은 도형이라 여겼지요."], ["긴 직선들은 무엇인가요?", "화면을 시원하게 가로지르는 움직임이에요. 음악으로 치면 쭉 뻗는 활시위 같은 소리지요."], ["체크무늬 부채꼴이 재미있어요.", "칸을 나눠 색색으로 칠한 부분이에요. 촘촘한 리듬, 빠른 박자 같은 느낌을 주지요."], ["도형을 어디에 놓아야 하나요?", "정답 배치가 없어요. 원과 선이 어디에 놓여도 회원님만의 음악이 된답니다."], ["나도 그릴 수 있을까요?", "그럼요. 큰 원 하나, 긴 직선 두어 개, 삼각형과 작은 원들을 자유롭게 놓으면 돼요. 좋아하는 음악을 틀고 그리면 더 좋지요."], ["오늘 무엇을 느끼면 될까요?", "회원님 인생의 리듬이에요. 잔잔한 날도 큰 울림의 날도 모두 한 곡의 음악이 되지요."]], "korean2": {"terms": [["구성", "gu-seong", "composition"], ["리듬", "ri-deum", "rhythm"]], "words": [["음악", "eum-ak", "music"], ["원", "won", "circle"], ["삼각형", "sam-gak-hyeong", "triangle"], ["소리", "so-ri", "sound"]], "sentences": [["그림에서 음악이 들립니다.", "Geu-rim-e-seo eum-ak-i deul-lim-ni-da.", "Music can be heard in the painting."]], "culture": [["🎨 칸딘스키와 음악", "칸딘스키는 색과 도형에서 소리를 들었다고 합니다. 원은 울림, 직선은 나아감 — 그의 그림은 눈으로 듣는 음악입니다."]]}}, {"n": 21, "id": "myeonghwa:cassatt-letter", "title": "카사트 · 편지" ,-14 20,0 M160,50 q0,12 -8,18\"/>\n    <path d=\"M350,70 q10,-14 20,0 M360,70 q0,12 -8,18 M360,70 q2,12 10,16\"/>\n    <path d=\"M90,220 q10,-14 20,0 M100,220 q0,12 -8,18\"/>\n    <path d=\"M390,190 q10,-14 20,0 M400,190 q2,12 10,16\"/>\n    <path d=\"M60,360 q10,-14 20,0 M70,360 q0,12 -8,18\"/>\n    <path d=\"M120,140 q10,-14 20,0\"/>\n    <path d=\"M320,120 q10,-14 20,0\"/>\n  </g></g></svg>", "svgSteps": [{"title": "비스듬한 책상 윗면", "tip": "큰 마름모."}, {"title": "고개 숙인 사람", "tip": "달걀형 머리."}, {"title": "두 손을 입가로", "tip": "편지 봉투."}, {"title": "책상 위 흰 종이 한 장", "tip": "책상 위 흰 종이 한 장."}, {"title": "옷에 꽃무늬", "tip": "동글동글."}, {"title": "벽지에 잎사귀 무늬 점점이", "tip": "벽지에 잎사귀 무늬 점점이."}, {"title": "채색", "tip": "옷은 파랑, 벽지는 연둣빛."}], "qna": [["이 그림은 무엇을 그린 건가요?", "책상에 앉아 편지 봉투를 봉하는 여인이에요. 편지를 다 쓰고 입가로 가져간 조용한 순간이지요."], ["봉투를 입에 대고 무엇을 하나요?", "봉투를 붙이려고 침을 바르는 중이에요. 우표를 붙이던 옛 시절의 정겨운 손길이지요."], ["카사트는 어떤 화가였나요?", "미국 태생으로 프랑스에서 활동한 화가예요. 여성과 아이의 일상을 따뜻하게 그린 것으로 유명하지요."], ["이 그림은 언제 만들었나요?", "1890년 무렵에 만든 판화 연작 중 하나예요. 그림이 아니라 찍어낸 판화라 선이 또렷하지요."], ["일본 그림을 닮았다던데요?", "네, 카사트는 일본 판화의 단순한 선과 무늬에 반했어요. 평평한 색면과 또렷한 윤곽이 그 영향이지요."], ["옷의 꽃무늬가 화려해요.", "파란 옷에 금빛 꽃무늬가 동글동글 놓여 있어요. 무늬는 정해진 자리가 없으니 자유롭게 그리면 되지요."], ["벽지에도 무늬가 있네요.", "연둣빛 잎사귀 무늬가 점점이 흩어져 있어요. 옷 무늬와 벽지 무늬가 어울려 화면이 노래하듯 하지요."], ["누구에게 보내는 편지일까요?", "그건 그림이 말해 주지 않아요. 회원님이라면 누구에게 보내고 싶으세요? — 그 마음이 오늘의 주제랍니다."], ["나도 그릴 수 있을까요?", "그럼요. 비스듬한 책상 마름모를 그리고 고개 숙인 사람과 봉투를 더한 뒤, 꽃무늬를 동글동글 흩뿌리면 돼요."], ["오늘 무엇을 느끼면 될까요?", "마음을 전하는 일의 소중함이에요. 오늘 그림을 그리고 나서, 정말로 가족에게 짧은 편지를 보내 보세요."]], "korean2": {"terms": [["판화", "pan-hwa", "print"], ["안부", "an-bu", "greetings"]], "words": [["봉투", "bong-tu", "envelope"], ["책상", "chaek-sang", "desk"], ["꽃무늬", "kkon-mu-ni", "floral pattern"], ["마음", "ma-eum", "heart"]], "sentences": [["마음을 담아 편지를 보냅니다.", "Ma-eum-eul dam-a pyeon-ji-reul bo-naem-ni-da.", "I send a letter with my heart."]], "culture": [["🎨 카사트와 일본 판화", "카사트는 일본 판화의 단순한 선과 무늬에 반해 이 연작을 만들었습니다. 일상의 조용한 순간을 가장 귀하게 그린 화가입니다."]]}}, {"n": 22, "id": "myeonghwa:r , ["주황 열매가 점점이 보여요.", "나뭇가지에 달린 열매예요. 어두운 초록 사이 주황 점들이 보석처럼 빛나지요."], ["나도 그릴 수 있을까요?", "그럼요. 부채 잎·길쭉 잎·뾰족 잎을 겹겹이 반복하면 숲이 돼요. 반복이 지루해질 때쯤 정글이 완성되지요."], ["오늘 무엇을 느끼면 될까요?", "기억의 숲을 거니는 마음이에요. 이 그림처럼, 회원님의 추억도 동화로 바꿔 손주에게 들려줄 수 있답니다."]], "korean2": {"terms": [["정글", "jeong-geul", "jungle"], ["꿈", "kkum", "dream"]], "words": [["잎사귀", "ip-sa-gwi", "leaf"], ["연꽃", "yeon-kkot", "lotus"], ["피리", "pi-ri", "flute"], ["열매", "yeol-mae", "fruit"]], "sentences": [["달빛 아래 숲이 잠듭니다.", "Dal-bit a-rae sup-i jam-deum-ni-da.", "The forest sleeps under the moonlight."]], "culture": [["🎨 파리를 떠나지 않은 정글", "루소는 정글에 가 본 적이 없습니다. 파리의 식물원을 거닐며 상상으로 이 숲을 그렸지요. 상상력이 곧 여행이었던 셈입니다."]]}}, {"n": 23, "id": "myeonghwa:klimt-treeoflife", "title": "클림트 · 생명의 나무", "diff": "🌳", "obj": "클림트의 «생명의 나무»을 단계로 따라 그려보자.", "type": "svg", "meta": "클림트 · 오스트리아", "note": "단계 SVG 완성 (신규 15작 · 3버튼 표준)", "viewImg": "myeonghwa/klimt-treeoflife/original.jpg", "svgViewer": "<svg viewBox=\"0 0 520 757\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"4\" stroke-linecap=\"round\">\n    <path d=\"M262,700 C254,620 254,520 258,440 C262,380 258,300 252,240\"/>\n    <path d=\"M236,700 C242,660 246,620 250,580 M282,700 C276,660 272,620 268,580\" stroke-width=\"3\"/>\n  </g><g class=\"step\" data-step=\"2\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"3\" stroke-linecap=\"round\">\n    <path d=\"M256,470 C220,448 184,428 158,412\"/>\n    <path d=\"M168.0,396.0 L165.8,406.0 L161.0,414.8 L154.1,421.7 L145.6,426.2 L136.4,428.1 L127.3,427.3 L118.9,424.0 L112.0,418.7 L107.0,411.7 L104.3,403.8 L103.9,395.6 L105.9,387.9 L109.8,381.2 L115.4,376.1 L122.0,372.9 L129.0,371.7 L135.9,372.6 L142.0,375.3 L147.0,379.5 L150.5,384.8 L152.2,390.6 L152.2,396.6 L150.5,402.0 L147.4,406.6 L143.4,410.0 L138.7,411.9 L133.8,412.5 L129.2,411.6 L125.2,409.5 L122.2,406.5 L120.2,402.9 L119.4,399.2 L119.8,395.5 L121.1,392.3 L123.2,389.8 L125.7,388.1 L128.5,387.3 L131.2,387.4 L133.5,388.2 을 달팽이처럼 돌돌", "tip": "가지 끝을 달팽이처럼 돌돌."}, {"title": "가지를 위·옆으로 계속", "tip": "가지를 위·옆으로 계속."}, {"title": "열매", "tip": "눈·세모·동그라미 번갈아."}, {"title": "가지 하나에 검은 새 한 마리", "tip": "가지 하나에 검은 새 한 마리."}, {"title": "뿌리 곁에 꽃 몇 송이", "tip": "뿌리 곁에 꽃 몇 송이."}, {"title": "채색", "tip": "나무는 황금빛으로."}], "qna": [["이 그림은 무엇을 그린 건가요?", "가지 끝이 달팽이처럼 도는 황금빛 나무예요. 하늘과 땅을 잇는 '생명의 나무'라는 오랜 상징이지요."], ["가지가 왜 빙글빙글 도나요?", "소용돌이는 끝없이 이어지는 삶을 뜻해요. 크게 도는 해도, 작게 도는 해도 다 인생이지요."], ["클림트는 어떤 화가였나요?", "오스트리아 빈의 화가로, 금박과 화려한 장식을 즐겨 썼어요. 「키스」를 그린 바로 그 화가지요."], ["이 그림은 언제 그렸나요?", "1905년부터 1909년 사이, 벨기에의 한 저택 벽화 밑그림으로 그렸어요."], ["검은 새는 무엇인가요?", "가지에 앉은 검은 새예요. 삶의 한가운데 앉은 시간의 새라고들 하지요. 회원님 나무라면 어느 가지쯤 앉아 있을까요."], ["가지 끝의 눈 모양은 무엇인가요?", "열매예요. 눈 모양·세모·동그라미를 번갈아 달아 나무가 보석처럼 반짝이지요."], ["뿌리 곁의 꽃은 무엇인가요?", "나무 아래 피어난 작은 꽃들이에요. 땅에서 시작해 하늘로 뻗는 생명의 흐름을 보여 주지요."], ["왜 황금빛인가요?", "클림트는 귀한 것을 금빛으로 그렸어요. 한 사람의 인생 나무만큼 귀한 것이 없다는 뜻이겠지요."], ["나도 그릴 수 있을까요?", "그럼요. 굵은 줄기를 세우고 가지 끝을 달팽이처럼 돌돌 말면 돼요. 소용돌이 크기는 자유입니다."], ["오늘 무엇을 느끼면 될까요?", "가지 하나하나가 회원님의 한 해라면 — 어떤 가지가 가장 크게 돌았나요? 그 이야기를 나무에 담아 보세요."]], "korean2": {"terms": [["소용돌이", "so-yong-do-ri", "spiral"], ["황금빛", "hwang-geum-bit", "golden"]], "words": [["나무", "na-mu", "tree"], ["가지", "ga-ji", "branch"], ["새", "sae", "bird"], ["뿌리", "ppu-ri", "root"]], "sentences": [["나무가 황금빛으로 자랍니다.", "Na-mu-ga hwang-geum-bit-eu-ro ja-ram-ni-da.", "The tree grows golden."]], "culture": [["🎨 생명의 나무", "하늘·땅·저승을 잇는 나무는 여러 문화에 전해지는 오랜 상징입니다. 클림트는 그 나무를 황금빛 소용돌이로 그려 삶의 이어짐을 담았습니다."]]}}, {"n": 24, "id": "myeonghwa:rembrandt-selfportrait", "title": "렘브란트 · 자화상 (졸업작)", "diff": "🌳", "obj": "렘브란트의 «자화상»을 단계로 따라 그려보자.", "type": "svg", "meta": "렘브란트 · 네덜란드", "note": "단계 SVG 완성 (신규 15작 · 3버튼 표준)", "viewImg": "myeonghwa/rembrandt-selfportrait/original.jpg", "svgViewer": "<svg viewBox=\"0 0 520 643\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"3.2\" stroke-linecap=\"round\">\n    <ellipse cx=\"258\" cy=\"242\" rx=\"74\" ry=\"90\"/>\n
