<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7EF">
<title>머리에 그리는 AI 스쿨</title>
<style>
  :root{--paper:#FBF7EF;--card:#FFF;--ink:#2A2622;--muted:#8A8073;--line:#E9E1D2;
        --cinnabar:#C8453B;--celadon:#5E8C7B;--night:#10162b;--tap:60px;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.55;
    font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;}
  .app{max-width:460px;margin:0 auto;min-height:100vh;padding-bottom:env(safe-area-inset-bottom);}
  header{position:sticky;top:0;z-index:5;background:rgba(251,247,239,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px;}
  .logo{width:34px;height:34px;flex:0 0 34px;}
  .brand b{font-size:17px;font-weight:800;letter-spacing:-.02em;display:block;}
  .brand span{font-size:11.5px;color:var(--muted);}
  .back{border:0;background:none;font-size:17px;color:var(--ink);padding:6px 6px 6px 0;cursor:pointer;font-weight:700;}
  main{padding:18px;}
  h2.greet{font-size:22px;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em;}
  p.lead{color:var(--muted);font-size:14px;margin:0 0 18px;}
  .area{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;cursor:pointer;min-height:var(--tap);}
  .area:active{transform:scale(.99);}
  .chip{width:48px;height:48px;flex:0 0 48px;border-radius:14px;display:flex;align-items:center;
    justify-content:center;color:#fff;font-weight:800;font-size:20px;}
  .area .t b{font-size:19px;font-weight:800;display:block;}.area .t span{font-size:13px;color:var(--muted);}
  .area .cnt{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);}.area .cnt b{display:block;font-size:18px;color:var(--ink);}
  .chev{margin-left:8px;color:var(--muted);font-size:20px;}
  .progress{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px;}
  .bar i{display:block;height:100%;background:var(--celadon);border-radius:99px;}
  .lesson{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;min-height:var(--tap);}
  .lesson:disabled{opacity:.5;}
  .num{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:#F3ECDD;display:flex;
    align-items:center;justify-content:center;font-weight:800;font-size:16px;}
  .lesson.done .num{background:var(--celadon);color:#fff;}
  .lesson .lt b{font-size:17px;font-weight:700;display:block;}.lesson .lt span{font-size:12.5px;color:var(--muted);}
  .state{margin-left:auto;font-size:20px;}
  .crumbs{font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  h1.title{font-size:23px;font-weight:800;margin:0 0 6px;letter-spacing:-.02em;}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .tag{font-size:12px;background:#F3ECDD;color:#6b6052;border-radius:99px;padding:5px 10px;}
  .obj{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:16px;margin-bottom:14px;}
  .stages{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch;}
  .stage{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:9px 15px;
    font-size:14px;font-weight:700;cursor:pointer;color:var(--muted);}
  .stage.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:200px;}
  .panel h3{margin:0 0 10px;font-size:15px;color:var(--cinnabar);letter-spacing:.02em;}
  ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;}
  ol.steps li{counter-increment:s;position:relative;padding:9px 0 9px 34px;border-bottom:1px solid var(--line);font-size:15.5px;}
  ol.steps li:last-child{border-bottom:0;}
  ol.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:24px;height:24px;background:#F3ECDD;
    border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#6b6052;}
  .blk{padding:10px 0;border-bottom:1px solid var(--line);}.blk:last-child{border-bottom:0;}
  .blk b{display:block;font-size:15.5px;margin-bottom:3px;}.blk span{font-size:14px;color:#6b6052;}
  .ph-note{margin-top:12px;font-size:12.5px;color:var(--muted);}
  .ph-note code{background:#F3ECDD;border-radius:5px;padding:1px 5px;}
  .spair{padding:12px 0;border-bottom:1px solid var(--line);}
  .spair:last-child{border-bottom:0;}
  .stxt{display:flex;gap:11px;align-items:flex-start;font-size:15.5px;}
  .snum{flex:0 0 24px;width:24px;height:24px;margin-top:1px;background:#F3ECDD;border-radius:8px;display:flex;
    align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#6b6052;}
  .simg{margin:10px 0 0 35px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#FCFAF4;}
  .simg img{width:100%;display:block;}
  .dimg{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#FCFAF4;margin-bottom:12px;}
  .dimg img{width:100%;display:block;}
  .aicard{border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:9px;overflow:hidden;cursor:pointer;}
  .aihead{display:flex;align-items:center;gap:12px;padding:13px 14px;}
  .aiemo{font-size:24px;flex:0 0 auto;}
  .aimain{flex:1;}
  .aititle{font-size:16.5px;font-weight:800;color:var(--ink);}
  .aidesc{font-size:13px;color:#7a715c;margin-top:2px;line-height:1.4;}
  .aichev{flex:0 0 auto;color:var(--muted);font-size:15px;}
  .aiex{display:none;padding:0 14px 13px 50px;}
  .aiex.on{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .aiq{font-size:15.5px;font-weight:700;color:var(--cinnabar);line-height:1.5;flex:1;min-width:60%;}
  .lesson.soon{opacity:.92;background:#F6F2FA;border-color:#E2D7EE;}
  .lesson.soon .num{background:#EFE7F7;}
  .soonbadge{background:#8A6FB0;color:#fff;border-radius:9px;padding:2px 9px;font-size:12px;font-weight:800;}
  .soonbox{background:#F3EEF8;border:1px solid #E0D5EC;border-radius:12px;padding:12px 14px;font-size:13.5px;color:#5a4a73;line-height:1.55;margin-bottom:12px;}
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
  .photo{position:relative;aspect-ratio:1;border:1px dashed var(--line);border-radius:10px;overflow:hidden;
    background:#FCFAF4;display:flex;align-items:center;justify-content:center;}
  .photo img{width:100%;height:100%;object-fit:cover;position:relative;z-index:2;}
  .photo b{position:absolute;z-index:1;font-size:10.5px;color:var(--muted);padding:6px;text-align:center;line-height:1.3;}
  .cv-wrap{position:relative;height:280px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;}
  .cv-guide{position:absolute;inset:0;opacity:.5;pointer-events:none;}
  .cv-guide svg{width:100%;height:100%;}
  canvas.cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  .cv-bar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .pen{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;}
  .pen.on{box-shadow:0 0 0 2px var(--ink);}
  .tbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer;}
  .tbtn.on{background:var(--ink);color:#fff;}
  .svgv{background:linear-gradient(180deg,#10162b,#1b2440);border-radius:14px;overflow:hidden;}
  .svgv.light{background:#FCFAF4;border:1px solid var(--line);}
  .svgv svg{display:block;width:100%;height:auto;}
  .svgv .step{opacity:0;transition:opacity .4s;}
  .svgv .step.on{opacity:1;}
  .svrow{display:flex;gap:8px;margin-top:10px;}
  .svrow button{flex:1;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:12px;
    font-size:15px;font-weight:700;cursor:pointer;min-height:48px;}
  .svrow button.pri{background:var(--cinnabar);color:#fff;border-color:var(--cinnabar);}
  .svlabel{margin-top:10px;font-size:14px;}.svlabel b{color:var(--cinnabar);}
  .kw{display:flex;gap:10px;flex-wrap:wrap;}.kw .w{background:#F3ECDD;border-radius:12px;padding:10px 14px;}
  .kw .w b{font-size:19px;display:block;}.kw .w span{font-size:12px;color:#7a715c;}
  .vsec{margin-bottom:14px;}
  .vt{font-size:11px;font-weight:800;color:#7a715c;letter-spacing:.05em;margin:4px 0 8px;}
  .vrow{display:flex;align-items:center;gap:10px;background:#F8F2E6;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:7px;}
  .vkr{font-size:18px;font-weight:800;min-width:64px;}
  .vbody{flex:1;}.vrom{font-size:12px;color:var(--cinnabar);font-weight:700;}.ven{font-size:12.5px;color:#6b6052;}
  .vplay{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:none;background:var(--celadon);color:#fff;font-size:13px;cursor:pointer;}
  .vplay.sm{width:26px;height:26px;font-size:11px;vertical-align:middle;}
  .scard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px;}
  .slbl{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--cinnabar);border-radius:8px;padding:2px 9px;margin-bottom:8px;}
  .skr{font-size:18px;font-weight:700;line-height:1.5;}.srom{font-size:12.5px;color:var(--celadon);font-weight:700;margin-top:4px;}.sen{font-size:13px;color:#6b6052;margin-top:2px;}
  .ccard{background:#EEF2F6;border-radius:14px;padding:13px 15px;margin-bottom:10px;}
  .clbl{font-size:12px;font-weight:800;color:#3a5a7a;margin-bottom:6px;}.ctxt{font-size:13.5px;line-height:1.6;color:#42463f;}
  .donebtn{display:flex;justify-content:center;align-items:center;margin-top:14px;background:var(--celadon);color:#fff;
    border:0;font-weight:800;font-size:17px;border-radius:16px;padding:16px;width:100%;cursor:pointer;}
  footer{padding:24px 18px 34px;text-align:center;color:var(--muted);font-size:12px;}
</style></head>
<body><div class="app">
  <header>
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#2A2622" stroke-width="2"/>
      <path d="M11 25 C 15 12, 25 12, 29 25" fill="none" stroke="#C8453B" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="20" cy="16" r="2.4" fill="#5E8C7B"/></svg>
    <div class="brand" id="brand"><b>머리에 그리는 AI 스쿨</b><span>머릿속에 먼저 그리고, 그다음 손으로</span></div>
  </header>
  <main id="main"></main>
  <footer>Meori Art</footer>
</div>
<script>

칸 크기가 왜 다 다른가요?", "큰 네모와 작은 네모를 섞어 균형을 맞췄어요. 한쪽이 무거우면 다른 쪽을 가볍게 해서 전체가 안정돼 보이게 한 거예요."], ["따라 그리기 쉬운가요?", "네, 아주 좋아요. 자를 대고 곧은 선을 긋고 칸을 빨강·파랑·노랑으로 칠하면 돼요. 처음 그리시는 분께 딱 맞습니다."], ["이런 그림이 어디에 쓰였나요?", "옷·가방·건물 디자인에 많이 쓰였어요. 지금도 거리에서 몬드리안 무늬를 자주 볼 수 있답니다."], ["몬드리안은 무엇을 좋아했나요?", "춤과 음악을 좋아했어요. 경쾌한 리듬을 색과 네모의 배치로 표현하려 했지요."], ["이 그림이 왜 중요한가요?", "복잡한 걸 단순하게 줄이는 현대 디자인의 출발점이 된 그림이에요. 단순함 속의 아름다움을 보여줍니다."]]}, {"n": 2, "id": "myeonghwa:matisse-icarus", "title": "마티스 · 이카루스", "diff": "🌱", "obj": "마티스의 «이카루스»를 단계로 따라 그려보자.", "type": "svg", "meta": "마티스 · 프랑스", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/matisse-icarus/original.jpg", "svgViewer": "<svg viewBox=\"0 0 360 500\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><path d=\"M180 78 c-16 2 -26 14 -24 28 c1 10 8 18 17 21 l-10 6 c-6 4 -9 10 -10 17 l-6 60 c-2 20 -1 40 2 56 l44 0 c4 -20 5 -42 3 -60 l-6 -56 c-1 -8 -5 -14 -11 -17 l-9 -5 c9 -4 15 -12 16 -22 c1 -14 -10 -26 -22 -28 z\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"2\"><path d=\"M160 130 C 122 104 92 84 70 96 C 88 114 128 138 156 150\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M200 134 C 240 152 266 184 260 206 C 240 196 212 172 196 158\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"3\"><path d=\"M166 266 C 148 330 138 398 148 452 C 158 458 170 454 176 448 C 178 390 180 330 182 276\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M198 270 C 212 330 228 388 244 428 C 236 442 222 444 214 438 C 202 394 194 336 190 278\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"4\"><circle cx=\"196\" cy=\"188\" r=\"11\" fill=\"non " fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g></svg>", "svgSteps": [{"title": "머리와 몸통", "tip": "한 덩어리로 크게."}, {"title": "팔 두 개", "tip": "하나는 하늘로, 하나는 아래로."}, {"title": "다리 두 개", "tip": "시원하게 벌려서."}, {"title": "가슴의 빨간 점", "tip": "콩콩 뛰는 심장 자리."}, {"title": "노란 별들", "tip": "뾰족뾰족, 개수는 자유."}, {"title": "파랑 바탕 칠하기", "tip": "바탕은 파랑, 몸은 검정, 점은 빨강."}], "korean2": {"words": [["별", "byeol", "star"], ["하늘", "ha-neul", "sky"], ["빨강", "ppal-gang", "red"], ["가위", "ga-wi", "scissors"]], "sentences": [["사람이 하늘을 납니다.", "Sa-ram-i ha-neul-eul nam-ni-da.", "A person flies in the sky."]], "culture": [["✂️ 가위로 그린 그림", "마티스는 노년에 붓 대신 가위로 색종이를 오려 그림을 만들었습니다. '가위로 그린다'고 말했지요."]]}, "qna": [["이 그림은 무엇을 그린 건가요?", "그리스 신화 속 하늘을 난 이카루스예요. 파란 하늘에서 별들 사이를 나는 검은 사람이지요."], ["가슴의 빨간 점은 무엇인가요?", "콩콩 뛰는 심장이에요. 하늘을 나는 설렘과 생명을 빨간 점 하나로 표현했지요."], ["왜 가위로 그림을 만들었나요?", "마티스는 노년에 큰 수술로 붓을 오래 들 수 없었어요. 그래서 침대에서 색종이를 가위로 오려 그림을 만들었지요."], ["이 사람은 떨어지는 걸까요, 춤추는 걸까요?", "정답은 없어요. 떨어지는 순간에도 춤처럼 보이는 것 — 그게 이 그림의 매력이지요."], ["마티스는 어떤 화가였나요?", "프랑스의 화가로, 색을 누구보다 자유롭게 쓴 '색채의 마술사'예요."], ["이 그림은 언제 만들었나요?", "1946년 무렵, 「재즈」라는 책에 실린 작품이에요."], ["별이 왜 뾰족뾰족한가요?", "가위로 오렸기 때문이에요. 삐죽삐죽한 별이 오히려 터지는 불꽃처럼 생생하지요."], ["나도 만들 수 있을까요?", "그럼요. 눈코입이 없는 실루엣이라 틀릴 곳이 없어요. 삐뚤어질수록 더 춤추는 것 같지요."], ["색종이로 해도 되나요?", "네, 마티스처럼 검정 색지를 가위로 오려 붙여도 훌륭해요."], ["왜 유명한가요?", "단순한 형태와 색만으로 이렇게 큰 감동을 주는 그림은 드물어요. 현대 미술의 보석이지요."]]}, {"n": 3, "id": "myeonghwa:monet-impression", "title": "모네 · 인상, 해돋이", "diff": "🌱", "obj": "모네의 «인상, 해돋이»을 단계로 따라 그려보자.", "type": "svg", "meta": "모네 · 프랑스", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/monet-impression/original.jpg", "svgViewer": "<svg viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><line x1=\"0\" y1=\"150\" x2=\"400\" y2=\"150\" stroke=\"#f3ead4\" stroke-width=\"2.2\" stroke-linecap=\"round\"/></g><g class=\"step\" data-step=\"2\"><circle cx=\"120\" cy=\"110\" r=\"26\" fill=\"#e08a3c\" stroke=\"#e08a3c\" stroke-width=\"2.6\"/></g><g cl =\"#9aa0b8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/></g></svg>", "svgSteps": [{"title": "수평선 긋기", "tip": "바다와 하늘이 만나는 가로선을 길게 긋는다."}, {"title": "해 그리기", "tip": "하늘에 작고 둥근 해를 그린다."}, {"title": "물 위 햇빛", "tip": "해 아래로 짧은 가로선을 점점이 내려 긋는다."}, {"title": "물결 선", "tip": "바다에 부드러운 물결선을 몇 줄 긋는다."}, {"title": "작은 배", "tip": "앞쪽에 배 한 척을 몇 개의 선으로 그린다."}, {"title": "먼 배경", "tip": "멀리 흐릿한 돛대·굴뚝을 세로선으로 살짝 더해 완성."}], "korean2": {"terms": [["인상", "in-sang", "impression"], ["빛", "bit", "light"]], "words": [["해", "hae", "sun"], ["바다", "ba-da", "sea"], ["아침", "a-chim", "morning"], ["배", "bae", "boat"], ["안개", "an-gae", "fog"]], "sentences": [["아침 해가 떠오릅니다.", "A-chim hae-ga tteo-o-reum-ni-da.", "The morning sun rises."]], "culture": [["🎨 모네와 인상주의", "'인상, 해돋이'에서 인상주의라는 이름이 나왔습니다. 모네는 빛과 순간의 느낌을 그렸습니다."]]}, "qna": [["이 그림은 무엇을 그린 건가요?", "이른 아침 항구에서 해가 떠오르는 모습이에요. 안개 낀 바다 위로 붉은 해와 작은 배들이 보이지요."], ["왜 흐릿하게 그렸나요?", "모네는 또렷한 형태보다 '그 순간의 빛과 느낌'을 담으려 했어요. 그래서 안개처럼 부드럽고 흐릿하게 그렸답니다."], ["'인상주의'가 이 그림에서 나왔나요?", "맞아요. 제목이 '인상, 해돋이'라서 여기서 '인상주의'라는 이름이 생겼어요. 미술 역사에서 아주 중요한 그림이지요."], ["붉은 해가 눈에 확 띄어요.", "주변은 푸르스름한데 해만 주황빛이라 더 도드라져 보여요. 모네가 색의 대비를 잘 쓴 거예요."], ["이 그림은 언제 그렸나요?", "1872년, 프랑스 르아브르라는 항구 도시에서 그렸어요."], ["모네는 무엇을 좋아했나요?", "물·빛·하늘을 좋아해 같은 풍경도 시간과 날씨를 바꿔가며 여러 번 그렸어요."], ["배들은 무엇인가요?", "항구의 작은 고깃배와 멀리 보이는 공장 굴뚝이에요. 평범한 일상의 아침 풍경이지요."], ["이 그림은 지금 어디에 있나요?", "프랑스 파리의 마르모탕 모네 미술관에 있어요."], ["나도 그릴 수 있을까요?", "네. 흐린 파랑으로 바다와 하늘을 칠하고 주황 동그라미로 해를 그리면 분위기가 살아나요."], ["이 그림이 왜 중요한가요?", "보이는 대로가 아니라 느낀 대로 그리는 새 길을 열었어요. 모네가 미술의 흐름을 바꾼 그림입니다."]]}, {"n": 4, "id": "myeonghwa:vangogh-starry-night", "title": "고흐 · 별이 빛나는 밤", "diff": "🌱", "obj": "고흐의 «별이 빛나는 밤»을 단계로 따라 그려보자.", "type": "svg", "meta": "고흐 · 네덜란드", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/vangogh-starry-night/original.jpg", "svgViewer": "<svg viewBox=\"0 0 360 600\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><path d=\"M 0 488 C 70 470, 130 500, 200 482 C 270 466, 320 492, 360 478\" fill=\"none\" stroke c3bcae\" stroke-width=\"1.6\"/><circle cx=\"40\" cy=\"250\" r=\"8.0\" fill=\"none\" stroke=\"#c3bcae\" stroke-width=\"2\"/><circle cx=\"40\" cy=\"250\" r=\"3.6\" fill=\"none\" stroke=\"#c3bcae\" stroke-width=\"1.6\"/><circle cx=\"232\" cy=\"96\" r=\"7.0\" fill=\"none\" stroke=\"#c3bcae\" stroke-width=\"2\"/><circle cx=\"232\" cy=\"96\" r=\"3.1\" fill=\"none\" stroke=\"#c3bcae\" stroke-width=\"1.6\"/><circle cx=\"170\" cy=\"70\" r=\"7.0\" fill=\"none\" stroke=\"#c3bcae\" stroke-width=\"2\"/><circle cx=\"170\" cy=\"70\" r=\"3.1\" fill=\"none\" stroke=\"#c3bcae\" stroke-width=\"1.6\"/></g></g></svg>", "svgSteps": [{"title": "언덕 지평선 긋기", "tip": "그림 아래쪽에 부드러운 언덕 선을 좌우로 길게 긋는다."}, {"title": "마을 집 그리기", "tip": "언덕 위에 작은 네모 집들을 옹기종기 그린다. 지붕은 세모로."}, {"title": "교회 첨탑 세우기", "tip": "마을 가운데에 길고 뾰족한 교회 첨탑을 하늘로 올린다."}, {"title": "사이프러스 나무", "tip": "왼쪽에 불꽃처럼 굽이치는 큰 사이프러스 나무를 위아래로 길게 그린다."}, {"title": "하늘의 큰 소용돌이", "tip": "하늘 한가운데에 둥글게 말려드는 큰 소용돌이를 그린다."}, {"title": "흐르는 바람 결", "tip": "소용돌이 옆으로 물결치는 바람 선을 길게 이어 그린다."}, {"title": "오른쪽 위 달", "tip": "오른쪽 위 구석에 둥근 달을 그리고, 둘레에 빛 테를 두른다."}, {"title": "별을 흩뿌리고 마무리", "tip": "하늘 곳곳에 동그란 별을 흩뿌리듯 그려 넣어 완성한다."}], "korean2": {"terms": [["소용돌이", "so-yong-do-ri", "swirl — 반 고흐의 특징적 표현"], ["붓터치", "but-teo-chi", "brushstroke — 붓으로 그은 자국"], ["명암", "myeong-am", "light and shadow"], ["원근법", "won-geun-beop", "perspective"], ["유화", "yu-hwa", "oil painting"]], "words": [["별", "byeol", "star"], ["밤", "bam", "night"], ["하늘", "ha-neul", "sky"], ["달", "dal", "moon"], ["마을", "ma-eul", "village"], ["나무", "na-mu", "tree"]], "sentences": [["별이 빛나는 밤입니다.", "Byeol-i bit-na-neun bam-im-ni-da.", "It is a starry night."], ["반 고흐는 별을 소용돌이로 그렸습니다.", "Ban Go-heu-neun byeol-eul so-yong-do-ri-ro geu-ryeot-seum-ni-da.", "Van Gogh painted the stars as swirls."]], "culture": [["🎨 반 고흐와 별이 빛나는 밤", "반 고흐는 1889년 프랑스 생레미 병원에 입원 중 이 그림을 그렸습니다. 창문으로 본 밤하늘을 상상과 감정으로 표현했고, 지금은 뉴욕 현대미술관에 있습니다."], ["🇰🇷 한국어로 반 고흐 읽기", "영어로는 Van Gogh이지만 한국어로는 '반 고흐'라고 읽습니다. '별빛(byeol-bit)'은 starlight라는 뜻입니다."]]}, "qna": [["고흐는 어떤 사람이었나요?", "고흐는 백여 년 전 네덜란드에서 태어난 화가예요. 마음이 여리고 그림을 무척 사랑했지요. 살아서는 그림을 거의 못 팔았지만, 지금은 온 세상이 사랑하는 화가가 되었어요."], ["왜 별을 소용돌이로 그렸나요?", "고흐는 눈에 보이는 대로가 아니라 마음에 느껴지는 대로 그렸어요. 밤하늘이 살아 움직이는 것처럼 느껴져서 별빛을 빙글빙글 소용돌이로 그렸답니다."], ["이 그림은 언제, 어디서 그렸나요?", "1889년, 고흐가 프랑스의 한 요양원에 있을 때 그렸어요. 방 창문으로 보이는 밤하늘을 기억과 상상으로 그린 그림이에요."], ["그림 속 큰 나무는 무엇인가요?", "앞쪽에 검고 길게 솟은 나무는 '사이프러스'라는 나무예요. 고흐는 이 나무를 하늘과 땅을 잇는 것처럼 그렸어요."], ["왜 파란색과 노란색을 많이 썼나요?", "고흐는 노란색을 특히 좋아했어요. 깊고 푸른 밤에 노란 별빛과 달빛이 더 따뜻하고 환하게 보이도록 두 색을 나란히 썼답니다."], ["이 그림은 지금 어디에 있나요?", "미국 뉴욕의 '현대미술관(MoMA)'에 있어요. 세계에서 가장 유명한 그림 중 하나라, 보러 오는 사람이 아주 많아요."], ["마을은 진짜 있는 곳인가요?", "아래 작은 마을과 교회는 실제 마을을 그대로 그린 건 아니에요. 고흐가 고향을 떠올리며 마음속 풍경을 더해 그린 거예요."], ["고흐는 그림을 몇 점이나 그렸나요?", "고흐는 10년 동안 800점이 넘는 그림을 그렸어요. 짧은 시간에 정말 부지런히 그렸지요."], ["나도 이렇게 그릴 수 있을까요?", "그럼요. 소용돌이는 동그라미를 빙글빙글 이어 그리면 돼요. 잘 그리는 게 중요한 게 아니라, 느낌대로 그리는 게 고흐의 방식이에요."], ["별이 빛나는 밤은 왜 유명한가요?", "밤하늘을 이렇게 마음으로 그린 그림은 그전에 없었어요. 보는 사람마다 마음이 움직여서, 노래와 영화에도 나올 만큼 사랑받는답니다."]]}, {"n": 5, "id": "myeonghwa:cezanne-apples", "title": "세잔 · 사과가 있는 정물", "diff": "🌱", "obj": "세잔의 «사과가 있는 정물»을 단계로 따라 그려보자.", "type": "svg", "meta": "세잔 · 프랑스", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/cezanne-apples/original.jpg", "svgViewer": "<svg viewBox=\"0 0 400 320\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><line x1=\"0\" y1=\"210\" x2=\"400\" y2=\"210\" stroke=\"#f3ead4\" stroke-width=\"2.6\" stroke-linecap=\"round\"/></g><g class=\"step\" data-step=\"2\"><circle cx=\"150\" cy=\"180\" r=\"42\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.6\"/></g><g class=\"step\" data-step=\"3\"><circle cx=\"225\" cy=\"190\" r=\"38\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.6\"/><circle cx=\"285\" cy=\"172\" r=\"34\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.6\"/></g><g class=\"step\" data-step=\"4\"><ellipse cx=\"215\" cy=\"212\" rx=\"130\" ry=\"20\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.6\"/></g><g class=\"step\" data-step=\"5\"><path d=\"M20 250 C 80 238,140 262,210 250 C 280 238,340 262,390 250\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M30 280 C 90 270,150 292,220 280\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"6\"><circle cx=\"150\" cy=\"180\" r=\"40\" fill=\"#c0473b\" stroke=\"none\" stroke-width=\"0\"/><circle cx=\"225\" cy=\"190\" r=\"36\" fill=\"#c0563b\" stroke=\"none\" stroke-width=\"0\"/><circle cx=\"285\" cy=\"172\" r=\"32\" fill=\"#cc6a4a\" stroke=\"none\" stroke-width=\"0\"/></g></svg>", "svgGuide": "<svg viewBox=\"0 0 400 320\" xmlns=\"http://www.w3.org/2000/svg\"><g ><line x1=\"0\" y1=\"210\" x2=\"400\" y2=\"210\" stroke=\"#9aa0b8\" stroke-width=\"2.6\" stroke-linecap=\"round\"/></g><g ><circle cx=\"150\" cy=\"180\" r=\"42\" fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2.6\"/></g><g ><circle cx=\"225\" cy=\"190\" r=\"38\" fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2.6\"/><circle cx=\"285\" cy=\"172\" r=\"34\" fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2.6\"/></g><g ><ellipse cx=\"215\" cy=\"212\" rx=\"130\" ry=\"20\" fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2.6\"/></g><g ><path d=\"M20 250 C 80 238,140 262,210 250 C 280 238,340 262,390 250\" fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M30 280 C 90 270,150 292,220 280\" fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g ><circle cx=\"150\" cy=\"180\" r=\"40\" fill=\"#9aa0b8\" fill-opacity=\"0.25\" stroke=\"none\" stroke-width=\"0\"/><circle cx=\"225\" cy=\"190\" r=\"36\" fill=\"#9aa0b8\" fill-opacity=\"0.25\" stroke=\"none\" stroke-width=\"0\"/><circle cx=\"285\" cy=\"172\" r=\"32\" fill=\"#9aa0b8\" fill-opacity=\"0.25\" stroke=\"none\" stroke-width=\"0\"/></g></svg>", "svgSteps": [{"title": "탁자 선", "tip": "화면을 가로지르는 탁자 모서리 선을 긋는다."}, {"title": "첫 사과", "tip": "둥근 사과 하나를 그린다."}, {"title": "사과 더 그리기", "tip": "곁에 사과 두어 개를 겹치게 그린다."}, {"title": "접시 타원", "tip": "사과 아래 납작한 접시를 타원으로 그린다."}, {"title": "천 주름", "tip": "탁자 위 천의 주름을 몇 개의 선으로 그린다."}, {"title": "빨강 물들이기", "tip": "사과를 발갛게 물들여 완성."}], "korean2": {"terms": [["정물", "jeong-mul", "still life"], ["형태", "hyeong-tae", "form"]], "words": [["사과", "sa-gwa", "apple"], ["과일", "gwa-il", "fruit"], ["탁자", "tak-ja", "table"], ["빨강", "ppal-gang", "red"]], "sentences": [["탁자 위에 사과가 있습니다.", "Tak-ja wi-e sa-gwa-ga it-seum-ni-da.", "There are apples on the table."]], "culture": [["🎨 세잔의 사과", "세잔은 사과 하나도 여러 방향에서 보고 그렸습니다. 현대 미술의 문을 연 화가로 불립니다."]]}, "qna": [["세잔은 왜 사과를 자주 그렸나요?", "세잔은 흔한 사과 하나도 깊이 들여다보며 형태를 연구했어요. '사과로 세상을 놀라게 하겠다'고 할 만큼 진지했지요."], ["사과가 조금 삐뚤어 보여요.", "세잔은 한 방향이 아니라 여러 방향에서 본 모습을 한 그림에 담았어요. 그래서 살짝 어긋나 보이지만 더 단단해 보입니다."], ["이건 무슨 그림인가요?", "탁자 위 과일·그릇을 그린 '정물화'예요. 움직이지 않는 사물을 차분히 관찰해 그리는 그림이지요."], ["세잔은 어떤 화가였나요?", "프랑스의 화가로, 형태를 단순한 덩어리로 보고 그렸어요. 그래서 '현대 미술의 아버지'라 불려요."], ["왜 색을 면으로 칠했나요?", "붓을 넓게 써서 색을 면처럼 쌓았어요. 그러면 사과가 둥근 덩어리로 단단하게 느껴진답니다."], ["탁자보의 주름도 정성스러워요.", "네, 세잔은 천의 주름도 사과만큼 중요하게 그렸어요. 모든 것이 짜임새 있게 어울리도록요."], ["이 그림은 언제 그렸나요?", "백여 년 전, 1890년대 무렵에 그렸어요."], ["나도 그릴 수 있을까요?", "그럼요. 둥근 사과 몇 개를 그리고 빨강·노랑·초록을 면으로 칠하면 세잔 느낌이 나요."], ["왜 유명한가요?", "사물을 단순한 형태로 보는 그의 방식이 이후 피카소 같은 화가들에게 큰 영향을 줬어요."], ["무엇을 느끼면 되나요?", "화려하지 않아도 차분하고 단단한 아름다움이 있어요. 천천히 들여다보는 맛이 있는 그림입니다."]]}, {"n": 6, "id": "myeonghwa:klee-senecio", "title": "클레 · 세네시오", "diff": "🌱", "obj": "클레의 «세네시오»를 단계로 따라 그려보자.", "type": "svg", "meta": "클레 · 스위스", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/klee-senecio/original.jpg", "svgViewer": "<svg viewBox=\"0 0 360 400\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><circle cx=\"180\" cy=\"172\" r=\"118\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.6\"/></g><g class=\"step\" data-step=\"2\"><line x1=\"180\" y1=\"54\" x2=\"180\" y2=\"290\" stroke=\"#f3ead4\" stroke-width=\" 0\" x2=\"200\" y2=\"330\" stroke=\"#9aa0b8\" stroke-width=\"2.4\"/><path d=\"M96 372 q84 -52 168 0\" stroke=\"#9aa0b8\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g></svg>", "svgSteps": [{"title": "큰 동그라미 얼굴", "tip": "컵을 대고 그려도 좋아요."}, {"title": "칸 나누기", "tip": "가로줄·세로줄 몇 개."}, {"title": "아몬드 눈과 빨간 눈동자", "tip": "좌우 위치를 살짝 다르게."}, {"title": "눈썹·코·네모 입", "tip": "눈썹은 한쪽만 — 원작도 그래요."}, {"title": "목과 어깨", "tip": "기둥 목과 둥근 어깨."}, {"title": "주황·분홍 칠하기", "tip": "이웃 칸과 색만 다르면 클레!"}], "korean2": {"words": [["얼굴", "eol-gul", "face"], ["동그라미", "dong-geu-ra-mi", "circle"], ["네모", "ne-mo", "square"], ["주황", "ju-hwang", "orange"]], "sentences": [["얼굴이 동그랗습니다.", "Eol-gul-i dong-geu-rat-seum-ni-da.", "The face is round."]], "culture": [["🎨 도형으로 만든 얼굴", "클레는 원과 네모, 선만으로 얼굴을 만들었습니다. '선을 데리고 산책한다'고 말한 화가지요."]]}, "qna": [["이 그림은 무엇을 그린 건가요?", "동그라미와 네모로 만든 얼굴이에요. 늙어 가는 배우의 얼굴이라고도 하지요."], ["눈동자가 왜 빨간가요?", "빨간 눈동자가 주황 바탕에서 우리를 물끄러미 바라봐요. 색으로 표정을 만든 거지요."], ["눈썹이 한쪽뿐이에요.", "맞아요. 한쪽 눈썹만 살짝 올려 묘한 표정을 만들었어요. 재치 있는 화가지요."], ["클레는 어떤 화가였나요?", "스위스의 화가로, '선을 데리고 산책한다'고 말했어요. 음악가처럼 그림에 리듬을 담았지요."], ["칸마다 색이 왜 다른가요?", "같은 얼굴도 빛에 따라 여러 색으로 보이니까요. 칸의 색이 어울리며 얼굴이 살아나지요."], ["이 그림은 언제 그렸나요?", "1922년에 그렸어요. 지금은 스위스 바젤 미술관에 있지요."], ["세네시오가 무슨 뜻인가요?", "꽃 이름이에요. 둥근 꽃처럼 둥근 얼굴이라 붙인 이름이라고 해요."], ["나도 그릴 수 있을까요?", "그럼요. 동그라미 하나에 줄 몇 개, 네모 입이면 완성이에요. 도형만 알면 누구나 되지요."], ["색은 어떻게 칠하나요?", "주황·분홍·노랑을 이웃 칸과 다르게만 칠하면 돼요. 정답이 없어요."], ["왜 유명한가요?", "가장 단순한 도형으로 가장 깊은 표정을 만들었기 때문이에요."]]}, {"n": 7, "id": "myeonghwa:davinci-mona-lisa", "title": "다빈치 · 모나리자", "diff": "🌱", "obj": "다빈치의 «모나리자»를 단계로 따라 그려보자.", "type": "svg", "meta": "다빈치 · 이탈리아", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/davinci-mona-lisa/original.jpg", "svgViewer": "<svg viewBox=\"0 0 360 480\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><ellipse cx=\"180\" cy=\"150\" rx=\"54\" ry=\"68\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-line "/><ellipse cx=\"204\" cy=\"404\" rx=\"34\" ry=\"18\" stroke=\"#9aa0b8\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M30 240 q40 -18 70 -4 M262 236 q40 -16 70 -2\" stroke=\"#9aa0b8\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g></svg>", "svgSteps": [{"title": "달걀형 얼굴", "tip": "갸름한 달걀 하나."}, {"title": "어깨 삼각형", "tip": "산처럼 안정된 자세."}, {"title": "머리카락과 베일", "tip": "양옆으로 흘러내리게."}, {"title": "지그시 감은 눈과 코", "tip": "눈은 지그시, 코는 선 하나."}, {"title": "미소 — 선 하나!", "tip": "입꼬리를 살짝만 올려서."}, {"title": "포갠 두 손과 배경", "tip": "타원 두 개면 충분해요."}, {"title": "차분한 색 칠하기", "tip": "배경은 어둑하게, 얼굴은 밝게."}], "korean2": {"words": [["미소", "mi-so", "smile"], ["얼굴", "eol-gul", "face"], ["손", "son", "hand"], ["수수께끼", "su-su-kke-kki", "mystery"]], "sentences": [["여인이 살짝 웃습니다.", "Yeo-in-i sal-jjak ut-seum-ni-da.", "The woman smiles slightly."]], "culture": [["🖼️ 오백 년의 미소", "모나리자의 미소는 오백 년째 수수께끼입니다. 왜 웃는지 아무도 모르지요."]]}, "qna": [["모나리자는 왜 웃고 있어요?", "오백 년째 아무도 몰라요. 그 신비한 미소 때문에 세상에서 가장 유명한 그림이 되었지요."], ["다빈치는 어떤 사람이었나요?", "그림도 그리고 하늘을 나는 기계도 설계한, 평생 질문을 멈추지 않은 사람이에요."], ["이 그림은 언제 그렸나요?", "1503년 무렵부터 여러 해에 걸쳐 그렸어요. 다빈치가 평생 곁에 둔 그림이지요."], ["눈썹이 없다던데요?", "네, 자세히 보면 눈썹이 거의 없어요. 그 시절 유행이었다고도 하고, 세월에 지워졌다고도 해요."], ["손은 왜 포개고 있나요?", "단정히 포갠 손이 차분하고 기품 있는 인상을 줘요. 초상화의 모범이 된 자세지요."], ["뒤 배경은 어디인가요?", "구불구불한 산과 강이에요. 실제 풍경이 아니라 다빈치가 상상으로 그린 곳이지요."], ["이 그림은 지금 어디에 있나요?", "프랑스 파리 루브르 박물관에 있어요. 세계에서 가장 많은 사람이 보러 오는 그림이지요."], ["나도 그릴 수 있을까요?", "그럼요. 오늘의 핵심은 미소 선 하나예요. 입꼬리를 살짝만 올리면 내 모나리자가 완성돼요."], ["닮게 못 그려도 될까요?", "물론이에요. '내 모나리자는 이렇게 웃네요'가 정답이에요."], ["왜 이렇게 유명한가요?", "보는 사람마다 미소가 다르게 보여요. 오백 년째 말을 걸어오는 그림이지요."]]}, {"n": 8, "id": "myeonghwa:munch-the-scream", "title": "뭉크 · 절규", "diff": "🌱", "obj": "뭉크의 «절규»을 단계로 따라 그려보자.", "type": "svg", "meta": "뭉크 · 노르웨이", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/munch-the-scream/original.jpg", "korean2": {"terms": [["감정", "gam-jeong", "emotion"], ["곡선", "gok-seon", "curved line"]], "words": [["하늘", "ha-neul", "sky"], ["다리", "da-ri", "bridge"], ["빨강", "ppal-gang", "red"], ["얼굴", "eol-gul", "face"]], "sentences": [["하늘이 붉습니다.", "Ha-neul-i bul-geum-ni-da.", "The sky is red."]], "culture": [["🎨 뭉크의 절규", "뭉크는 마음속 불안을 붉은 하늘과 굽이치는 선으로 표현했습니다. 감정을 그림으로 보여준 화가입니다."]]}, "qna": [["이 그림은 무엇을 그린 건가요?", "다리 위에서 한 사람이 두 손으로 얼굴을 감싸며 놀란 모습이에요. 마음속 불안을 그림으로 보여준 거예요."], ["왜 하늘이 붉은가요?", "뭉크가 본 핏빛처럼 붉은 노을을 그렸어요. 불안한 마음을 강렬한 붉은 하늘로 표현한 거예요."], ["선이 왜 구불구불한가요?", "하늘과 물이 굽이치는 곡선으로 흔들려요. 마음이 어지럽고 불안한 느낌을 선으로 나타낸 거예요."], ["뭉크는 어떤 화가였나요?", "노르웨이의 화가로, 사람의 슬픔·불안 같은 속마음을 솔직하게 그렸어요."], ["무섭기도 하고 슬프기도 해요.", "맞아요. 누구나 한 번쯤 느끼는 불안을 그려서, 보면 '나도 저럴 때가 있지' 하고 공감하게 돼요."], ["이 그림은 언제 그렸나요?", "1893년에 그렸어요. 백여 년 전 그림이지만 지금도 마음에 와닿지요."], ["뒤의 두 사람은 누구인가요?", "다리 위를 지나가는 사람들이에요. 주인공의 불안과 달리 무심히 걸어가고 있어요."], ["무엇을 느끼면 되나요?", "불안한 마음도 솔직하게 드러내도 괜찮다는 거예요. 감정을 그림으로 푼 용감한 작품이지요."], ["나도 그릴 수 있을까요?", "네. 놀란 얼굴을 단순하게 그리고 하늘을 붉게, 선을 물결처럼 그으면 분위기가 살아나요."], ["왜 이렇게 유명한가요?", "사람의 속마음을 이토록 강하게 그린 그림은 드물어요. 그래서 세계에서 가장 잘 알려진 그림 중 하나예요."]], "svgViewer": "<svg viewBox=\"0 0 360 460\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><line x1=\"20\" y1=\"150\" x2=\"300\" y2=\"330\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"20\" y1=\"180\" x2=\"300\" y2=\"360\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"2\"><path d=\"M150 150 C 120 200 132 250 120 300 C 112 340 130 380 150 410 C 176 384 186 344 180 300 C 174 250 188 200 162 156\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"3\"><ellipse cx=\"152\" cy=\"150\" rx=\"34\" ry=\"44\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"4\"><ellipse cx=\"138\" cy=\"142\" rx=\"7\" ry=\"1 순한 형태와 강한 색으로 자기만의 그림을 그렸지요."], ["이 그림은 언제 그렸나요?", "1891년 무렵, 고갱이 타히티에 막 도착했을 때 그렸어요."], ["사람들이 차분해 보여요.", "네, 화려한 색과 달리 사람들의 표정은 고요해요. 자연 속의 평온한 삶을 담으려 한 거예요."], ["배경이 단순해요.", "고갱은 자잘한 묘사를 줄이고 색면을 넓게 칠했어요. 그래서 그림이 단순하면서도 시원합니다."], ["무엇을 느끼면 되나요?", "먼 남쪽 섬의 따뜻하고 느긋한 분위기예요. 보면 잠시 쉬어가는 기분이 들어요."], ["나도 그릴 수 있을까요?", "네. 사람을 단순하게 그리고 주황·초록 같은 진한 색을 넓게 칠해 보세요."], ["왜 중요한가요?", "강한 색과 단순한 형태로 그리는 새 길을 열어, 뒤의 많은 화가에게 영향을 줬어요."]], "svgViewer": "<svg viewBox=\"0 0 420 340\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><line x1=\"10\" y1=\"244\" x2=\"410\" y2=\"244\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"2\"><path d=\"M96 244 C 92 196 116 172 150 172 C 184 172 206 196 204 244 Z\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M230 244 C 228 200 250 178 282 178 C 314 178 334 200 332 244 Z\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"3\"><circle cx=\"150\" cy=\"150\" r=\"22\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"282\" cy=\"156\" r=\"20\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M150 128 q18 8 14 30\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M282 136 q16 8 12 28\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"4\"><path d=\"M104 210 q46 14 92 0\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M236 214 q46 12 90 0\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"ro 이라 직접 보면 웅장하답니다."], ["나도 그릴 수 있을까요?", "네. 색연필이나 사인펜으로 점을 콕콕 찍어 채워 보세요. 시간은 걸려도 누구나 할 수 있어요."], ["왜 유명한가요?", "점만으로 이렇게 큰 그림을 완성한 끈기와 새로운 방법 때문이에요. 미술 역사에 남은 작품이지요."]], "svgViewer": "<svg viewBox=\"0 0 420 340\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><line x1=\"10\" y1=\"180\" x2=\"410\" y2=\"180\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"2\"><line x1=\"330\" y1=\"40\" x2=\"330\" y2=\"200\" stroke=\"#f3ead4\" stroke-width=\"6\" stroke-linecap=\"round\"/><path d=\"M330 60 q-40 -20 -70 -6 M330 90 q44 -16 72 0\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"3\"><path d=\"M150 320 C 146 250 158 214 178 214 C 198 214 210 250 206 320 Z\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M150 196 q28 -22 56 0 Z\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"178\" y1=\"196\" x2=\"178\" y2=\"214\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"4\"><path d=\"M70 320 q-2 -50 12 -50 q14 0 12 50 Z\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"82\" cy=\"258\" r=\"9\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M268 320 q-2 -40 10 -40 q12 0 10 40 Z\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"278\" cy=\"266\" r=\"8\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"5\"><path d=\"M250 180 C 280 220 300 260 300 320\" fill=\"none\" st  없어요. 그래서 백 년 넘게 사람들이 이 그림 앞에서 이야기를 짓는답니다."], ["루소는 어떤 화가였나요?", "평생 세관원으로 일하다 마흔 넘어 독학으로 그림을 시작한 화가예요."], ["독학인데 왜 유명해요?", "서툰 듯한 그림에 아무도 흉내 못 낼 순수한 꿈이 담겨 있었거든요. 피카소도 그를 존경했지요."], ["줄무늬 옷이 예뻐요.", "네, 알록달록 줄무늬가 이 그림의 보석이에요. 색은 마음대로 칠해도 좋아요."], ["만돌린은 왜 있나요?", "여인이 노래하며 길을 걷던 악사임을 알려줘요. 잠들기 전까지 연주했겠지요."], ["이 그림은 언제 그렸나요?", "1897년에 그렸어요. 지금은 뉴욕 현대미술관에 있지요."], ["나도 그릴 수 있을까요?", "그럼요. 사람과 사자가 서툴수록 루소답습니다. 루소도 독학이었으니까요."], ["달은 어떻게 그리나요?", "동그라미 하나면 돼요. 달이 있어야 밤의 고요함이 살아나지요."], ["이 그림에 내 이야기를 붙여도 되나요?", "물론이에요. 그게 오늘의 숙제 — 나의 달빛 기억을 이야기로 만들어 보세요."]]}, {"n": 14, "id": "myeonghwa:millet-angelus", "title": "밀레 · 만종", "diff": "🌱", "obj": "밀레의 «만종»을 단계로 따라 그려보자.", "type": "svg", "meta": "밀레 · 프랑스", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/millet-angelus/original.jpg", "svgViewer": "<svg viewBox=\"0 0 440 340\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><line x1=\"20\" y1=\"150\" x2=\"420\" y2=\"150\" stroke=\"#f3ead4\" stroke-width=\"2.4\"/></g><g class=\"step\" data-step=\"2\"><path d=\"M168 92 c-10 1 -16 9 -15 18 c1 7 5 12 11 15 l-9 5 c-4 3 -7 7 -8 12 l-6 42 c-2 14 -2 30 0 40 l4 76 l13 1 l2 -70 l7 0 l2 70 l13 -1 l3 -78 c2 -12 1 -28 -1 -40 l-7 -40 c-1 -6 -4 -10 -9 -13 l-9 -4 c6 -3 11 -8 11 -15 c1 -9 -6 -17 -15 -18 z\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"166\" cy=\"182\" rx=\"12\" ry=\"16\" stroke=\"#f3ead4\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"3\"><path d=\"M268 108 c-9 1 -14 8 -13 16 c1 6 4 11 10 13 l-9 6 c-4 3 -7 7 -8 12 l-7 30 c-4 20 -7 40 -8 60 c-1 24 0 46 2 66 l60 0 c3 -26 3 -52 0 -78 c-2 -22 -6 -44 -11 -62 c-1 -6 -5 -10 -9 -12 l-8 -4 c6 -3 10 -8 10 -14 c1 -8 -5 -15 -13 -15 z\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"260\" cy=\"160\" rx=\"9\" ry=\"11\" stroke=\"#f3ead4\" stroke-width=\"2\" 더 경건해 보이지요."], ["밀레는 어떤 화가였나요?", "농부의 아들로 태어나 평생 일하는 사람을 그린 화가예요."], ["바구니엔 무엇이 들었나요?", "캐낸 감자예요. 하루 종일 감자를 캐다 잠시 멈춘 거지요."], ["이 그림은 언제 그렸나요?", "1857년 무렵에 그렸어요. 지금은 파리 오르세 미술관에 있지요."], ["노을은 어떻게 칠하나요?", "색연필을 뉘어 노랑에서 분홍으로 살살 이어 칠하면 돼요."], ["나도 그릴 수 있을까요?", "그럼요. 콩 모양 실루엣 두 개면 사람이 완성돼요. 얼굴을 안 그리니 실패가 없지요."], ["왜 이렇게 사랑받나요?", "평범한 하루의 끝을 이렇게 거룩하게 그린 그림은 드물어요."], ["오늘 무엇을 느끼면 될까요?", "한 주를 마치는 감사의 마음이에요. 오늘 나의 한 주도 한 문단으로 정리해 봅시다."]]}, {"n": 15, "id": "myeonghwa:degas-etoile", "title": "드가 · 에투알", "diff": "🌱", "obj": "드가의 «에투알»을 단계로 따라 그려보자.", "type": "svg", "meta": "드가 · 프랑스", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/degas-etoile/original.jpg", "svgViewer": "<svg viewBox=\"0 0 360 360\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><line x1=\"20\" y1=\"300\" x2=\"340\" y2=\"180\" stroke=\"#f3ead4\" stroke-width=\"2.2\"/></g><g class=\"step\" data-step=\"2\"><circle cx=\"216\" cy=\"150\" r=\"16\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M208 166 C 202 186 202 206 210 224 L232 220 C 236 202 232 182 224 164\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"3\"><path d=\"M224 168 C 250 148 274 128 286 108\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M206 176 C 178 180 152 188 134 198\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"4\"><path d=\"M204 224 C 168 232 150 252 156 268 C 176 280 220 282 256 272 C 274 264 274 244 252 230 C 238 222 220 220 210 222 z\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"5\"><path d=\"M212 276 L204 344 L196 350\" stroke=\"#f3ead4\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"rou  "sea"], ["배", "bae", "boat"], ["산", "san", "mountain"]], "sentences": [["파도가 이어집니다.", "Pa-do-ga i-eo-jim-ni-da.", "The waves continue."]], "culture": [["🌊 세계에서 가장 유명한 파도", "호쿠사이가 일흔 넘어 만든 판화입니다. 파도는 부서져도 다음 파도로 이어지지요."]]}, "qna": [["이 그림은 무엇을 그린 건가요?", "하늘까지 솟은 큰 파도와 그 사이 작은 배들, 멀리 후지산이에요. 세계에서 가장 유명한 파도지요."], ["호쿠사이는 몇 살에 이걸 만들었나요?", "일흔이 넘어서요. '진짜 그림은 이제부터'라고 말한 화가지요."], ["판화가 무엇인가요?", "나무판에 새겨 찍어낸 그림이에요. 그래서 선이 또렷하고 시원하지요."], ["물거품이 발톱 같아요.", "맞아요. 갈고리 발톱 모양 거품이 이 그림의 서명 같은 것이지요."], ["후지산이 왜 작게 있나요?", "큰 파도 너머 작게 보여서 파도가 더 커 보여요. 크고 작음의 마술이지요."], ["배에 탄 사람들은 괜찮을까요?", "뱃사람들이 파도에 맞서 노를 젓고 있어요. 자연 앞의 사람을 그린 거지요."], ["이 그림은 언제 만들었나요?", "1831년 무렵, 「후지산 36경」 연작의 하나예요."], ["나도 그릴 수 있을까요?", "그럼요. 큰 곡선 하나와 갈고리 반복이면 돼요. 거품 그리는 손 반복이 오늘의 즐거움이에요."], ["파도가 사나워도 되나요?", "순해도, 사나워도 다 좋아요. 회원님의 파도니까요."], ["이 그림이 주는 뜻은 뭔가요?", "파도는 부서져도 다음 파도로 이어져요 — 이야기도 그렇게 이어집니다."]]}, {"n": 17, "id": "myeonghwa:vermeer-woman-reading-letter", "title": "페르메이르 · 편지를 읽는 여인", "diff": "🌱", "obj": "페르메이르의 «편지를 읽는 푸른 옷의 여인»을 단계로 따라 그려보자.", "type": "svg", "meta": "페르메이르 · 네덜란드", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/vermeer-letter/original.jpg", "svgViewer": "<svg viewBox=\"0 0 400 380\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><rect x=\"150\" y=\"40\" width=\"180\" height=\"130\" stroke=\"#f3ead4\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M170 70 q30 20 50 0 q20 -14 40 6 M180 120 q40 14 80 -6\" stroke=\"#f3ead4\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"2\"><ellipse cx=\"176\" cy=\"130\" rx=\"20\" ry=\"24\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M186 108 q16 -6 18 10 q2 12 -8 16\" stroke=\"#f3ead4\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"3\"><path d=\"M158 152 C 140 180 130 2 실내와 빛을 사랑했지요."], ["파란 옷이 참 고와요.", "보석(청금석)을 갈아 만든 귀한 물감이에요. '페르메이르 블루'라 불리지요."], ["얼굴이 잘 안 보여요.", "고개 숙인 옆모습이라 코 선 하나면 돼요. 그 고요함이 이 그림의 핵심이에요."], ["이 그림은 언제 그렸나요?", "1663년 무렵이에요. 지금은 암스테르담 국립미술관에 있지요."], ["창문이 안 보이는데 빛은 어디서 오나요?", "왼쪽 그림 밖의 창에서요. 페르메이르는 늘 왼쪽 창의 아침빛을 그렸어요."], ["나도 그릴 수 있을까요?", "그럼요. 옆모습 달걀 머리와 넉넉한 저고리, 파랑 한 색이면 그림이 살아나요."], ["오늘 왜 이 그림인가요?", "그동안 쌓인 회원님의 글들이 오늘 한 권의 책이 되는 날이니까요."], ["무엇을 느끼면 될까요?", "글이 사람을 얼마나 붙잡는지 — 회원님의 글도 누군가를 이렇게 붙잡을 거예요."]]}, {"n": 18, "id": "myeonghwa:klimt-the-kiss", "title": "클림트 · 키스", "diff": "🌱", "obj": "클림트의 «키스»을 단계로 따라 그려보자.", "type": "svg", "meta": "클림트 · 오스트리아", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/klimt-the-kiss/original.jpg", "korean2": {"terms": [["황금빛", "hwang-geum-bit", "golden"], ["장식", "jang-sik", "ornament"]], "words": [["사랑", "sa-rang", "love"], ["황금", "hwang-geum", "gold"], ["입맞춤", "ip-mat-chum", "kiss"], ["꽃", "kkot", "flower"]], "sentences": [["두 사람이 사랑합니다.", "Du sa-ram-i sa-rang-ham-ni-da.", "The two people love each other."]], "culture": [["🎨 클림트의 키스", "금박을 붙여 반짝이게 그린 그림입니다. 사랑과 황홀함을 황금빛으로 표현했습니다."]]}, "qna": [["이 그림은 무엇을 그린 건가요?", "두 사람이 사랑을 담아 입을 맞추는 순간이에요. 온통 황금빛이라 더없이 따뜻하고 황홀해 보이지요."], ["왜 금색으로 빛나나요?", "클림트는 진짜 금박을 붙여 그렸어요. 그래서 그림이 보석처럼 반짝이고 귀하게 느껴진답니다."], ["꽃밭에 앉아 있나요?", "네, 두 사람이 꽃이 가득한 풀밭 끝에 앉아 있어요. 사랑이 활짝 피어난 모습 같지요."], ["남자와 여자 무늬가 달라요.", "남자 옷엔 곧은 네모 무늬, 여자 옷엔 둥근 꽃무늬가 있어요. 서로 다른 둘이 하나로 안긴 모습을 표현했어요."], ["클림트는 어떤 화가였나요?", "오스트리아 빈의 화가로, 화려한 장식과 금빛을 즐겨 썼어요. 사랑과 아름다움을 황금빛으로 그렸지요."], ["이 그림은 언제 그렸나요?", "1907년 무렵에 그렸어요. '클림트의 황금시대' 대표작이에요."], ["이 그림은 지금 어디에 있나요?", "오스트리아 빈의 벨베데레 미술관에 있어요. 보러 오는 사람이 아주 많답니다."], ["무슨 느낌을 담았나요?", "사랑하는 사람을 꼭 안았을 때의 포근함과 황홀함이에요. 보면 마음이 따뜻해져요."], ["나도 그릴 수 있을까요?", "네. 두 사람을 안은 모습으로 그리고 금색·노랑으로 칠한 뒤 동그란 꽃무늬를 더하면 화사해져요."], ["왜 유명한가요?", "사랑을 이렇게 아름답고 화려하게 그린 그림은 드물어요. 그래서 세계인이 가장 사랑하는 그림 중 하나예요."]], "svgViewer": "<svg viewBox=\"0 0 360 460\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><ellipse cx=\"180\" cy=\"220\" rx=\"118\" ry=\"1  "네, 칸딘스키는 소리를 들으면 색이 보이는 특별한 감각이 있었다고 해요."], ["무엇부터 그리나요?", "왼쪽 위 큰 원부터요. 그림 전체를 울리는 북소리 같은 존재지요."], ["도형 배치에 규칙이 있나요?", "정답이 없어요. 도형 하나 그릴 때마다 '무슨 소리일까' 상상하면 그림이 음악이 되지요."], ["칸딘스키는 어떤 화가였나요?", "러시아 출신으로, 형태 없는 추상화의 문을 연 화가 중 한 명이에요."], ["이 그림은 언제 그렸나요?", "1923년에 그렸어요. 지금은 뉴욕 구겐하임 미술관에 있지요."], ["자를 써도 되나요?", "네, 자를 써도 좋고 손으로 삐뚤게 그어도 좋아요. 둘 다 리듬이 되지요."], ["나도 그릴 수 있을까요?", "그럼요. 원·직선·삼각형만 알면 돼요. 배치는 회원님의 음악이에요."], ["체크무늬는 어떻게 하나요?", "부채꼴을 칸으로 나눠 색색으로 칠해요. 경쾌한 리듬이 생기지요."], ["오늘 왜 이 그림인가요?", "오늘 회원님의 이야기가 움직이는 영상이 되는 날 — 그림에도 움직임과 소리를 담아 봅시다."]]}, {"n": 21, "id": "myeonghwa:cassatt-the-letter", "title": "카사트 · 편지", "diff": "🌱", "obj": "카사트의 «편지»를 단계로 따라 그려보자.", "type": "svg", "meta": "카사트 · 미국", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/cassatt-letter/original.jpg", "svgViewer": "<svg viewBox=\"0 0 400 380\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><path d=\"M60 300 L200 250 L340 292 L210 350 z\" stroke=\"#f3ead4\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"2\"><ellipse cx=\"196\" cy=\"128\" rx=\"26\" ry=\"30\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M174 108 q22 -18 46 -2 q10 8 8 22\" stroke=\"#f3ead4\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"3\"><path d=\"M176 156 C 150 190 138 240 140 290 L260 290 C 264 244 254 198 224 160\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"4\"><path d=\"M186 168 L206 150 L222 168 L204 182 z\" stroke=\"#f3ead4\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M178 186 q10 -10 22 -8 M216 184 q10 -8 20 -2\" stroke=\"#f3ead4\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" da 요."], ["이건 유화인가요?", "판화예요. 일본 판화의 영향을 받아 선이 단정하고 무늬가 고운 작품이지요."], ["옷과 벽지 무늬가 화려해요.", "네, 파란 꽃무늬 옷과 잎사귀 벽지 — 두 무늬가 어우러진 것이 이 그림의 멋이에요."], ["누구에게 보내는 편지일까요?", "알 수 없어요. 하지만 표정을 보면 소중한 사람인 것만은 분명하지요."], ["이 그림은 언제 만들었나요?", "1890년 무렵이에요. 카사트 판화 연작의 대표작이지요."], ["3-3·5-1과 닮았어요.", "맞아요. 고개 숙인 옆모습 — 벌써 세 번째라 회원님 손이 기억하고 있을 거예요."], ["나도 그릴 수 있을까요?", "그럼요. 마름모 책상과 달걀 머리, 무늬 점점이면 완성이에요."], ["오늘은 무엇을 하나요?", "진짜 편지를 완성해서 실제로 보내는 날이에요. 그림 속 여인처럼요."], ["보내기 전에 확인할 게 있나요?", "네, 주소·계좌 같은 개인정보가 들어가지 않았는지 꼭 함께 확인해요."]]}, {"n": 22, "id": "myeonghwa:rousseau-the-dream", "title": "루소 · 꿈", "diff": "🌱", "obj": "루소의 «꿈»을 단계로 따라 그려보자.", "type": "svg", "meta": "루소 · 프랑스", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/rousseau-dream/original.jpg", "svgViewer": "<svg viewBox=\"0 0 420 350\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><path d=\"M30 320 q20 -90 10 -160 q30 40 24 120 M90 330 q30 -110 14 -190 q34 50 26 150 M330 330 q-24 -100 -10 -180 q30 46 24 146 M390 320 q-16 -80 -6 -150 q26 40 20 130\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"2\"><circle cx=\"230\" cy=\"52\" r=\"20\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"3\"><path d=\"M150 200 l6 -20 6 20 M156 180 l-10 14 M156 180 l10 14 M262 190 l6 -20 6 20 M268 170 l-10 14 M268 170 l10 14\" stroke=\"#f3ead4\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"156\" y1=\"200\" x2=\"156\" y2=\"260\" stroke=\"#f3ead4\" stroke-width=\"2\"/><line x1=\"268\" y1=\"190\" x2=\"268\" y2=\"250\" stroke=\"#f3ead4\" stroke-width=\"2\"/></g><g class=\"step\" data-step=\"4\"><circle cx=\"196\" cy=\"242\" r=\"7\" stroke=\"#f3ead4\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"222\" cy=\"242\" r=\"7\" stroke=\"#f3ead4\" stroke-width "round\" stroke-linejoin=\"round\"/><circle cx=\"108\" cy=\"112\" r=\"4\" stroke=\"#9aa0b8\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g></svg>", "svgSteps": [{"title": "큰 잎사귀들", "tip": "겹겹이 — 반복이 숲을 만들어요."}, {"title": "보름달", "tip": "하늘 틈에 둥글게."}, {"title": "연꽃 몇 송이", "tip": "뾰족 꽃잎을 별처럼."}, {"title": "숨은 사자", "tip": "수풀 사이 동그란 눈 두 개."}, {"title": "피리 부는 사람과 열매", "tip": "실루엣 + 주황 점 열매."}, {"title": "초록 세 가지 톤", "tip": "초록을 번갈아, 달과 꽃은 밝게."}], "korean2": {"words": [["숲", "sup", "forest"], ["달", "dal", "moon"], ["동화", "dong-hwa", "fairy tale"], ["초록", "cho-rok", "green"]], "sentences": [["숲에서 피리 소리가 들립니다.", "Sup-e-seo pi-ri so-ri-ga deul-lim-ni-da.", "A flute sounds in the forest."]], "culture": [["🌿 상상으로 그린 정글", "루소는 정글에 가 본 적이 없습니다. 파리 식물원만 보고 이 꿈의 숲을 상상했지요."]]}, "qna": [["이 그림은 무엇을 그린 건가요?", "달밤의 정글이에요. 연꽃이 피고 수풀엔 사자가 숨었고 누군가 피리를 불지요 — 한 편의 꿈이자 동화예요."], ["루소가 정글에 가 봤나요?", "아니요, 한 번도요! 파리 식물원만 보고 이 정글을 상상했어요. 놀라운 상상력이지요."], ["4-1의 그 화가지요?", "맞아요. 잠자는 집시를 그린 루소예요. 이 그림은 그의 마지막 대작이지요."], ["숨은그림이 있다고요?", "네, 수풀 사이 사자의 눈, 코끼리, 새 — 찾을수록 나오는 숨은그림 그림이에요."], ["잎이 몇 개나 되나요?", "루소는 초록을 스무 가지 넘게 섞어 잎을 그렸대요. 우리는 세 가지 톤이면 충분해요."], ["피리 부는 사람은 누구인가요?", "꿈속의 악사예요. 이 피리 소리가 정글 전체를 꿈으로 만들지요."], ["이 그림은 언제 그렸나요?", "1910년, 세상을 떠나던 해에 완성했어요. 지금은 뉴욕 현대미술관에 있지요."], ["나도 그릴 수 있을까요?", "그럼요. 잎을 얼마나 그리든 자유 — 지치면 거기까지가 회원님의 숲이에요."], ["오늘은 무엇을 하나요?", "내 이야기를 손주가 들을 동화로 바꾸는 날이에요. 단, 없는 사실은 만들지 않기!"], ["왜 사실 확인이 필요한가요?", "동화로 바꾸면 AI가 살을 붙이기 쉬워요. '진짜 있었던 일인가?'를 확인하는 게 검수의 첫걸음이지요."]]}, {"n": 23, "id": "myeonghwa:klimt-tree-of-life", "title": "클림트 · 생명의 나무", "diff": "🌱", "obj": "클림트의 «생명의 나무»를 단계로 따라 그려보자.", "type": "svg", "meta": "클림트 · 오스트리아", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/klimt-treeoflife/original.jpg", "svgViewer": "<svg viewBox=\"0 0 360 470\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><path d=\"M180 440 C 176 380 174 300 178 220 C 180 180 182 140 184 110\" stroke=\"#f3ead4\" stroke-width=\"5\" fill=\" 3 5 7 l-8 34 c-1 5 -5 8 -9 7 c-4 -1 -8 -6 -8 -12 z\" stroke=\"#9aa0b8\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M246 162 l10 -8\" stroke=\"#9aa0b8\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"80\" cy=\"420\" r=\"8\" stroke=\"#9aa0b8\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"120\" cy=\"432\" r=\"8\" stroke=\"#9aa0b8\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"260\" cy=\"426\" r=\"8\" stroke=\"#9aa0b8\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g></svg>", "svgSteps": [{"title": "줄기 하나", "tip": "아래는 굵게, 위로 갈수록 가늘게."}, {"title": "첫 가지 두 개", "tip": "끝을 달팽이처럼 돌돌!"}, {"title": "가지 계속", "tip": "화면이 찰 때까지 반복."}, {"title": "가지 끝 열매", "tip": "눈 모양·세모·동그라미 번갈아."}, {"title": "검은 새와 꽃", "tip": "가지 하나에 새 한 마리."}, {"title": "황금빛 나무", "tip": "나무는 황금빛, 열매는 알록달록."}], "korean2": {"words": [["나무", "na-mu", "tree"], ["가지", "ga-ji", "branch"], ["황금", "hwang-geum", "gold"], ["새", "sae", "bird"]], "sentences": [["나무가 하늘까지 자랍니다.", "Na-mu-ga ha-neul-kka-ji ja-ram-ni-da.", "The tree grows to the sky."]], "culture": [["🌳 생명의 나무", "뿌리에서 가지 끝까지 — 한 생이 자라는 모습입니다. 5-2 금빛의 화가 클림트를 다시 만나요."]]}, "qna": [["이 그림은 무엇을 그린 건가요?", "한 그루 나무에서 가지가 소용돌이치며 하늘을 채워요. 뿌리부터 가지 끝까지, 한 생이 자라는 모습이지요."], ["5-2에서 만난 화가지요?", "맞아요. 금빛을 사랑한 클림트예요. 이번엔 사랑이 아니라 인생을 금빛으로 그렸지요."], ["소용돌이 가지가 신기해요.", "가지 끝을 달팽이처럼 돌돌 만 것이 클림트의 서명 같은 표현이에요. 안에서 밖으로 말면 쉬워요."], ["검은 새는 무엇인가요?", "가지에 앉은 한 마리 새 — 인생의 나무를 지켜보는 눈 같지요."], ["열매 모양이 다 달라요.", "눈 모양, 세모, 동그라미 — 인생의 여러 순간처럼 하나하나 다르게 그렸어요."], ["이 그림은 어디에 있나요?", "브뤼셀 저택 벽화의 밑그림으로, 지금은 빈 응용미술관에 있어요."], ["나도 그릴 수 있을까요?", "그럼요. 줄기 하나에 소용돌이 가지를 반복하면 돼요. 반복하는 손이 나무를 키우지요."], ["가지에 이름을 붙여도 되나요?", "좋아요! '이 가지는 서른 살 때' — 그러면 그림이 회원님 인생의 나무가 되지요."], ["오늘은 무엇을 하나요?", "24주의 그림과 글을 전시 도록으로 엮는 날이에요. 이 나무가 도록의 표지가 되지요."], ["출처 확인은 왜 하나요?", "도록엔 날짜와 제목이 정확해야 하니까요. AI의 답도 출처와 날짜를 함께 보는 습관을 들여요."]]}, {"n": 24, "id": "myeonghwa:rembrandt-self-portrait", "title": "렘브란트 · 자화상", "diff": "🌱", "obj": "렘브란트의 «자화상»(1669)을 단계로 따라 그려보자 — 마지막 그림은 나의 자화상.", "type": "svg", "meta": "렘브란트 · 네덜란드", "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "myeonghwa/rembrandt-selfportrait/original.jpg", "svgViewer": "<svg viewBox=\"0 0 360 460\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><ellipse cx=\"180\" cy=\"170\" rx=\"58\" ry=\"70\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"2\"><path d=\"M120 138 C 126 96 168 78 196 84 C 228 92 246 116 240 144\" stroke=\"#f3ead4\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M118 128 q60 -22 124 4\" stroke=\"#f3ead4\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"3\"><path d=\"M148 162 q14 -8 26 0\" stroke=\"#f3ead4\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M188 162 q14 -8 26 0\" stroke=\"#f3ead4\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M180 172 q-2 20 -8 28\" stroke=\"#f3ead4\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M158 222 q22 10 44 0\" stroke=\"#f3ead4\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"4\"><path d=\"M122 160 C 104 180 96 210 100 238 C 108 250 122 252 130 244\" stroke=\"#f3ead4\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M238 160 C 256 180 264 210 260 238 C 252 250 238 252 230 244\" stroke=\"#f3ead4\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"5\"><path d=\"M104 420 C 110 340 ll=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M158 222 q22 10 44 0\" stroke=\"#9aa0b8\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M122 160 C 104 180 96 210 100 238 C 108 250 122 252 130 244\" stroke=\"#9aa0b8\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M238 160 C 256 180 264 210 260 238 C 252 250 238 252 230 244\" stroke=\"#9aa0b8\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M104 420 C 110 340 134 280 180 268 C 226 280 252 340 258 420\" stroke=\"#9aa0b8\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"164\" cy=\"386\" rx=\"30\" ry=\"16\" stroke=\"#9aa0b8\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"204\" cy=\"396\" rx=\"30\" ry=\"16\" stroke=\"#9aa0b8\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g></svg>", "svgSteps": [{"title": "달걀형 얼굴", "tip": "회원님 자신의 얼굴이에요."}, {"title": "베레 모자", "tip": "이마 위에 곡선 하나."}, {"title": "많은 것을 본 눈", "tip": "지그시 — 살짝 웃어도 좋아요."}, {"title": "곱슬머리", "tip": "구름처럼 둘레에."}, {"title": "어깨와 모은 손", "tip": "타원 두 개면 충분해요."}, {"title": "어둠 속의 빛", "tip": "바탕을 어둡게 칠할수록 얼굴이 빛나요."}], "korean2": {"words": [["자화상", "ja-hwa-sang", "self-portrait"], ["얼굴", "eol-gul", "face"], ["빛", "bit", "light"], ["일생", "il-saeng", "lifetime"]], "sentences": [["나는 나를 그립니다.", "Na-neun na-reul geu-rim-ni-da.", "I draw myself."]], "culture": [["🕯️ 그림으로 쓴 자서전", "렘브란트는 사십 년간 자화상을 여든 점 넘게 남겼습니다. 그림으로 자서전을 쓴 유일한 화가지요."]]}, "qna": [["렘브란트는 왜 평생 자기 얼굴을 그렸나요?", "스무 살부터 세상을 떠나는 해까지 여든 점 넘게요. 그림으로 자서전을 쓴 유일한 화가지요."], ["이 자화상은 언제 그렸나요?", "1669년, 세상을 떠나던 마지막 해의 얼굴이에요."], ["표정이 어때 보이세요?", "모든 것을 잃고도 붓을 놓지 않은, 담담하고 정직한 얼굴이지요."], ["왜 배경이 이렇게 어둡나요?", "렘브란트는 빛의 화가예요. 바탕이 어두울수록 얼굴만 촛불처럼 빛나지요."], ["렘브란트의 인생은 어땠나요?", "자신만만한 청년, 성공한 중년, 파산과 상실의 노년 — 그 모든 얼굴이 자화상으로 남았어요."], ["오늘은 누구 얼굴을 그리나요?", "회원님 자신의 얼굴이에요! 거울을 봐도, 마음속 얼굴을 그려도 좋아요."], ["닮게 못 그려도 될까요?", "물론이에요. 1-1에서 직선 몇 개로 시작한 손이 오늘 자기 얼굴을 그린다는 것 — 그 자체가 완성이지요."], ["바탕은 어떻게 칠하나요?", "갈색·검정을 겹겹이, 얼굴만 밝게 남겨요. 어두울수록 얼굴이 빛나요."], ["오늘이 졸업이라고요?", "네, 자화상과 자서전이 완성되는 날이에요. 마지막으로 검수표 일곱 항목을 함께 확인해요."], ["검수는 왜 하나요?", "AI가 썼으니 끝이 아니라, 내가 확인해야 완성이니까요. 바벨탑에서 심은 씨앗을 오늘 거두는 거예요."]]}]}, {"key": "drawing", "name": "기초드로잉", "sub": "선·기본도형 12차시", "initial": "드", "color": "#D89A3E", "stages": ["순서", "따라하기", "창작", "한국어", "AI"], "lessons": [{"n": 1, "id": "drawing:1-1", "title": "다양한 선 실험", "diff": "🌱", "obj": "다양한 선 실험을(를) 그려보자.", "type": "image", "meta": "1주차 · 선", "steps": ["아래 순서대로 그려보자."], "photos": {"base": "drawing/1-1/", "count": 4, "full": true}, "korean2": {"words": [["선", "seon", "line"]], "sentences": [["선을(를) 그립니다.", "seon-eul geu-rim-ni-da.", "I draw the line."]]}, "qna": [["선 연습이 왜 중요한가요?", "모든 그림은 선 하나에서 시작해요. 선이 손에 익으면 무엇이든 그릴 수 있으니, 가장 먼저 익히는 기초지요."], ["진한 선과 흐린 선은 어떻게 만드나요?", "연필에 힘을 주면 진하게, 힘을 빼면 흐리게 그려져요. 힘을 주었다 뺐다 하며 변화를 연습해 보세요."], ["넓은 선은 어떻게 긋나요?", "연필을 눕혀서 옆면으로 그으면 넓고 부드러운 선이 나와요. 면을 칠할 때 아주 쓸모 있지요."], ["손에 힘이 자꾸 들어가요.", "처음엔 누구나 그래요. 어깨와 손목에 힘을 빼고 천천히 그으면 선이 한결 부드러워진답니다."], ["어떤 연필이 좋은가요?", "무르고 진한 연필(B 계열)이 부드러워 어르신께 편해요. 색연필·콘테로 연습해도 좋지요."], ["선을 똑바로 못 긋겠어요.", "괜찮아요. 처음부터 곧게 긋는 사람은 없어요. 같은 선을 여러 번 그어 보면 점점 고와집니다."], ["자유롭게 그어 보라는 게 무슨 뜻인가요?", "정해진 모양 없이 손이 가는 대로 이리저리 그어 보는 거예요. 손을 푸는 좋은 준비 운동이지요."], ["하루에 얼마나 하면 되나요?", "딱 10분이면 충분해요. 매일 조금씩 꾸준히 하는 게 한 번에 많이 하는 것보다 좋아요."], ["잘 못 그려도 괜찮을까요?", "그럼요. 오늘은 잘 그리는 게 아니라 손에 익히는 시간이에요. 그은 것만으로 충분합니다."], ["오늘은 무엇을 해보면 될까요?", "진한 선, 흐린 선, 넓은 선을 한 줄씩 그어 보세요. 그게 오늘의 멋진 시작이에요."]]}, {"n": 2, "id": "drawing:1-2", "title": "직선", "diff": "🌱", "obj": "직선을(를) 그려보자.", "type": "image", "meta": "1주차 · 선", "steps": ["아래 순서대로 그려보자."], "photos": {"base": "drawing/1-2/", "count": 4, "full": true}, "korean2": {"words": [["직선", "jik-seon", "straight line"]], "sentences": [["직선을(를) 그립니다.", "jik-seon-eul geu-rim-ni-da.", "I draw the straight line."]]}, "qna": [["직선은 어떻게 곧게 긋나요?", "시작점과 끝점을 먼저 정하고, 끝점을 바라보며 한 번에 그어요. 천천히 하면 선이 곧아진답니다."], ["자를 써도 되나요?", "처음엔 자를 대고 익혀도 좋아요. 익숙해지면 자 없이 그어 보면서 손의 감을 길러요."], ["선이 자꾸 휘어요.", "괜찮아요. 손목만 쓰지 말고 팔 전체를 움직이면 더 곧게 그어져요. 여러 번 연습하면 좋아집니다."], ["가로·세로를 다 연습하나요?", "네, 가로선·세로선·사선을 골고루 그어 봐요. 방향마다 손의 느낌이 달라 두루 익히면 좋지요."], ["직선은 어디에 쓰이나요?", "건물·상자·울타리처럼 반듯한 것을 그릴 때 써요. 기본 중의 기본이라 쓸 데가 아주 많지요."], ["선 간격을 고르게 하려면요?", "눈으로 같은 간격을 가늠하며 천천히 그어요. 처음엔 어긋나도 반복하면 점점 고와집니다."], ["짧은 선이 나을까요, 긴 선이 나을까요?", "둘 다 연습하면 좋아요. 짧은 선은 또렷하게, 긴 선은 한 호흡에 죽 긋는 연습이 되지요."], ["힘 조절은 어떻게 하나요?", "처음엔 가볍게 긋고, 진하게 하고 싶으면 같은 선을 한 번 더 덧그어요. 그러면 깔끔하지요."], ["잘 못 그려도 괜찮을까요?", "그럼요. 곧은 선은 누구에게나 연습이 필요해요. 매일 몇 줄씩이면 충분합니다."], ["오늘은 무엇을 해보면 될까요?", "가로·세로·사선을 각각 몇 줄씩 그어 보세요. 곧게 긋는 감을 익히는 거예요."]]}, {"n": 3, "id": "drawing:1-3", "title": "곡선", "diff": "🌱", "obj": "곡선을(를) 그려보자.", "type": "image", "meta": "1주차 · 선", "steps": ["아래 순서대로 그려보자."], "photos": {"base": "drawing/1-3/", "count": 4, "full": true}, "korean2": {"words": [["곡선", "gok-seon", "curve"]], "sentences": [["곡선을(를) 그립니다.", "gok-seon-eul geu-rim-ni-da.", "I draw the curve."]]}, "qna": [["곡선은 어떻게 부드럽게 긋나요?", "손목을 둥글게 돌리듯 움직이면 곡선이 부드러워져요. 천천히, 한 번에 이어 그으면 좋지요."], ["곡선이 자꾸 각이 져요.", "멈췄다 그으면 각이 생겨요. 멈추지 말고 한 호흡에 죽 이어 그으면 매끄러워진답니다."], ["동그라미가 찌그러져요.", "괜찮아요. 처음엔 다 그래요. 가볍게 여러 번 돌려 그리다 보면 점점 둥글어집니다."], ["큰 곡선과 작은 곡선을 다 연습하나요?", "네, 크게도 작게도 그어 봐요. 크기를 바꿔 가며 그으면 손이 더 자유로워지지요."], ["곡선은 어디에 쓰이나요?", "꽃·과일·얼굴·구름처럼 둥근 것을 그릴 때 써요. 부드러운 것은 거의 다 곡선이지요."], ["손에 힘을 빼라는데 어렵네요.", "어깨 힘을 먼저 빼고 팔을 가볍게 움직여 보세요. 힘이 빠지면 곡선이 한결 부드러워져요."], ["물결처럼 이어진 곡선도 연습하나요?", "네, 곡선을 위아래로 이으면 물결이 돼요. 같은 동작을 반복하니 곡선 연습에 아주 좋지요."], ["천천히가 좋을까요, 빠르게가 좋을까요?", "부드러운 곡선은 적당한 속도로 죽 긋는 게 좋아요. 너무 느리면 떨리고, 너무 빠르면 어긋나지요."], ["잘 못 그려도 괜찮을까요?", "그럼요. 곡선은 손을 푸는 즐거운 연습이에요. 모양보다 부드럽게 잇는 느낌이 중요하지요."], ["오늘은 무엇을 해보면 될까요?", "큰 곡선, 물결, 동그라미를 그어 보세요. 손목을 부드럽게 쓰는 게 핵심이에요."]]}, {"n": 4, "id": "drawing:1-4", "title": "지그재그선", "diff": "🌱", "obj": "지그재그선을(를) 그려보자.", "type": "image", "meta": "1주차 · 선", "steps": ["아래 순서대로 그려보자."], "photos": {"base": "drawing/1-4/", "count": 4, "full": true}, "korean2": {"words": [["지그재그", "ji-geu-jae-geu", "zigzag"]], "sentences": [["지그재그을(를) 그립니다.", "ji-geu-jae-geu-eul geu-rim-ni-da.", "I draw the zigzag."]]}, "qna": [["지그재그선은 어떻게 그리나요?", "위로 올렸다 아래로 내렸다를 반복하며 뾰족하게 꺾어요. 톱니처럼 각이 또렷하면 잘 된 거예요."], ["꺾이는 각을 또렷하게 하려면요?", "방향을 바꿀 때 잠깐 멈췄다 반대로 그어요. 그러면 각이 분명해져 지그재그다워지지요."], ["간격을 고르게 하려면요?", "같은 높이, 같은 너비를 눈으로 가늠하며 그어요. 처음엔 어긋나도 반복하면 고와집니다."], ["지그재그는 어디에 쓰이나요?", "산봉우리·번개·뾰족한 무늬를 그릴 때 써요. 톱니 모양이 필요한 곳에 두루 쓰이지요."], ["촘촘한 지그재그도 그리나요?", "네, 간격을 좁혀 촘촘하게도 그어 봐요. 촘촘할수록 손놀림이 더 야무져지지요."], ["손목이 아파요.", "힘을 너무 줘서 그래요. 가볍게 쥐고 팔도 함께 움직이면 손목이 편해진답니다."], ["산 모양으로도 그리나요?", "네, 지그재그를 크게 그으면 산봉우리가 돼요. 풍경 그릴 때 바로 쓸 수 있지요."], ["선을 진하게 하려면요?", "한 번 그은 위에 같은 선을 덧그으면 진해져요. 또렷한 지그재그가 되지요."], ["잘 못 그려도 괜찮을까요?", "그럼요. 각이 조금 둥글어도 괜찮아요. 방향을 바꾸는 연습 자체가 도움이 됩니다."], ["오늘은 무엇을 해보면 될까요?", "지그재그를 한 줄, 촘촘한 지그재그를 한 줄, 산 모양을 하나 그어 보세요."]]}, {"n": 5, "id": "drawing:1-5", "title": "물결무늬선", "diff": "🌱", "obj": "물결무늬선을(를) 그려보자.", "type": "image", "meta": "1주차 · 선", "steps": ["아래 순서대로 그려보자."], "photos": {"base": "drawing/1-5/", "count": 4, "full": true}, "korean2": {"words": [["물결", "mul-gyeol", "wave"]], "sentences": [["물결을(를) 그립니다.", "mul-gyeol-eul geu-rim-ni-da.", "I draw the wave."]]}, "qna": [["물결무늬선은 어떻게 그리나요?", "위아래로 부드럽게 오르내리며 이어 그어요. 각이 지지 않고 둥글둥글하면 물결다워지지요."], ["지그재그와 어떻게 다른가요?", "지그재그는 뾰족하게 꺾이고, 물결은 부드럽게 굽이쳐요. 같은 오르내림이라도 느낌이 다르지요."], ["물결 높이를 고르게 하려면요?", "같은 높이로 오르내리도록 천천히 그어요. 처음엔 들쭉날쭉해도 반복하면 가지런해집니다."], ["물결무늬는 어디에 쓰이나요?", "바다·강물·머리카락·천 주름을 그릴 때 써요. 부드럽게 흐르는 건 거의 물결선이지요."], ["겹쳐 그리면 무엇이 되나요?", "물결을 여러 겹 그리면 출렁이는 바다가 돼요. 위아래로 겹치면 깊이도 느껴지지요."], ["손을 어떻게 움직이나요?", "손목을 부드럽게 좌우로 흔들듯 움직여요. 힘을 빼면 물결이 한결 자연스러워지지요."], ["촘촘한 물결도 그리나요?", "네, 간격을 좁혀 촘촘하게도 그어 봐요. 잔잔한 물결이나 천의 주름에 잘 어울리지요."], ["속도는 어떻게 하나요?", "적당한 속도로 죽 이어 그어요. 너무 느리면 떨리고, 너무 빠르면 모양이 흐트러지지요."], ["잘 못 그려도 괜찮을까요?", "그럼요. 물결은 조금 흐트러져도 자연스러워요. 부드럽게 잇는 느낌이면 충분하지요."], ["오늘은 무엇을 해보면 될까요?", "완만한 물결, 촘촘한 물결, 겹친 물결을 그어 보세요. 바다처럼 보이면 성공이에요."]]}, {"n": 6, "id": "drawing:1-6", "title": "점선", "diff": "🌱", "obj": "점선을(를) 그려보자.", "type": "image", "meta": "1주차 · 선", "steps": ["아래 순서대로 그려보자."], "photos": {"base": "drawing/1-6/", "count": 4, "full": true}, "korean2": {"words": [["점선", "jeom-seon", "dotted line"]], "sentences": [["점선을(를) 그립니다.", "jeom-seon-eul geu-rim-ni-da.", "I draw the dotted line."]]}, "qna": [["점선은 어떻게 그리나요?", "점이나 짧은 선을 일정한 간격을 두고 콕콕 찍어 이어요. 사이를 고르게 띄우는 게 핵심이지요."], ["간격을 고르게 하려면요?", "같은 크기, 같은 간격을 눈으로 가늠하며 찍어요. 처음엔 들쭉날쭉해도 반복하면 가지런해집니다."], ["점선은 어디에 쓰이나요?", "바느질 자국·길 표시·점선 무늬를 그릴 때 써요. 끊어진 듯 이어지는 선이 필요할 때 쓰지요."], ["점을 둥글게 찍으려면요?", "연필을 콕 눌렀다 떼면 둥근 점이 나와요. 짧게 누르면 작고, 길게 누르면 도톰해지지요."], ["곡선 점선도 그리나요?", "네, 곡선을 따라 점을 찍으면 곡선 점선이 돼요. 부드럽게 휘는 점선도 연습해 보면 좋지요."], ["손이 자꾸 흔들려요.", "팔꿈치를 종이에 가볍게 받치면 안정돼요. 그러면 점도 고르게 찍힌답니다."], ["점 크기를 같게 하려면요?", "누르는 힘을 일정하게 유지해요. 힘이 같으면 점 크기도 비슷해지지요."], ["점선 변형도 있나요?", "네, 작은 동그라미를 이어 찍거나 짧은 선을 섞기도 해요. 무늬처럼 보여 재미있지요."], ["잘 못 찍어도 괜찮을까요?", "그럼요. 점이 조금 달라도 괜찮아요. 간격을 맞춰 가는 연습 자체가 도움이 됩니다."], ["오늘은 무엇을 해보면 될까요?", "점을 가로로 한 줄, 점선을 한 줄, 곡선 점선을 하나 그어 보세요."]]}, {"n": 7, "id": "drawing:1-7", "title": "불규칙한 선", "diff": "🌱", "obj": "불규칙한 선을(를) 그려보자.", "type": "image", "meta": "1주차 · 선", "steps": ["아래 순서대로 그려보자."], "photos": {"base": "drawing/1-7/", "count": 4, "full": true}, "korean2": {"words": [["불규칙선", "bul-gyu-chik-seon", "free line"]], "sentences": [["불규칙선을(를) 그립니다.", "bul-gyu-chik-seon-eul geu-rim-ni-da.", "I draw the free line."]]}, "qna": [["불규칙한 선이 무엇인가요?", "정해진 모양 없이 자유롭게 그은 선이에요. 손이 가는 대로 이리저리 그으며 마음을 푸는 거지요."], ["왜 불규칙한 선을 연습하나요?", "손을 자유롭게 풀어 주고 긴장을 없애 줘요. 규칙에서 벗어나니 오히려 편안해지지요."], ["어떻게 그으면 되나요?", "구불구불, 엉키게, 빙글빙글 — 정답이 없어요. 떠오르는 대로 마음껏 그어 보세요."], ["낙서처럼 해도 되나요?", "네, 낙서가 바로 좋은 연습이에요. 잘 그리려 하지 말고 손이 노는 대로 두면 됩니다."], ["이런 선은 어디에 쓰이나요?", "헝클어진 실·구름·연기·덤불처럼 자유로운 것을 그릴 때 써요. 자연스러운 느낌을 내지요."], ["손에 힘을 어떻게 하나요?", "힘을 쭉 빼고 가볍게 움직여요. 힘이 빠질수록 선이 더 자유롭고 부드러워지지요."], ["여러 색으로 해도 되나요?", "물론이에요. 색연필로 색을 바꿔 가며 그으면 더 즐거워요. 알록달록 자유롭게요."], ["마음이 편해지는 연습인가요?", "맞아요. 잘 그릴 필요가 없으니 마음이 가벼워져요. 손도 풀리고 기분도 좋아지지요."], ["잘 못 그려도 괜찮을까요?", "이 연습엔 '잘못'이 없어요. 그은 대로 다 맞아요. 마음껏 즐기시면 됩니다."], ["오늘은 무엇을 해보면 될까요?", "아무 모양이나 손 가는 대로 자유롭게 그어 보세요. 그것만으로 훌륭한 연습이에요."]]}, {"n": 1, "id": "drawing:2-1", "title": "구", "diff": "🌱", "obj": "구을(를) 그려보자.", "type": "image", "meta": "2주차 · 기본 도형", "steps": ["아래 순서대로 그려보자."], "photos": {"base": "drawing/2-1/", "count": 4, "full": true}, "korean2": {"words": [["구", "gu", "sphere"]], "sentences": [["구을(를) 그립니다.", "gu-eul geu-rim-ni-da.", "I draw the sphere."]]}, "qna": [["구는 어떻게 그리나요?", "먼저 동그라미를 그려요. 거기에 한쪽을 어둡게 칠하는 명암을 넣으면 공처럼 둥글게 보이지요."], ["명암이 무엇인가요?", "밝은 곳과 어두운 곳을 말해요. 한쪽을 어둡게 칠하면 평평한 동그라미가 둥근 공으로 바뀌지요."], ["어느 쪽을 어둡게 칠하나요?", "빛이 오는 반대쪽을 어둡게 해요. 예를 들어 빛이 왼쪽 위에서 오면 오른쪽 아래를 어둡게 하지요."], ["빗금으로 어둡게 한다는 게 뭔가요?", "같은 방향의 짧은 선을 촘촘히 그어 어둡게 하는 거예요. 겹칠수록 더 진해지지요."], ["그림자도 그리나요?", "네, 공 아래 바닥에 그림자를 그려요. 그림자가 있으면 공이 바닥에 놓인 것처럼 안정돼 보이지요."], ["동그라미가 찌그러져요.", "괜찮아요. 가볍게 여러 번 돌려 그리면 점점 둥글어져요. 처음엔 누구나 그렇답니다."], ["명암을 부드럽게 잇는 법이 있나요?", "어두운 데서 밝은 데로 갈수록 힘을 점점 빼요. 그러면 자연스럽게 이어져 둥글어 보이지요."], ["구는 무엇을 그릴 때 도움이 되나요?", "사과·공·열매처럼 둥근 것을 그릴 때 바로 쓰여요. 둥근 것의 기본이 되지요."], ["나도 그릴 수 있을까요?", "그럼요. 동그라미를 그리고 한쪽을 빗금으로 어둡게 한 뒤 바닥에 그림자를 더하면 돼요."], ["오늘은 무엇을 해보면 될까요?", "동그라미 하나에 명암과 그림자를 넣어 공으로 만들어 보세요. 입체의 첫걸음이에요."]]}, {"n": 2, "id": "drawing:2-2", "title": "정육면체", "diff": "🌱", "obj": "정육면체을(를) 그려보자.", "type": "image", "meta": "2주차 · 기본 도형", "steps": ["아래 순서대로 그려보자."], "photos": {"base": "drawing/2-2/", "count": 4, "full": true}, "korean2": {"words": [["정육면체", "jeong-yuk-myeon-che", "cube"]], "sentences": [["정육면체을(를) 그립니다.", "jeong-yuk-myeon-che-eul geu-rim-ni-da.", "I draw the cube."]]}, "qna": [["정육면체는 어떻게 그리나요?", "앞면 사각형을 그리고, 뒤 모서리를 사선으로 이어 윗면과 옆면을 만들어요. 그러면 상자처럼 보이지요."], ["사선으로 잇는 이유가 있나요?", "비스듬한 사선이 있어야 깊이가 생겨 입체로 보여요. 사선이 평행하면 더 반듯하지요."], ["세 면의 밝기를 다르게 하나요?", "네, 윗면은 밝게·옆면은 중간·앞면이나 한쪽은 어둡게 해요. 면마다 밝기가 달라야 입체감이 살지요."], ["왜 면마다 밝기가 다른가요?", "빛이 닿는 정도가 면마다 다르기 때문이에요. 밝고 어두움을 나누면 진짜 상자처럼 보이지요."], ["모서리가 잘 안 맞아요.", "괜찮아요. 연하게 먼저 그려 보고 맞으면 진하게 덧그려요. 그러면 깔끔하게 맞출 수 있지요."], ["보이지 않는 뒤 모서리도 그리나요?", "연습할 땐 점선으로 그려 보면 구조를 이해하기 좋아요. 완성할 땐 지워도 되지요."], ["명암은 어떻게 넣나요?", "어두운 면을 빗금으로 촘촘히 칠해요. 면 전체를 고르게 어둡게 하면 단단해 보이지요."], ["정육면체는 무엇에 도움이 되나요?", "상자·건물·가구처럼 각진 것을 그릴 때 바로 쓰여요. 각진 것의 기본이 되지요."], ["나도 그릴 수 있을까요?", "그럼요. 사각형을 그리고 뒤 모서리를 사선으로 이은 뒤 면마다 밝기를 달리하면 됩니다."], ["오늘은 무엇을 해보면 될까요?", "정육면체를 하나 그리고 세 면의 밝기를 다르게 칠해 보세요. 각진 입체의 기본이에요."]]}, {"n": 3, "id": "drawing:2-3", "title": "원기둥", "diff": "🌱", "obj": "원기둥을(를) 그려보자.", "type": "image", "meta": "2주차 · 기본 도형", "steps": ["아래 순서대로 그려보자."], "photos": {"base": "drawing/2-3/", "count": 4, "full": true}, "korean2": {"words": [["원기둥", "won-gi-dung", "cylinder"]], "sentences": [["원기둥을(를) 그립니다.", "won-gi-dung-eul geu-rim-ni-da.", "I draw the cylinder."]]}, "qna": [["원기둥은 어떻게 그리나요?", "위에 납작한 타원을 그리고, 양옆으로 곧은 선을 내린 뒤 아래를 둥글게 닫아요. 그러면 기둥 모양이 되지요."], ["위는 왜 타원으로 그리나요?", "둥근 윗면을 비스듬히 보면 납작한 타원으로 보여요. 동그라미가 아니라 타원이어야 자연스럽지요."], ["옆면 명암은 어떻게 넣나요?", "한쪽 옆을 진하게, 가운데를 밝게, 반대쪽을 중간으로 칠해요. 둥글게 휘는 명암이 핵심이지요."], ["왜 가운데를 밝게 하나요?", "둥근 면은 가운데가 빛을 가장 많이 받아요. 가운데를 밝게 두면 통처럼 둥글어 보이지요."], ["아래도 타원으로 그리나요?", "네, 아랫면도 살짝 둥근 곡선으로 닫아요. 위아래가 둥글어야 원기둥다워지지요."], ["선이 곧게 안 내려와요.", "괜찮아요. 양옆 선을 연하게 먼저 긋고 맞으면 진하게 덧그려요. 자를 잠깐 써도 좋지요."], ["원기둥은 무엇을 그릴 때 쓰나요?", "컵·캔·나무 기둥·병처럼 둥근 통 모양을 그릴 때 써요. 쓸 데가 아주 많지요."], ["명암을 부드럽게 하려면요?", "어두운 쪽에서 밝은 쪽으로 갈수록 힘을 빼요. 그러면 둥글게 휘는 느낌이 자연스러워지지요."], ["나도 그릴 수 있을까요?", "그럼요. 위에 타원, 양옆에 곧은 선, 아래 곡선을 그리고 옆면에 명암을 넣으면 됩니다."], ["오늘은 무엇을 해보면 될까요?", "원기둥을 하나 그리고 옆면에 둥근 명암을 넣어 보세요. 컵이나 통을 그리는 기본이에요."]]}, {"n": 4, "id": "drawing:2-4", "title": "축구공", "diff": "🌱", "obj": "축구공을(를) 그려보자.", "type": "image", "meta": "2주차 · 기본 도형", "steps": ["아래 순서대로 그려보자."], "photos": {"base": "drawing/2-4/", "count": 4, "full": true}, "korean2": {"words": [["축구공", "chuk-gu-gong", "soccer ball"]], "sentences": [["축구공을(를) 그립니다.", "chuk-gu-gong-eul geu-rim-ni-da.", "I draw the soccer ball."]]}, "qna": [["축구공은 어떻게 그리나요?", "먼저 원을 그리고, 가운데에 오각형을 그려요. 그 둘레로 육각형을 이어 붙이면 축구공 무늬가 되지요."], ["왜 오각형부터 그리나요?", "가운데 오각형을 기준으로 삼아야 둘레 무늬가 고르게 퍼져요. 중심을 먼저 잡는 게 핵심이지요."], ["오각형·육각형이 헷갈려요.", "오각형은 변이 다섯, 육각형은 여섯이에요. 가운데 검게 칠하는 게 오각형, 그 사이를 채우는 게 육각형이지요."], ["무늬가 자꾸 어긋나요.", "괜찮아요. 연하게 먼저 그려 보고 모양이 맞으면 진하게 덧그려요. 천천히 하면 점점 맞아집니다."], ["검게 칠하는 부분은 어디인가요?", "오각형 칸을 검게 칠해요. 검은 오각형과 흰 육각형이 번갈아 있어야 축구공다워지지요."], ["둥근 느낌은 어떻게 내나요?", "공의 가장자리로 갈수록 무늬를 작고 휘어지게 그려요. 그러면 평면이 아니라 둥근 공처럼 보이지요."], ["바느질 선도 그리나요?", "네, 칸과 칸 사이에 짧은 선을 더하면 진짜 축구공 같아요. 마지막에 상표를 그려도 재미있지요."], ["이 그림이 왜 좋은 연습인가요?", "원·오각형·육각형·명암을 한 번에 익힐 수 있어요. 앞서 배운 도형 연습이 다 모인 그림이지요."], ["나도 그릴 수 있을까요?", "그럼요. 원을 그리고 가운데 오각형부터 차근차근 둘레를 채우면 됩니다. 천천히 하면 누구나 돼요."], ["오늘은 무엇을 해보면 될까요?", "원에 오각형을 그리고 둘레에 육각형을 이어 축구공을 완성해 보세요. 칸을 칠하면 더 멋져요."]]}, {"n": 5, "id": "drawing:2-5", "title": "종이상자", "diff": "🌱", "obj": "종이상자을(를) 그려보자.", "type": "image", "meta": "2주차 · 기본 도형", "steps": ["아래 순서대로 그려보자."], "photos": {"base": "drawing/2-5/", "count": 4, "full": true}, "korean2": {"words": [["상자", "sang-ja", "box"]], "sentences": [["상자을(를) 그립니다.", "sang-ja-eul geu-rim-ni-da.", "I draw the box."]]}, "qna": [["종이상자는 어떻게 그리나요?", "정육면체처럼 앞면을 그리고 옆·윗면을 사선으로 이어요. 거기에 뚜껑이나 접힌 면을 더하면 상자가 되지요."], ["정육면체와 무엇이 다른가요?", "기본은 같지만 상자는 뚜껑·접힌 자국·두께가 있어요. 그 작은 부분을 더하면 진짜 상자처럼 보이지요."], ["뚜껑은 어떻게 그리나요?", "윗면 가장자리에 얇은 두께를 그리거나 열린 뚜껑을 사선으로 더해요. 그러면 상자다운 느낌이 살지요."], ["세 면의 밝기를 다르게 하나요?", "네, 윗면은 밝게·옆면은 어둡게 나눠요. 면마다 밝기가 달라야 단단한 상자로 보이지요."], ["모서리를 또렷하게 하려면요?", "모서리 선을 진하게 덧그어요. 모서리가 분명해야 상자가 야무져 보이지요."], ["접힌 면도 그리나요?", "네, 상자 뚜껑의 접힌 자국을 그리면 더 사실 같아요. 작은 디테일이 그림을 살리지요."], ["명암은 어떻게 넣나요?", "빛 반대쪽 면을 빗금으로 어둡게 칠해요. 바닥에 그림자를 더하면 더 안정돼 보이지요."], ["상자 그리기가 왜 좋은 연습인가요?", "직선·사선·명암을 모두 쓰는 종합 연습이에요. 가구나 건물 그리기로 이어지는 기초가 되지요."], ["나도 그릴 수 있을까요?", "그럼요. 정육면체를 그리고 뚜껑과 두께, 명암을 더하면 종이상자가 됩니다."], ["오늘은 무엇을 해보면 될까요?", "상자를 하나 그리고 뚜껑과 명암을 더해 보세요. 2주차 도형 연습의 마무리예요."]]}]}, {"key": "heritage", "name": "한국문화유산", "sub": "여행 전 한국어", "initial": "유", "color": "#3E7E8C", "stages": ["감상", "순서", "따라하기", "창작", "한국어", "AI"], "lessons": [{"n": 1, "id": "heritage:seoul-jongmyo", "title": "종묘 정전", "diff": "🌱", "obj": "종묘 정전을(를) 따라 그리며 한국어로 배워보자.", "type": "svg", "meta": "드로잉 포인트: 긴 수평선·기둥 반복", "korean": {"ko": "종묘", "rom": "Jongmyo", "en": "royal shrine"}, "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "heritage/seoul-jongmyo/original.jpg", "qna": [["종묘는 어떤 곳인가요?", "조선 왕과 왕비의 신주(위패)를 모시고 제사를 지내던 사당이에요. 600년 넘게 이어진 귀한 곳이라 세계유산으로 지정됐지요."], ["정전이 무엇인가요?", "종묘에서 가장 중심이 되는 긴 건물이에요. 기둥이 줄지어 늘어선 모습이 장엄하고 단정하지요."], ["왜 이렇게 옆으로 긴가요?", "모시는 왕이 늘어날 때마다 칸을 옆으로 이어 붙였어요. 그래서 우리나라에서 가장 긴 목조 건물이 되었지요."], ["지금도 제사를 지내나요?", "네, 해마다 '종묘제례'라는 제사를 지내요. 그때의 음악과 춤도 함께 세계유산으로 이어지고 있지요."], ["그리기 좋은 점이 뭔가요?", "긴 수평 지붕선과 줄지어 선 기둥이에요. 곧은 가로선과 세로 기둥을 반복해 그리면 장엄함이 살지요."], ["언제 가면 좋은가요?", "조용히 걷기 좋은 곳이라 평일 낮이 좋아요. 제례가 있는 날엔 옛 의식을 직접 볼 수도 있지요."], ["여기서 쓸 한국어 한마디는?", "“여기는 어디예요?”라고 물어보세요. 길을 묻는 가장 쉬운 한국어랍니다."], ["입장할 때 필요한 말은?", "“표는 어디서 사요?”라고 하면 돼요. 매표소를 찾을 때 쓰는 말이지요."], ["나도 그릴 수 있을까요?", "그럼요. 긴 가로선으로 지붕을 긋고 아래 기둥을 같은 간격으로 그리면 종묘 정전이 돼요."], ["오늘 무엇을 느끼면 될까요?", "조상을 기리는 단정하고 고요한 마음을 느껴 보세요. 그게 종묘에 담긴 정신이에요."]], "svgViewer": "<svg viewBox=\"0 0 460 300\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><line x1=\"30\" y1=\"250\" x2=\"430\" y2=\"250\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><line x1=\"30\" y1=\"262\" x2=\"430\" y2=\"262\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\"/></g><g class=\"step\" data-step=\"2\"><line x1=\"40\" y1=\"96\" x2=\"420\" y2=\"96\" stroke=\"#f3ead4\" stroke-width=\"3\" stroke-linecap=\"round\"/></g><g class=\"step\" data-step=\"3\"><path d=\"M30 130 q200 -12 400 0\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"4\"><line x1=\"70\" y1=\"130\" x2=\"70\" y2=\"250\" stroke=\"#f3ead4\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"106\" y1=\"130\" x2=\"106\" y2=\"250\" stroke=\"#f3ead4\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"142\" y1=\"130\" x2=\"142\" y2=\"250\" stroke=\"#f3ead4\" stroke-width=\"2.2\" stroke-linecap=\" cap=\"round\"/><line x1=\"70\" y1=\"190\" x2=\"394\" y2=\"190\" stroke=\"#9aa0b8\" stroke-width=\"1.2\" stroke-linecap=\"round\"/></g></svg>"}, {"n": 2, "id": "heritage:seoul-bukchon", "title": "북촌한옥마을", "diff": "🌿", "obj": "북촌한옥마을을(를) 따라 그리며 한국어로 배워보자.", "type": "svg", "meta": "드로잉 포인트: 처마 선·골목 원근", "korean": {"ko": "한옥", "rom": "hanok", "en": "traditional house"}, "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "heritage/seoul-bukchon/original.jpg", "qna": [["북촌한옥마을은 어떤 곳인가요?", "기와집 한옥이 골목마다 모여 있는 동네예요. 두 옛 궁궐 사이에 자리해 지금도 사람이 사는 마을이지요."], ["한옥이 무엇인가요?", "나무와 흙, 기와로 지은 우리 전통 집이에요. 처마 곡선과 마당이 정겹고 사철 살기에 좋지요."], ["처마가 왜 살짝 올라가 있나요?", "끝이 살짝 들린 처마는 비를 멀리 흘려보내고 햇빛을 조절해요. 곡선이 멋스럽기도 하지요."], ["골목이 왜 좁고 구불구불한가요?", "옛 마을이 그대로 남아서 그래요. 좁은 골목을 걷다 보면 옛 서울로 돌아간 듯하지요."], ["그리기 좋은 점이 뭔가요?", "줄지은 기와지붕의 처마 선과 골목의 원근이에요. 처마 곡선을 반복하고 골목을 멀어지게 그리면 좋지요."], ["언제 가면 좋은가요?", "이른 아침이 한적해서 좋아요. 사람이 사는 곳이라 조용히 다니는 게 예의랍니다."], ["여기서 쓸 한국어 한마디는?", "“사진 찍어도 돼요?”라고 먼저 물어보세요. 예의 바른 여행자의 한국어예요."], ["길을 물을 때 한마디는?", "“이 길로 가면 돼요?”라고 하면 돼요. 골목에서 길을 확인할 때 쓰지요."], ["나도 그릴 수 있을까요?", "그럼요. 살짝 올라간 처마 선을 여러 개 겹쳐 그리면 한옥 지붕이 돼요."], ["오늘 무엇을 느끼면 될까요?", "옛집의 곡선과 골목의 정취를 느껴 보세요. 따뜻한 옛 동네의 마음이지요."]], "svgViewer": "<svg viewBox=\"0 0 420 320\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><line x1=\"60\" y1=\"300\" x2=\"200\" y2=\"170\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"360\" y1=\"300\" x2=\"220\" y2=\"170\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"2\"><path d=\"M 40 136 Q 120 160 120 160 Q 120 160 200 136\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"3\"><path d=\"M 150 106 Q 225 130 225 130 Q 225 130 300 106\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path "round\"/><line x1=\"330\" y1=\"122\" x2=\"330\" y2=\"280\" stroke=\"#9aa0b8\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"86\" y=\"150\" width=\"20\" height=\"40\" fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"138\" y=\"150\" width=\"20\" height=\"40\" fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"190\" y=\"150\" width=\"20\" height=\"40\" fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"242\" y=\"150\" width=\"20\" height=\"40\" fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"294\" y=\"150\" width=\"20\" height=\"40\" fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g></svg>"}, {"n": 4, "id": "heritage:seoul-changdeokgung-huwon", "title": "창덕궁 후원", "diff": "🌿", "obj": "창덕궁 후원을(를) 따라 그리며 한국어로 배워보자.", "type": "svg", "meta": "드로잉 포인트: 부용지·정자·숲 곡선", "korean": {"ko": "후원", "rom": "huwon", "en": "secret garden"}, "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "heritage/seoul-changdeokgung-huwon/original.jpg", "qna": [["창덕궁 후원은 어떤 곳인가요?", "궁궐 뒤편의 아름다운 정원이에요. 연못과 정자가 숲과 어우러져, 세계유산으로 지정된 귀한 곳이지요."], ["'비밀의 정원'이라고도 하던데요?", "네, 왕과 가족만 거닐던 깊은 정원이라 그렇게 불려요. 지금은 우리도 거닐 수 있지요."], ["부용지가 무엇인가요?", "후원에 있는 네모난 연못이에요. 물가에 정자가 있어 풍경이 그림처럼 곱지요."], ["자연을 그대로 살렸다던데요?", "맞아요. 산과 나무를 깎지 않고 그 사이에 정자와 연못을 살짝 두었어요. 자연과 어우러진 멋이지요."], ["그리기 좋은 점이 뭔가요?", "연못의 잔잔한 곡선과 정자, 둘러싼 숲의 곡선이에요. 부드러운 곡선을 살려 그리면 운치가 나지요."], ["언제 가면 좋은가요?", "단풍 드는 가을이 특히 아름다워요. 정해진 시간에 안내를 받아 둘러보는 곳이지요."], ["여기서 쓸 한국어 한마디는?", "“참 아름다워요.”라고 말해 보세요. 감탄을 전하는 따뜻한 한국어예요."], ["안내를 받을 때 한마디는?", "“같이 가도 돼요?”라고 하면 돼요. 안내 시간에 합류할 때 쓰지요."], ["나도 그릴 수 있을까요?", "그럼요. 잔잔한 연못을 곡선으로 그리고 물가에 작은 정자를 얹으면 돼요."], ["오늘 무엇을 느끼면 될까요?", "자연과 어우러진 고요한 아름다움을 느껴 보세요. 후원의 마음이지요."]], "svgViewer": "<svg viewBox=\"0 0 420 320\" xmlns 러져 경치가 시원하지요."], ["성을 왜 산 위에 쌓았나요?", "산은 그 자체가 든든한 방어막이에요. 능선을 따라 쌓으면 적을 막기에 좋았지요."], ["성벽 돌이 시대마다 다르다던데요?", "네, 쌓은 시기에 따라 돌 모양이 달라요. 자세히 보면 우리 역사의 흐름이 돌에 담겨 있지요."], ["그리기 좋은 점이 뭔가요?", "울퉁불퉁한 바위 능선과 그 위를 잇는 성곽 선이에요. 거친 바위와 곧은 성벽을 함께 그리면 멋지지요."], ["언제 가면 좋은가요?", "맑은 날 해 질 무렵이 좋아요. 성벽 위에서 서울 시내가 한눈에 보이지요."], ["여기서 쓸 한국어 한마디는?", "“경치가 좋아요.”라고 말해 보세요. 풍경에 감탄하는 한국어예요."], ["길을 오를 때 한마디는?", "“얼마나 걸려요?”라고 물어보세요. 걷는 시간을 확인할 때 쓰지요."], ["나도 그릴 수 있을까요?", "그럼요. 울퉁불퉁한 능선을 긋고 그 위에 성벽 돌을 이어 그리면 돼요."], ["오늘 무엇을 느끼면 될까요?", "산과 성이 어우러진 시원한 기상을 느껴 보세요. 옛 서울을 지킨 든든함이지요."]], "svgViewer": "<svg viewBox=\"0 0 440 300\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><path d=\"M10 150 L70 110 L120 150 L180 96 L250 150 L320 110 L380 150 L430 120\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"2\"><circle cx=\"70\" cy=\"110\" r=\"18\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"180\" cy=\"100\" r=\"22\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"320\" cy=\"112\" r=\"18\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"3\"><path d=\"M10 200 L80 170 L160 200 L260 176 L360 200 L430 182\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"4\"><path d=\"M10 230 L80 202 L160 230 L260 208 L360 230 L430 214\" fill=\"none\" stroke=\"#f3ead4\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"step\" data-step=\"5\"><line x1=\"40\" y1=\"206\" x2=\"40\" y2=\"226\" stroke=\"#f3ead4\" stroke-width=\"0.9\" stroke-linecap=\"round\"/><line x1=\"70\" y1=\"206\" x2=\"70\" y2=\"226\" stroke=\"#f3ead4\" stroke-width=\"0.9\" stroke-linecap=\" x2=\"48\" y2=\"150\" fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"320\" y1=\"110\" x2=\"312\" y2=\"150\" fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"96\" y1=\"150\" x2=\"92\" y2=\"240\" stroke=\"#9aa0b8\" stroke-width=\"8\" stroke-linecap=\"round\"/><line x1=\"268\" y1=\"150\" x2=\"272\" y2=\"240\" stroke=\"#9aa0b8\" stroke-width=\"8\" stroke-linecap=\"round\"/><line x1=\"30\" y1=\"244\" x2=\"330\" y2=\"244\" fill=\"none\" stroke=\"#9aa0b8\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g></svg>"}, {"n": 8, "id": "heritage:seoul-namsan-beacon", "title": "남산 봉수대", "diff": "🌱", "obj": "남산 봉수대을(를) 따라 그리며 한국어로 배워보자.", "type": "svg", "meta": "드로잉 포인트: 5개 돌탑·연기", "korean": {"ko": "봉수대", "rom": "bongsudae", "en": "beacon"}, "note": "단계 SVG 완성 (선으로 해체)", "viewImg": "heritage/seoul-namsan-beacon/original.jpg", "qna": [["봉수대는 무엇인가요?", "옛날에 불과 연기로 소식을 전하던 곳이에요. 산 위에서 멀리까지 위급한 소식을 알렸지요."], ["불을 어떻게 신호로 썼나요?", "낮에는 연기로, 밤에는 불빛으로 알렸어요. 위급한 정도에 따라 피우는 개수를 달리했지요."], ["돌탑이 왜 다섯 개인가요?", "신호의 단계를 다섯으로 나눴기 때문이에요. 평온하면 하나, 위급하면 다섯을 피웠지요."], ["남산에 왜 두었나요?", "남산은 높아서 사방이 잘 보여요. 서울로 들어오는 소식을 모으기에 알맞은 자리였지요."], ["그리기 좋은 점이 뭔가요?", "나란히 선 다섯 돌탑과 피어오르는 연기예요. 돌탑을 같은 간격으로 그리고 연기를 곡선으로 올리면 좋지요."], ["지금도 시연을 하나요?", "네, 정해진 시간에 불 피우는 모습을 보여 줘요. 옛 통신을 직접 볼 수 있어 흥미롭지요."], ["여기서 쓸 한국어 한마디는?", "“저게 뭐예요?”라고 물어보세요. 멀리 있는 것을 가리키며 묻는 말이에요."], ["시간을 물을 때 한마디는?", "“몇 시에 해요?”라고 하면 돼요. 시연 시간을 확인할 때 쓰지요."], ["나도 그릴 수 있을까요?", "그럼요. 돌탑 다섯 개를 나란히 그리고 위로 연기를 구불구불 올리면 봉수대가 돼요."], ["오늘 무엇을 느끼면 될까요?", "불빛으로 소식을 잇던 옛 지혜를 느껴 보세요. 멀리까지 마음을 전한 거지요."]], "svgViewer": "<svg viewBox=\"0 0 420 300\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"step\" data-step=\"1\"><line x1=\"30\" y1=\"212\" x2=\"390\" y2=\"212\" stroke=\"#f3ead4\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"30\" y1=\"224\" x2=\"390\" y2=\"224\" stroke=\"#f3ead4\" stroke-widt
